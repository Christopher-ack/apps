<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GIFbox">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141118">
<title>GIFbox</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141118; --s1:#1D1923; --s2:#26212E; --s3:#312A3B; --line:#352E40; --line2:#463D54;
  --ink:#F6F2FA; --muted:#AFA4BD; --dim:#7D7290;
  --pink:#FF5FA2; --violet:#8D6BFF; --sun:#FFD23F; --mint:#3FD9A6; --red:#FF6B6B;
  --acc:var(--pink); --acc-ink:#2A0717;
  --display:"Fredoka","Avenir Next Rounded","Trebuchet MS",sans-serif;
  --body:"Nunito Sans","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --r:18px; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(800px 420px at 100% -10%,rgba(141,107,255,.16),transparent 60%),radial-gradient(700px 380px at -10% 0%,rgba(255,95,162,.12),transparent 60%),var(--bg);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px;border-radius:8px}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}

.appbar{position:sticky;top:0;z-index:30;background:rgba(20,17,24,.84);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.appbar .wrap{display:flex;align-items:center;gap:10px;height:56px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:.01em}
.brand svg{width:32px;height:32px}
.me{margin-left:auto;display:flex;text-decoration:none}
.me .signin{border:1px solid var(--line2);background:var(--s2);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.wa-av{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;background:var(--h,#556);color:#1a1020;font-weight:800;overflow:hidden;flex:none}
.wa-av img{width:100%;height:100%;object-fit:cover}.wa-av.xl{width:62px;height:62px;font-size:26px}.wa-av svg{width:70%;fill:var(--muted)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(20,17,24,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;text-decoration:none;color:var(--dim);font-size:11.5px;font-weight:800;letter-spacing:.02em}
.tabs a svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"] svg{stroke:var(--pink)}
.tabs a.add .plus{width:50px;height:38px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--violet));box-shadow:0 6px 18px rgba(255,95,162,.35)}
.tabs a.add .plus svg{stroke:#fff;stroke-width:2.6}

.head{display:flex;align-items:center;gap:10px;padding:18px 0 12px}
.head h1{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.1;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.head .sub{display:block;font-family:var(--body);font-size:13.5px;font-weight:600;color:var(--muted);margin-top:3px}
.back{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s1);border:1px solid var(--line);flex:none;text-decoration:none}
.back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;font-weight:800;background:var(--s2);border:1px solid var(--line2);white-space:nowrap;text-decoration:none}
.btn.pri{background:linear-gradient(135deg,var(--pink),#FF7E8F);color:#fff;border-color:transparent}
.btn.danger{color:#FFB0B0;border-color:rgba(255,107,107,.45);background:rgba(255,107,107,.08)}
.btn.armed{background:var(--red);color:#fff;border-color:transparent}
.btn.sm{min-height:36px;padding:0 13px;font-size:14px;border-radius:11px}
.btn.wide{width:100%}.btn.icon{width:44px;padding:0}.btn.sm.icon{width:36px}
.btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty b{display:block;font-family:var(--display);font-size:22px;font-weight:600;color:var(--ink);margin-bottom:6px}
.sect{font-family:var(--display);font-size:16px;font-weight:600;color:var(--muted);margin:22px 0 10px}

/* search + chips */
.searchbar{position:sticky;top:56px;z-index:20;padding:10px 0 8px;background:linear-gradient(var(--bg) 80%,rgba(20,17,24,0))}
.search{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line2);border-radius:14px;padding:0 12px;height:46px}
.search svg{width:19px;height:19px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;height:100%}
.search .x{width:28px;height:28px;border-radius:50%;background:var(--s3);display:grid;place-items:center;color:var(--muted);font-size:15px;font-weight:800}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;background:var(--s1);border:1px solid var(--line2);font-weight:700;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#1a1320;border-color:transparent}
.chip.tag{color:var(--muted)}.chip.tag[aria-pressed="true"]{color:#1a1320}
.chip small{font-weight:700;opacity:.7}
.count{font-size:13px;color:var(--muted);font-weight:700;margin:4px 2px 10px}

/* grid of gifs */
.gifs{columns:2 150px;column-gap:8px}
@media (min-width:640px){.gifs{columns:3 180px}}
@media (min-width:980px){.gifs{columns:5 180px}}
.g{display:block;width:100%;margin:0 0 8px;break-inside:avoid;border-radius:14px;overflow:hidden;position:relative;background:var(--s2);border:0;padding:0}
.g img{display:block;width:100%;height:auto;min-height:60px}
.g .badge{position:absolute;left:7px;top:7px;font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:7px;background:rgba(20,17,24,.78);color:#fff;text-transform:uppercase}
.g .badge.fam{color:var(--sun)}
.g .sel{position:absolute;right:7px;top:7px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.3)}
.g.on .sel{background:var(--pink);border-color:#fff}
.g.on .sel::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}

/* collections */
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.col{display:block;text-decoration:none;background:var(--s1);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;width:100%;padding:0}
.col .cover{aspect-ratio:1.25;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:var(--s2)}
.col .cover img{width:100%;height:100%;object-fit:cover;display:block}
.col .cover.one{grid-template-columns:1fr;grid-template-rows:1fr}
.col .cover .em{grid-column:1/-1;grid-row:1/-1;display:grid;place-items:center;font-size:44px}
.col .cover .em.ltr{font-family:var(--display);font-weight:600;color:var(--dim);font-size:48px}
.col .t{padding:10px 12px 12px}
.col b{display:block;font-family:var(--display);font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col span{font-size:12.5px;color:var(--muted);font-weight:700}
.col.new{display:grid;place-items:center;min-height:180px;border-style:dashed;border-color:var(--line2);color:var(--muted);font-weight:800}
.col.new i{font-style:normal;display:block;font-size:34px;text-align:center;color:var(--pink)}

/* add */
.drop{border:2px dashed var(--line2);border-radius:22px;background:rgba(255,95,162,.04);padding:22px 16px;text-align:center;outline:none;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:text}
.drop:focus{border-color:var(--pink);background:rgba(255,95,162,.08)}
.drop b{font-family:var(--display);font-size:20px;font-weight:600}
.drop span{color:var(--muted);font-size:14px;max-width:34ch}
.drop img{display:none}
.ways{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.linkrow{display:flex;gap:8px;margin-top:10px}
.linkrow input{flex:1;min-width:0;background:var(--s1);border:1px solid var(--line2);border-radius:14px;padding:0 12px;height:44px;font-size:16px}
.pend{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:12px;background:var(--s1);border:1px solid var(--line);border-radius:18px;margin-top:10px}
.pend .pv{width:96px;border-radius:12px;overflow:hidden;background:var(--s2);align-self:start}
.pend .pv img{width:100%;display:block}
.pend .x{float:right;width:30px;height:30px;border-radius:50%;background:var(--s3);font-weight:800;color:var(--muted)}
.pend .dup{color:var(--sun);font-weight:700;font-size:13px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;font-size:12.5px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.field input,.field select{background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:16px;color:var(--ink);font-weight:600;letter-spacing:0}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:6px}
.tagbox input{flex:1;min-width:90px;border:0!important;background:none!important;padding:5px 4px!important;outline:0}
.tg{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 6px 0 10px;border-radius:999px;background:rgba(141,107,255,.2);color:#CDBFFF;font-weight:800;font-size:13px}
.tg button{width:20px;height:20px;border-radius:50%;font-size:12px;line-height:1;color:#CDBFFF}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sugg button{height:28px;padding:0 10px;border-radius:999px;border:1px dashed var(--line2);color:var(--muted);font-weight:700;font-size:13px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 12px;border-radius:11px;background:var(--bg);border:1px solid var(--line2);font-weight:800;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#1a1320;border-color:transparent}
.savebar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin-top:14px;z-index:5}

/* viewer + sheets */
.sheetwrap{position:fixed;inset:0;z-index:60}
.scrim{position:absolute;inset:0;background:rgba(6,3,10,.66);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--s1);border-top:1px solid var(--line2);border-radius:24px 24px 0 0;
  padding:10px 16px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .24s cubic-bezier(.3,.7,.2,1);max-width:640px;margin:0 auto}
.sheetwrap.on .scrim{opacity:1}.sheetwrap.on .sheet{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.sheet h2{font-family:var(--display);font-weight:600;font-size:23px;margin:0 0 4px}
.sheet p.lead{margin:0 0 14px;color:var(--muted);font-size:14px}
.big{border-radius:16px;overflow:hidden;background:#000;display:grid;place-items:center;max-height:52vh}
.big img{max-width:100%;max-height:52vh;display:block}
.vmeta{display:flex;align-items:center;gap:8px;margin:12px 0 4px}
.vmeta b{flex:1;font-family:var(--display);font-weight:600;font-size:19px;overflow-wrap:anywhere}
.pill{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:7px;background:var(--s3);color:var(--muted)}
.pill.fam{background:rgba(255,210,63,.15);color:var(--sun)}
.acts{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:10px 0 4px}
.acts .btn{min-height:50px}
.colpick{display:flex;flex-wrap:wrap;gap:7px}
.colpick button{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line2);font-weight:800;font-size:14px}
.colpick button[aria-pressed="true"]{background:rgba(255,95,162,.18);border-color:var(--pink);color:#FFC2DB}
.colpick button[aria-pressed="true"]::before{content:"✓"}
.pick{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.pick button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--line);text-align:left}
.pick button .t{flex:1}.pick button .t b{display:block}.pick button .t span{font-size:12.5px;color:var(--muted)}
.emojis{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.emojis button{width:42px;height:42px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:22px}
.emojis button[aria-pressed="true"]{border-color:var(--pink);background:rgba(255,95,162,.15)}
.err{color:#FF9C9C;font-size:13.5px;min-height:18px;margin:0 0 8px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:80;background:var(--ink);color:#1a1320;font-weight:800;padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.selbar{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:31;display:flex;justify-content:center;padding:0 14px}
.selbar .in{display:flex;gap:8px;align-items:center;background:var(--s2);border:1px solid var(--line2);border-radius:16px;padding:8px 8px 8px 14px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-weight:800}
.authcard{max-width:420px;margin:0 auto 40px}
.authcard h2{font-family:var(--display);margin:0 0 14px}
.linkbtn{display:block;margin:14px auto 0;color:var(--pink);font-weight:800}
.hero{padding:30px 0 18px;text-align:center}
.hero h1{font-family:var(--display);font-size:clamp(34px,8vw,52px);margin:0;line-height:1.05}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--pink),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);max-width:44ch;margin:10px auto 0}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* iPhone zooms into any text box under 16px; keep them all at 16px so it doesn't */
input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{font-size:16px}
</style>
</head>

const APP = 'gifbox';
const BUCKET = 'gifbox';
const MAX_BYTES = 15 * 1024 * 1024;
const WA = window.WebApps;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2));
const norm = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').trim();
const cleanTag = s => norm(s).replace(/^#/, '').replace(/[^a-z0-9 &'-]/g, '').replace(/\s+/g, ' ').trim().slice(0, 24);
const BACK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
const I = {
  send: '<svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>',
  copy: '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/></svg>',
  save: '<svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  paste: '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1M9 11h6M9 15h4"/></svg>',
  photo: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>',
  edit: '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',

/* ================================================================== data

function remoteData() {
  const sb = WA.client;

  const sign = async paths => { const urls = {}; for (let i = 0; i < paths.length; i += 200) {
    const sig = ok(await sb.storage.from(BUCKET).createSignedUrls(paths.slice(i, i + 200), 60 * 60 * 12)); sig.forEach(x => { if (x.signedUrl) urls[x.path] = x.signedUrl; }); } return urls; };

    async list() {

        sb.from('gifbox_gifs').select('*').order('created_at', { ascending: false }),
        sb.from('gifbox_collections').select('id,owner,name,emoji,created_at,gifbox_collection_members(user_id),gifbox_collection_items(gif_id,added_by,added_at)').order('created_at')]);

      const gifs = rows.map(r => ({ ...r, tags: r.tags || [], url: urls[r.path] || '' }));
      const cols = ok(c).map(r => ({ id: r.id, owner: r.owner, name: r.name, emoji: r.emoji, created_at: r.created_at,
        members: (r.gifbox_collection_members || []).map(m => m.user_id),
        items: (r.gifbox_collection_items || []).sort((a, b) => b.added_at.localeCompare(a.added_at)).map(i => ({ gif_id: i.gif_id, added_by: i.added_by })) }));

    async add(g, blob) {

      const row = { id: g.id, owner: g.owner, path, w: g.w, h: g.h, bytes: g.bytes, hash: g.hash, title: g.title, tags: g.tags, type: blob.type, created_by: ME.id };
      try { ok(await sb.from('gifbox_gifs').insert(row)); } catch (e) { await sb.storage.from(BUCKET).remove([path]); throw e; }

    async update(g, fields) { ok(await sb.from('gifbox_gifs').update(fields).eq('id', g.id)); },
    async toLibrary(g) {

    async remove(g) {   // the file first: its access rule needs the row to still exist

    async createCol(c) { ok(await sb.from('gifbox_collections').insert({ id: c.id, owner: ME.id, name: c.name, emoji: c.emoji })); },
    async updateCol(id, f) { ok(await sb.from('gifbox_collections').update(f).eq('id', id)); },
    async deleteCol(id) { ok(await sb.from('gifbox_collections').delete().eq('id', id)); },
    async setMembers(id, ids) {

    },
    async leaveCol(id) { ok(await sb.from('gifbox_collection_members').delete().eq('collection_id', id).eq('user_id', ME.id)); },
    async addItems(id, gids) { ok(await sb.from('gifbox_collection_items').upsert(gids.map(g => ({ collection_id: id, gif_id: g, added_by: ME.id })), { onConflict: 'collection_id,gif_id', ignoreDuplicates: true })); },
    async removeItem(id, gid) { ok(await sb.from('gifbox_collection_items').delete().eq('collection_id', id).eq('gif_id', gid)); },

function localData() {

  return {
    async list() {
      const all = await tx('readonly', s => s.getAll());
      const cols = loadC().filter(mineC);
      const via = new Set(cols.flatMap(c => c.items.map(i => i.gif_id)));
      const gifs = all.filter(r => r.owner === null || r.owner === ME.id || via.has(r.id)).sort((a, b) => b.created_at.localeCompare(a.created_at)).map(r => { const { blob, ...m } = r; return { ...m, url: urlFor(r), blob }; });

    },
    async add(g, blob) { const r = { ...g, type: blob.type, created_by: ME.id, created_at: new Date().toISOString(), blob }; await tx('readwrite', s => s.put(r)); return { ...g, type: blob.type, created_by: ME.id, created_at: r.created_at, url: urlFor(r), blob }; },
    async update(g, fields) { const r = await tx('readonly', s => s.get(g.id)); Object.assign(r, fields); await tx('readwrite', s => s.put(r)); },
    async toLibrary(g) { await this.update(g, { owner: null }); return {}; },
    async remove(g) { await tx('readwrite', s => s.delete(g.id)); editC(all => all.forEach(c => c.items = c.items.filter(i => i.gif_id !== g.id))); },
    async createCol(c) { editC(all => all.push({ id: c.id, owner: ME.id, name: c.name, emoji: c.emoji, members: [], items: [], created_at: new Date().toISOString() })); },
    async updateCol(id, f) { editC(all => { const c = all.find(x => x.id === id); if (c && c.owner === ME.id) Object.assign(c, f); }); },
    async deleteCol(id) { editC(all => { const k = all.findIndex(x => x.id === id && x.owner === ME.id); if (k >= 0) all.splice(k, 1); }); },
    async setMembers(id, ids) { editC(all => { const c = all.find(x => x.id === id); if (c && c.owner === ME.id) c.members = ids.slice(); }); },
    async leaveCol(id) { editC(all => { const c = all.find(x => x.id === id); if (c) c.members = c.members.filter(u => u !== ME.id); }); },
    async addItems(id, gids) { editC(all => { const c = all.find(x => x.id === id); if (!c || !mineC(c)) return; gids.forEach(g => { if (!c.items.some(i => i.gif_id === g)) c.items.unshift({ gif_id: g, added_by: ME.id }); }); }); },

function tagBoxHTML(id, tags) {
  return `<div class="tagbox" id="${id}" data-tags="${esc(JSON.stringify(tags))}">${tags.map(t => `<span class="tg">#${esc(t)}<button type="button" data-rm="${esc(t)}" aria-label="Remove ${esc(t)}">✕</button></span>`).join('')}<input placeholder="${tags.length ? 'Add tag' : 'happy, star wars, reaction…'}" enterkeyhint="done" autocapitalize="none"></div><div class="sugg"></div>`;
}
function getTags(box) { try { return JSON.parse(box.dataset.tags) || []; } catch (e) { return []; } }
function wireTagBox(box, onChange) {
  const inp = box.querySelector('input'), sug = box.nextElementSibling;
  const set = tags => { box.dataset.tags = JSON.stringify(tags); [...box.querySelectorAll('.tg')].forEach(e => e.remove());
    tags.forEach(t => { const s = document.createElement('span'); s.className = 'tg'; s.innerHTML = `#${esc(t)}<button type="button" data-rm="${esc(t)}" aria-label="Remove ${esc(t)}">✕</button>`; box.insertBefore(s, inp); });
    inp.placeholder = tags.length ? 'Add tag' : 'happy, star wars, reaction…'; suggest(); onChange && onChange(tags); };
  const add = v => { const t = cleanTag(v); if (!t) return; const tags = getTags(box); if (!tags.includes(t)) set([...tags, t]); inp.value = ''; suggest(); };
  const suggest = () => { const cur = getTags(box), q = norm(inp.value);
    const pool = [...new Set([...allTags(), ...COLS.map(c => cleanTag(c.name))])].filter(t => t && !cur.includes(t) && (!q || t.includes(q))).slice(0, 8);
    sug.innerHTML = pool.map(t => `<button type="button" data-sg="${esc(t)}">+ ${esc(t)}</button>`).join(''); };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); add(inp.value); } else if (e.key === 'Backspace' && !inp.value) { const t = getTags(box); if (t.length) set(t.slice(0, -1)); } });
  inp.addEventListener('input', () => { if (/,/.test(inp.value)) { inp.value.split(',').forEach(add); } else suggest(); });
  inp.addEventListener('blur', () => { if (inp.value.trim()) add(inp.value); });
  box.addEventListener('click', e => { const r = e.target.closest('[data-rm]'); if (r) { set(getTags(box).filter(t => t !== r.dataset.rm)); return; } inp.focus(); });
  sug.addEventListener('mousedown', e => e.preventDefault());
  sug.addEventListener('click', e => { const b = e.target.closest('[data-sg]'); if (b) add(b.dataset.sg); });
  suggest();
}

async function takeBlob(blob, name) {
  if (!blob || !/^image\//.test(blob.type)) { toast("That isn't an image. Copy the GIF itself, not the page."); return; }
  if (blob.size > MAX_BYTES) { toast(`That one's ${sizeStr(blob.size)}. GIFs up to 15 MB fit in GIFbox.`); return; }
  const hash = await sha(blob);
  if (hash && PENDING.some(p => p.hash === hash)) { toast('Already in your list'); return; }
  const d = await dims(blob);
  const title = name ? name.replace(/\.[a-z0-9]+$/i, '').replace(/[-_]+/g, ' ').replace(/\b(giphy|tenor|image|img)\b/gi, '').trim().slice(0, 60) : '';
  PENDING.push({ key: Math.random().toString(36).slice(2, 9), blob, url: d.url, w: d.w, h: d.h, hash, title, tags: [], dup: hash ? GIFS.find(g => g.hash === hash) : null });
  if (blob.type === 'image/png' || blob.type === 'image/jpeg') toast('Added. This one came through as a still image, not an animation.');
  if (VIEW.type !== 'add') location.hash = '#/add'; else drawPending();
}
async function takeFiles(files) { for (const f of files) await takeBlob(f, f.name); }
/* GIPHY page links and media links become the GIF file itself */
function giphyURL(u) {
  const m = u.match(/giphy\.com\/(?:gifs|stickers|embed|clips)\/(?:[\w-]*-)?([A-Za-z0-9]{8,})/) || u.match(/giphy\.com\/media\/(?:v1\.[^/]+\/)?([A-Za-z0-9]{8,})/) || u.match(/i\.giphy\.com\/([A-Za-z0-9]{8,})/);
  return m ? `https://media.giphy.com/media/${m[1]}/giphy.gif` : null;
}
async function fromURL(raw, quiet) {
  let u = String(raw || '').trim(); if (!u) return;
  if (!/^(https?:|data:|blob:)/.test(u)) u = 'https://' + u;
  const g = giphyURL(u); if (g) u = g;
  try { const r = await fetch(u); if (!r.ok) throw 0; const b = await r.blob(); await takeBlob(b, decodeURIComponent(u.split('/').pop().split('?')[0])); }
  catch (e) { if (!quiet) toast(/tenor\.com\/view/.test(u) ? "Tenor page links can't be fetched. Copy the GIF itself and paste it." : "Couldn't get a GIF from that link. Try copying the GIF itself."); }
}
async function clipPaste() {
  if (!navigator.clipboard || !navigator.clipboard.read) { $('#drop').focus(); toast('Tap the box and choose Paste'); return; }
  try {
    const items = await navigator.clipboard.read(); let got = false;
    for (const it of items) {
      const t = it.types.find(x => x === 'image/gif') || it.types.find(x => x.startsWith('image/'));
      if (t) { await takeBlob(await it.getType(t), ''); got = true; continue; }
      if (it.types.includes('text/plain')) { const txt = await (await it.getType('text/plain')).text(); if (/^\s*https?:\/\//.test(txt)) { await fromURL(txt); got = true; } }
    }
    if (!got) toast('No GIF on the clipboard. Copy one first.');
  } catch (e) { $('#drop').focus(); toast('Tap the box and choose Paste'); }
}
/* paste anywhere in the app */
document.addEventListener('paste', async e => {
  if (!ME) return;
  const t = e.target; if (t && t.matches && t.matches('input, textarea')) return;
  const files = [...(e.clipboardData && e.clipboardData.files || [])].filter(f => f.type.startsWith('image/'));
  if (files.length) { e.preventDefault(); takeFiles(files); return; }
  const items = [...(e.clipboardData && e.clipboardData.items || [])];
  const img = items.find(i => i.kind === 'file' && i.type.startsWith('image/'));
  if (img) { e.preventDefault(); takeBlob(img.getAsFile(), ''); return; }
  const html = e.clipboardData && e.clipboardData.getData('text/html'); const m = html && html.match(/<img[^>]+src="([^"]+)"/i);
  if (m) { e.preventDefault(); fromURL(m[1].replace(/&amp;/g, '&')); return; }
  const txt = e.clipboardData && e.clipboardData.getData('text/plain');
  if (txt && /^\s*https?:\/\/\S+\s*$/.test(txt)) { e.preventDefault(); fromURL(txt); return; }
});
async function savePending(btn) {
  if (!PENDING.length) return;
  btn.disabled = true; let done = 0, skipped = 0;
  const fam = isAdmin() && SHARED.dest === 'library';
  for (const p of PENDING.slice()) {
    if (p.dup) { skipped++; await addToCols(p.dup.id); PENDING = PENDING.filter(x => x !== p); continue; }
    btn.textContent = `Saving ${done + 1} of ${PENDING.length + done}…`;
    const tags = [...new Set([...(p.tags || []), ...SHARED.tags])];
    try {
      const g = await DATA.add({ id: uid(), owner: fam ? null : ME.id, w: p.w, h: p.h, bytes: p.blob.size, hash: p.hash, title: p.title.trim(), tags }, p.blob);
      GIFS.unshift(g); await addToCols(g.id); done++; PENDING = PENDING.filter(x => x !== p); URL.revokeObjectURL(p.url);
    } catch (e) { toast("Couldn't save one of them. Check your connection and try again."); break; }
  }
  if (!PENDING.length) { SHARED = { tags: [], cols: [], dest: SHARED.dest };
    toast(done ? `Saved ${done} ${done === 1 ? 'GIF' : 'GIFs'}${skipped ? `, ${skipped} already in GIFbox` : ''}` : 'Those were already in GIFbox'); location.hash = '#/'; }
  else { btn.disabled = false; drawPending(); }
}
async function addToCols(id) { for (const cid of SHARED.cols) { const c = col(cid); if (c && !inCol(c, id)) { c.items.unshift({ gif_id: id, added_by: ME.id }); await commit(DATA.addItems(cid, [id])); } } }

/* ================================================================== actions */
const ACTS = {
  closeSheet() { closeSheet(); },
  toUp() { SI.mode = 'up'; renderSignin(); }, toIn() { SI.mode = 'in'; renderSignin(); },
  async signout() { await WA.signOut(); toast('Signed out of every app'); },
  clearQ() { Q.text = ''; renderLib(); },
  scope(b) { Q.scope = b.dataset.v; renderLib(); },
  qcol(b) { Q.col = Q.col === b.dataset.v ? '' : b.dataset.v; renderLib(); },
  qtag(b) { Q.tag = Q.tag === b.dataset.v ? '' : b.dataset.v; renderLib(); },
  tagSearch(b) { Q = { text: '', scope: 'all', tag: b.dataset.v, col: '' }; closeSheet(); if (VIEW.type !== 'lib') location.hash = '#/'; else renderLib(); },
  view(b) { openViewer(b.dataset.id); },
  async send(b) {
    const g = gif(b.dataset.id);
    try {
      const blob = g.blob || blobCache.get(g.id) || await blobOf(g);
      const file = new File([blob], fileName(g), { type: blob.type || 'image/gif' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
      ACTS.copy(b);
    } catch (e) { if (e && e.name === 'AbortError') return; toast("Couldn't open sharing here. Try Copy or Save."); }
  },
  async copy(b) {
    const g = gif(b.dataset.id);
    try {
      const blob = g.blob || blobCache.get(g.id) || await blobOf(g);
      try { await navigator.clipboard.write([new ClipboardItem({ [blob.type || 'image/gif']: blob })]); toast('Copied. Paste it into your message.'); return; }
      catch (e) { /* most browsers only copy PNG: fall back to a still */ }
      const png = await toPNG(blob); await navigator.clipboard.write([new ClipboardItem({ 'image/png': png })]);
      toast('Copied as a still image. Use Send to keep the animation.');
    } catch (e) { toast("Couldn't copy here. Use Send or Save."); }
  },
  async download(b) {
    const g = gif(b.dataset.id);
    try { const blob = g.blob || await blobOf(g); const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = fileName(g); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); }
    catch (e) { toast("Couldn't save it here."); }
  },
  editGif(b) { editSheet(gif(b.dataset.id)); },
  toggleCol(b) { const c = col(b.dataset.c), id = b.dataset.id; const on = !inCol(c, id);
    if (!on && !canTakeOut(c, id)) { toast('Only the person who added it, or the owner, can take it out'); return; }
    c.items = on ? [{ gif_id: id, added_by: ME.id }, ...c.items] : c.items.filter(i => i.gif_id !== id); b.setAttribute('aria-pressed', String(on));
    commit(on ? DATA.addItems(c.id, [id]) : DATA.removeItem(c.id, id));
    toast(on ? `Added to ${c.name}` : `Removed from ${c.name}`); if (VIEW.type === 'c' || (VIEW.type === 'lib' && Q.col)) { const v = VIEWING; rerender(); VIEWING = v; } },
  async toLibrary(b) { const g = gif(b.dataset.id);
    armed(b, async () => { try { const r = await DATA.toLibrary(g); Object.assign(g, { owner: null }, r); toast('Moved to the Library'); closeSheet(); rerender(); } catch (e) { toast("Couldn't move it. Check your connection."); } }, 'Everyone will see it. Move?'); },
  delGif(b) { const g = gif(b.dataset.id);
    armed(b, async () => { try { await DATA.remove(g); GIFS = GIFS.filter(x => x !== g); COLS.forEach(c => c.items = c.items.filter(i => i.gif_id !== g.id)); closeSheet(); toast('Deleted'); rerender(); } catch (e) { toast("Couldn't delete it. Check your connection."); } },
      g.owner === null || colsOf(g.id).some(c => c.members.length) ? 'Delete for everyone?' : 'Tap again to delete'); },
  newCol(b) { colSheet(null, b.dataset.add || (b.dataset.pend ? '__pending' : '')); },
  pickEmoji(b) { $$('button', b.parentNode).forEach(x => x.setAttribute('aria-pressed', String(x === b))); b.closest('form').querySelector('[name="emoji"]').value = b.dataset.v; },
  colMenu() { const c = col(VIEW.id), own = ownsCol(c);
    const mineIn = c.items.filter(i => own || i.added_by === ME.id).length;
    sheet(`<h2>${esc(ic(c))}${esc(c.name)}</h2><p class="lead">${esc(sharedLabel(c))}</p><div class="pick">
      ${own ? '<button data-act="editCol"><span class="t"><b>Rename or change icon</b></span></button>' : ''}
      ${own ? `<button data-act="shareCol"><span class="t"><b>${c.members.length ? 'Change who it’s shared with' : 'Share'}</b><span>${c.members.length ? esc(c.members.map(who).join(', ')) : 'Let other people see it and add to it'}</span></span></button>` : ''}
      <button data-act="pickInto"><span class="t"><b>Add GIFs</b><span>Pick several at once</span></span></button>
      ${mineIn ? `<button data-act="removeMode"><span class="t"><b>Remove GIFs</b><span>${own ? 'They stay in GIFbox' : 'Only ones you added'}</span></span></button>` : ''}
    </div>${own ? `<button class="btn danger wide" data-act="delCol">${I.trash} Delete collection</button><p class="muted" style="font-size:12.5px;text-align:center">${c.members.length ? 'It disappears for everyone you shared it with. ' : ''}The GIFs stay in GIFbox.</p>`
      : `<button class="btn danger wide" data-act="leaveCol">Leave this collection</button>`}`); },
  shareCol() { shareSheet(col(VIEW.id)); },
  async unshare(b) { const c = col(b.dataset.id); c.members = []; closeSheet(); await commit(DATA.setMembers(c.id, [])); toast('Only you can see it now'); rerender(); },
  leaveCol(b) { armed(b, async () => { const id = VIEW.id; closeSheet(); await commit(DATA.leaveCol(id)); await reload(); toast('Left the collection'); location.hash = '#/collections'; }, 'Tap again to leave'); },
  editCol() { colSheet(col(VIEW.id)); },
  delCol(b) { armed(b, async () => { const id = VIEW.id; COLS = COLS.filter(c => c.id !== id); if (Q.col === id) Q.col = ''; closeSheet(); await commit(DATA.deleteCol(id)); location.hash = '#/collections'; }); },
  pickInto() { closeSheet(); SEL = { col: VIEW.id, ids: new Set(), mode: 'add' }; renderCol(VIEW.id); },
  removeMode() { closeSheet(); const c = col(VIEW.id);
    $('#app').innerHTML = `<div class="wrap">${head('Remove from ' + c.name, 'Tap GIFs to take them out', '', '<button class="btn sm" data-act="cancelPick">Done</button>')}<div class="gifs">${colGifIds(c).filter(id => canTakeOut(c, id)).map(gif).filter(Boolean).map(g => `<button class="g" data-act="rmFromCol" data-id="${g.id}" style="aspect-ratio:${g.w && g.h ? g.w + '/' + g.h : 'auto'}"><img src="${esc(g.url)}" alt="" loading="lazy"><span class="badge" style="left:auto;right:7px;background:var(--red)">Remove</span></button>`).join('')}</div></div>`; },
  rmFromCol(b) { const c = col(VIEW.id); c.items = c.items.filter(i => i.gif_id !== b.dataset.id); b.remove(); commit(DATA.removeItem(c.id, b.dataset.id)); toast(`Removed from ${c.name}`); },
  cancelPick() { SEL = null; renderCol(VIEW.id); },
  toggleSel(b) { const id = b.dataset.id; SEL.ids.has(id) ? SEL.ids.delete(id) : SEL.ids.add(id); b.classList.toggle('on', SEL.ids.has(id));
    const bar = $('.selbar .in'); if (bar) { bar.querySelector('span').textContent = SEL.ids.size + ' selected'; bar.querySelector('button').disabled = !SEL.ids.size; } },
  addPicked() { const c = col(SEL.col); const ids = [...SEL.ids]; c.items = [...ids.map(g => ({ gif_id: g, added_by: ME.id })), ...c.items.filter(i => !SEL.ids.has(i.gif_id))]; SEL = null; commit(DATA.addItems(c.id, ids)); toast(`Added ${ids.length} to ${c.name}`); renderCol(c.id); },
  clipPaste() { clipPaste(); },
  rmPending(b) { const p = PENDING.find(x => x.key === b.dataset.key); if (p) URL.revokeObjectURL(p.url); PENDING = PENDING.filter(x => x.key !== b.dataset.key); drawPending(); },
  dest(b) { SHARED.dest = b.dataset.v; $$('button', b.parentNode).forEach(x => x.setAttribute('aria-pressed', String(x === b))); },
  pendCol(b) { const c = b.dataset.c; SHARED.cols = SHARED.cols.includes(c) ? SHARED.cols.filter(x => x !== c) : [...SHARED.cols, c]; b.setAttribute('aria-pressed', String(SHARED.cols.includes(c))); },
  savePending(b) { savePending(b); },
};
async function toPNG(blob) { const d = await dims(blob); const im = new Image(); im.src = d.url; await im.decode(); const c = document.createElement('canvas'); c.width = d.w; c.height = d.h; c.getContext('2d').drawImage(im, 0, 0); return new Promise(r => c.toBlob(r, 'image/png')); }
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b) return; const f = ACTS[b.dataset.act]; if (!f) return; e.preventDefault(); f(b, e); });
const FORMS = {
  async signin() { const err = $('#siErr'); err.textContent = ''; try { await WA.signIn($('#siU').value, $('#siP').value); } catch (e) { err.textContent = e.message; $('#siP').value = ''; } },
  async signup() { const err = $('#siErr'); err.textContent = '';
    if ($('#suP').value !== $('#suP2').value) { err.textContent = "The two passwords don't match."; return; }
    try { await WA.signUp({ display_name: $('#suN').value.trim(), username: $('#suU').value, password: $('#suP').value }); toast(`Welcome, ${WA.me.display_name}!`); } catch (e) { err.textContent = e.message; } },
  link(f) { const u = f.url.value; f.url.value = ''; fromURL(u); },
  async editGif(f) { const g = gif(f.dataset.id); const title = f.title.value.trim().slice(0, 60), tags = getTags($('#etags'));
    try { await DATA.update(g, { title, tags }); Object.assign(g, { title, tags }); toast('Saved'); closeSheet(); rerender(); openViewer(g.id); } catch (e) { toast("Couldn't save. Check your connection."); } },
  async col(f) { const name = f.name.value.trim().slice(0, 30); if (!name) return; const emoji = f.emoji.value || '';
    if (f.dataset.id) { Object.assign(col(f.dataset.id), { name, emoji }); closeSheet(); rerender(); commit(DATA.updateCol(f.dataset.id, { name, emoji })); return; }
    if (COLS.some(c => ownsCol(c) && norm(c.name) === norm(name))) { toast('You already have a collection with that name'); return; }
    const c = { id: uid(), owner: ME.id, name, emoji, members: [], items: [] }; COLS.push(c);
    try { await DATA.createCol(c); } catch (e) { COLS = COLS.filter(x => x !== c); toast("Couldn't create it. Check your connection."); return; }
    const add = f.dataset.add;
    if (add === '__pending') { SHARED.cols.push(c.id); closeSheet(); drawPending(); return; }
    if (add) { c.items.push({ gif_id: add, added_by: ME.id }); await commit(DATA.addItems(c.id, [add])); toast(`Added to ${name}`); closeSheet(); rerender(); openViewer(add); return; }
    closeSheet(); location.hash = '#/c/' + c.id; },
  async share(f) { const c = col(f.dataset.id); const ids = new FormData(f).getAll('who');
    c.members = ids; closeSheet(); rerender(); await commit(DATA.setMembers(c.id, ids));
    toast(ids.length ? 'Shared with ' + ids.map(who).join(', ') : 'Only you can see it now'); },
};
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); const fn = FORMS[f.dataset.form]; if (fn) fn(f, e.submitter); });

/* ================================================================== start */
addEventListener('hashchange', route);
let lastUser;
(async function boot() {
  await WA.ready; lastUser = WA.me && WA.me.id; await startSession(); route();
  WA.onChange(async me => { const id = me && me.id;
    if (id === lastUser) { if (me && ME) { ME.name = ME.display_name = me.display_name; ME.avatar = me.avatar; renderAvatar(); } return; }
    lastUser = id; await startSession(); if (!ME) location.hash = '#/'; route(); });
})();
</script>
