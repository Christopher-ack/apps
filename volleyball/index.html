<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volleyball Notebook</title>
<meta name="description" content="A volleyball coach's notebook: roster, lineups for every set, rotations, subs, playing time, stats, a scorecard, a scoreboard and animated drills.">
<meta name="application-name" content="Volleyball Notebook">
<meta name="apple-mobile-web-app-title" content="VB Notebook">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E1A3B">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --navy:#0E1A3B; --navy2:#1A2B5E; --orange:#FF7A1A; --orange2:#E35F00; --blue:#2F7BFF;
  --bg:#F2F3F7; --card:#FFFFFF; --ink:#0E1A3B; --muted:#636D88; --line:#DCE0EA; --soft:#EEF0F6;
  --court:#EDA25E; --court2:#E08E45; --ok:#1E9E6A; --warn:#E8A317; --bad:#D6453D;
  --us:var(--orange); --them:var(--blue);
  --head:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
html,body{margin:0;height:100%}
body{font:15px/1.4 var(--body);color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--orange2)}
[hidden]{display:none!important}
#app{min-height:100%;display:flex;flex-direction:column}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(var(--st) + 9px) 12px 9px 14px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.brand .logo{width:34px;height:34px;flex:none}
.brand .bt{display:flex;flex-direction:column;line-height:1}
.brand .bt small{font:700 10.5px/1 var(--head);letter-spacing:2.2px;color:var(--orange);text-transform:uppercase}
.brand .bt span{font:700 21px/1 var(--head);letter-spacing:.3px;margin-top:2px}
.top .sp{flex:1}
.gd{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px;max-width:44vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gd small{opacity:.7;font-weight:500}
.gear{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.gear.on{background:rgba(255,255,255,.16)}
.gear svg{width:22px;height:22px}

main{flex:1;padding:14px 14px calc(84px + var(--sb));max-width:1100px;width:100%;margin:0 auto}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + var(--sb))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font:600 11.5px/1 var(--body);color:var(--muted);border-radius:12px;min-width:0}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--orange2)}


/* Common */
h2{font:700 24px/1.1 var(--head);text-transform:uppercase;letter-spacing:.3px;margin:4px 0 10px}
h3{font:700 18px/1.1 var(--head);text-transform:uppercase;letter-spacing:.3px;margin:0 0 8px}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(14,26,59,.06);border:1px solid var(--line)}
.card + .card{margin-top:12px}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:700;background:var(--soft);color:var(--ink);text-decoration:none}
.btn.pri{background:var(--orange);color:#fff}
.btn.dark{background:var(--navy);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.bad{background:#FBE6E4;color:var(--bad)}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font:700 12px/1.2 var(--body);background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:#DDF3EA;color:#137551}
.pill.part{background:#FFF0CF;color:#8A5B00}
.pill.live{background:#FFE5D3;color:var(--orange2)}
.pill.done{background:var(--navy);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--orange)}
.chip.alt{border-style:dashed}
.empty{text-align:center;padding:36px 18px}
.empty img{width:84px;height:84px;border-radius:20px;margin-bottom:8px}
.empty p{color:var(--muted);max-width:360px;margin:6px auto 18px}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 6px;border-radius:10px;background:var(--navy);color:#fff;font:700 18px/1 var(--head)}
.num.o{background:var(--orange)}
.lbl{font:600 12px/1 var(--body);text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field input,.field select,.field textarea{min-height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;font-size:16px;width:100%}
.field textarea{padding:10px 12px;min-height:70px;resize:vertical}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted);padding:0 6px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Court (lineup) */
.court{position:relative;background:linear-gradient(var(--court),var(--court2));border-radius:14px;padding:14px 10px 12px;border:3px solid #fff;box-shadow:0 0 0 1px var(--line), inset 0 0 0 2px rgba(255,255,255,.35);max-width:520px;margin:0 auto}
.net{height:10px;margin:-14px -10px 12px;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 8px),var(--navy);border-radius:10px 10px 0 0;position:relative}
.net::after{content:"NET";position:absolute;right:8px;top:-1px;font:700 9px/12px var(--head);color:#fff;letter-spacing:1px;background:var(--navy);padding:0 4px}
.atk{position:absolute;left:0;right:0;top:calc(50% + 2px);border-top:2px dashed rgba(255,255,255,.75)}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative}
.spot{position:relative;background:rgba(255,255,255,.92);border-radius:14px;min-height:98px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;box-shadow:0 2px 0 rgba(14,26,59,.15)}
.spot .pos{position:absolute;top:6px;left:8px;font:700 12px/1 var(--head);color:var(--muted)}
.spot .slot{position:absolute;top:6px;right:8px;font:700 11px/1 var(--head);color:var(--muted);letter-spacing:.5px}
.spot .jn{font:800 32px/1 var(--head);color:var(--navy)}
.spot .nm{font-weight:700;font-size:13px;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spot .rl{font-size:11px;color:var(--muted);font-weight:600}
.spot.empty-s{background:rgba(255,255,255,.45);border:2px dashed rgba(255,255,255,.95);box-shadow:none;color:#fff;font-weight:700}
.spot.empty-s .pos{color:#fff}
.spot.srv{box-shadow:0 0 0 3px var(--orange),0 2px 0 rgba(14,26,59,.15)}
.spot .ball{position:absolute;bottom:-9px;right:-6px;width:24px;height:24px}
.spot.lib{background:#E9F1FF}
.spot.lib .jn{color:var(--blue)}
.spot .tm{position:absolute;bottom:6px;left:8px;font:700 11px/1 var(--head);color:var(--muted)}
.court.mini{padding:10px 6px 8px;border-width:2px}
.court.mini .net{margin:-10px -6px 8px;height:7px}
.court.mini .net::after{display:none}
.court.mini .cgrid{gap:6px}
.court.mini .spot{min-height:58px;padding:6px 3px;border-radius:10px}
.court.mini .spot .jn{font-size:22px}
.court.mini .spot .nm{font-size:11px}
.court.mini .spot .pos{font-size:10px;top:4px;left:5px}
.court.mini .spot .slot,.court.mini .spot .rl{display:none}

/* Live strip */
.strip{display:flex;align-items:stretch;gap:8px;margin-bottom:12px}
.tbox{flex:1;border-radius:14px;padding:10px 12px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;min-width:0}
.tbox.us{background:var(--us)} .tbox.them{background:var(--them)}
.tbox .tn{font:700 15px/1.1 var(--head);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbox .sc{font:800 44px/1 var(--head)}
.tbox .sv{font:600 11px/1 var(--body);opacity:.9;display:flex;align-items:center;gap:4px;margin-top:4px}
.tbox .sv svg{width:14px;height:14px}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px auto 0;max-width:520px}
.ctl .btn{min-height:54px;font-size:16px}
.ctl .btn.us{background:var(--us);color:#fff}
.ctl .btn.them{background:var(--them);color:#fff}
.meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.bench{display:flex;gap:6px;flex-wrap:wrap}
.bp{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px 10px 5px 5px;font-weight:600;font-size:14px}
.bp .num{min-width:28px;height:28px;font-size:15px;border-radius:8px;background:var(--muted)}
.banner{background:#FFF0CF;color:#6B4600;border-radius:12px;padding:10px 12px;font-weight:600;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.banner .btn{margin-left:auto}
.banner.info{background:#E9F1FF;color:#123E8C}

.layout{display:grid;gap:14px}
@media (min-width:820px){
  .layout.two{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
  .plan{grid-template-columns:repeat(3,1fr)!important}
  .dlist{grid-template-columns:repeat(3,1fr)!important}
}
.plan{display:grid;grid-template-columns:1fr;gap:12px}
.plan .card{padding:12px;margin:0}
@media (min-width:560px) and (max-width:819px){.plan,.dlist{grid-template-columns:repeat(2,1fr)!important}}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font:600 11px/1.1 var(--body);text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:bottom}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--soft);vertical-align:middle}
.tbl td.c,.tbl th.c{text-align:center}
.tbl .sm{font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--soft);border-radius:12px;padding:10px 12px}
.tile b{display:block;font:800 28px/1 var(--head)}
.tile span{font-size:12px;color:var(--muted);font-weight:600}
.tile em{font-style:normal;font-size:12px;color:var(--muted);display:block;margin-top:2px}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ok)}
.pm{font:700 15px var(--head)}
.pm.up{color:var(--ok)} .pm.dn{color:var(--bad)}
.tile b .pm{font-size:inherit}

/* Roster */
.plist{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--soft);text-align:left;width:100%}
.prow:last-child{border-bottom:0}
.prow .nm{font-weight:700;flex:1}
.prow .num{min-width:40px;height:40px;font-size:20px;border-radius:12px}

/* Scoresheet */
.ss{background:#FFFDF7;border:1.5px solid #CFC8B5;border-radius:12px;padding:10px;font-family:var(--head)}
.ssh{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.ssh .tag{width:28px;height:28px;border-radius:50%;color:#fff;font:800 15px/28px var(--head);text-align:center}
.ssh .tn{font:800 18px/1 var(--head);text-transform:uppercase;letter-spacing:.4px}
.ssh .big{margin-left:auto;font:800 30px/1 var(--head)}
.sg{width:100%;border-collapse:collapse;table-layout:fixed}
.sg th,.sg td{border:1px solid #CFC8B5;text-align:center;padding:3px 2px;vertical-align:top}
.sg th{font:700 13px/1.4 var(--head);background:#F3EEDF}
.sg td.rh{font:600 10px/1.2 var(--body);text-transform:uppercase;color:#6D6650;background:#F8F5EA;width:56px;vertical-align:middle;letter-spacing:.3px}
.sg .st{font:800 22px/1.2 var(--head)}
.sg .st.cur{color:var(--orange2);text-decoration:underline;text-underline-offset:3px}
.sg .sb{display:block;font:600 13px/1.25 var(--head);color:#333}
.sg .sb i{font-style:normal;color:#8B8470;font-size:11px}
.sg .tb{display:block;margin:2px auto;min-width:30px;border:1.5px solid #9C9580;border-radius:4px;font:700 14px/20px var(--head)}
.sg .tb.open{border-style:dashed;color:var(--orange2);border-color:var(--orange)}
.runs{display:grid;grid-template-columns:repeat(15,1fr);gap:2px;margin-top:8px}
.runs span{font:700 13px/22px var(--head);text-align:center;color:#8B8470;position:relative;border-radius:4px}
.runs span.x{color:var(--ink)}
.runs span.x::after{content:"";position:absolute;left:18%;right:18%;top:50%;border-top:2px solid currentColor;transform:rotate(-55deg)}
.runs span.last{box-shadow:0 0 0 1.5px var(--ink);border-radius:50%}
.ssf{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font:600 13px/1.3 var(--body);color:#555}
.ssf b{font-family:var(--head);font-size:15px;color:var(--ink)}
.tob{display:inline-block;min-width:44px;border:1.5px solid #9C9580;border-radius:4px;text-align:center;font:700 13px/20px var(--head);margin-left:4px}
.sclog{font:500 13px/1.5 var(--body);max-height:220px;overflow:auto}
.oppin{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.oppin label{display:flex;flex-direction:column;align-items:center;gap:4px;font:700 13px var(--head)}
.oppin input{width:100%;min-height:44px;text-align:center;border:1.5px solid var(--line);border-radius:10px;font:700 20px var(--head)}

/* Scoreboard */
.sbwrap{position:fixed;left:0;right:0;top:0;bottom:calc(63px + var(--sb));display:flex;flex-direction:column;background:#000;z-index:10}
.sbt{display:flex;flex:1;min-height:0}
.half{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
.half.h{background:var(--orange)} .half.a{background:var(--blue)}
.half .nmb{position:absolute;top:calc(var(--st) + 14px);left:0;right:0;text-align:center;font:800 clamp(22px,4.5vw,44px)/1 var(--head);text-transform:uppercase;letter-spacing:1px;padding:0 54px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.half .pts{font:800 clamp(120px,30vw,340px)/.85 var(--head);font-variant-numeric:tabular-nums;letter-spacing:-4px}
.half .sets{display:flex;gap:8px;margin-top:16px}
.half .sets i{width:16px;height:16px;border-radius:50%;border:2.5px solid #fff;display:block}
.half .sets i.f{background:#fff}
.half .minus{position:absolute;bottom:14px;width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.18);font:800 34px/1 var(--head);display:flex;align-items:center;justify-content:center}
.half.h .minus{left:14px} .half.a .minus{right:14px}
.half .srv{position:absolute;top:calc(var(--st) + 12px);width:40px;height:40px}
.half.h .srv{left:10px} .half.a .srv{right:10px}
.half .edit{position:absolute;bottom:20px;font:600 13px var(--body);opacity:.85;background:rgba(0,0,0,.15);padding:8px 12px;border-radius:999px}
.half.h .edit{right:14px} .half.a .edit{left:14px}
.sbbar{display:flex;gap:8px;justify-content:center;padding:8px;background:#0b0b0b}
.sbbar .btn{background:#222;color:#fff;min-height:40px}

/* Drills */
.dlist{display:grid;grid-template-columns:1fr;gap:12px}
.dcard{display:flex;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(14,26,59,.06)}
.dcard .thumb{background:#2E4A8A;width:118px;flex:none;display:flex;align-items:center}
.dcard .thumb svg{width:100%;height:auto;display:block}
.dcard .dt{flex:1;min-width:0}
.dcard .dt{padding:10px 12px 12px}
.dcard .dt b{font:700 19px/1.1 var(--head);text-transform:uppercase;letter-spacing:.3px;display:block}
.dcard .dt p{margin:4px 0 0;color:var(--muted);font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dfield{background:#2E4A8A;border-radius:16px;overflow:hidden;touch-action:none;max-width:560px;margin:0 auto;position:relative}
.dfield svg{display:block;width:100%;height:auto;max-height:calc(100vh - 300px);user-select:none;-webkit-user-select:none}
.dnote{min-height:48px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:600;margin:10px auto 0;max-width:560px;display:flex;gap:10px;align-items:flex-start}
.dnote .sn{flex:none;font:800 13px/22px var(--head);background:var(--navy);color:#fff;border-radius:6px;padding:0 7px;letter-spacing:.4px}
.dctl{display:flex;gap:8px;justify-content:center;align-items:center;margin:10px auto 0;max-width:560px}
.dctl .btn{min-width:52px}
.dctl .play{min-width:110px}
.steps{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tok{cursor:grab}
.tok.sel circle.r,.tok.sel rect.r,.tok.sel path.r{stroke:#FFD23F;stroke-width:.14}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600;margin-top:8px;justify-content:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:4px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(14,26,59,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(18px + var(--sb));animation:up .2s ease-out}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet .opt{display:flex;align-items:center;gap:12px;width:100%;padding:10px 6px;border-bottom:1px solid var(--soft);text-align:left;font-weight:600}
.sheet .opt:last-child{border-bottom:0}
.sheet .opt .sub{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@keyframes fade{from{opacity:0}}

<script>
(function(){
'use strict';
const APP='volleyball';
const DEVICE_KEY='vbnotebook.v1', MODE_KEY='vbnotebook.saveTo', ACCT_KEY='vbnotebook.acct.', LOCAL_KEY='vbnotebook.local.';
const POSITIONS=['OH','MH','S','OPP','L','DS'];
const POSNAME={OH:'Outside',MH:'Middle',S:'Setter',OPP:'Opposite',L:'Libero',DS:'Defensive'};
const ROMAN=['I','II','III','IV','V','VI'];
const LEVELS={
  ms:{name:'Middle school',sets:3,pts:25,decider:15,subs:18,tos:2,note:'Most middle school leagues play high school (NFHS) rules: best of 3, the third set to 15, 18 subs a set and 2 timeouts. Leagues can change these, so check yours.'},
  hs:{name:'High school (NFHS)',sets:5,pts:25,decider:15,subs:18,tos:2,note:'Best of 5 with the fifth set to 15, 18 subs a set and 2 timeouts. Libero swaps don\'t count as subs.'},
  club:{name:'Club (USA Volleyball)',sets:3,pts:25,decider:15,subs:12,tos:2,note:'12 subs a set. Many club events play best of 3 with the third set to 15.'},
  college:{name:'College (NCAA)',sets:5,pts:25,decider:15,subs:15,tos:2,note:'Best of 5, 15 subs a set.'},
  intl:{name:'International (FIVB)',sets:5,pts:25,decider:15,subs:6,tos:2,note:'Only 6 subs a set.'},
  custom:{name:'Custom',note:'Set your own numbers below.'}
};
const BALL='<svg class="ball" viewBox="-54 -54 108 108"><defs><clipPath id="ssv0"><path d="M0 0 A58 58 0 0 1 0.00 -50.00 A50 50 0 0 1 43.30 25.00 A58 58 0 0 0 0 0 Z"/></clipPath><clipPath id="ssv1"><path d="M0 0 A58 58 0 0 1 43.30 25.00 A50 50 0 0 1 -43.30 25.00 A58 58 0 0 0 0 0 Z"/></clipPath><clipPath id="ssv2"><path d="M0 0 A58 58 0 0 1 -43.30 25.00 A50 50 0 0 1 0.00 -50.00 A58 58 0 0 0 0 0 Z"/></clipPath><clipPath id="ballsv"><circle r="49"/></clipPath></defs><circle r="50" fill="#fff"/><g clip-path="url(#ballsv)"><circle cx="-52.34" cy="-25.00" r="77.5" fill="none" stroke="#FF7A1A" stroke-width="13" clip-path="url(#ssv0)"/><circle cx="47.82" cy="-32.82" r="77.5" fill="none" stroke="#FF7A1A" stroke-width="13" clip-path="url(#ssv1)"/><circle cx="4.52" cy="57.82" r="77.5" fill="none" stroke="#FF7A1A" stroke-width="13" clip-path="url(#ssv2)"/><g fill="none" stroke="#0E1A3B" stroke-width="5" stroke-linecap="round"><path d="M0 0 A58 58 0 0 1 0.00 -50.00"/><path d="M0 0 A58 58 0 0 1 43.30 25.00"/><path d="M0 0 A58 58 0 0 1 -43.30 25.00"/><circle cx="-52.34" cy="-25.00" r="71" clip-path="url(#ssv0)"/><circle cx="-52.34" cy="-25.00" r="84" clip-path="url(#ssv0)"/><circle cx="47.82" cy="-32.82" r="71" clip-path="url(#ssv1)"/><circle cx="47.82" cy="-32.82" r="84" clip-path="url(#ssv1)"/><circle cx="4.52" cy="57.82" r="71" clip-path="url(#ssv2)"/><circle cx="4.52" cy="57.82" r="84" clip-path="url(#ssv2)"/></g></g><circle r="48.3" fill="none" stroke="#0E1A3B" stroke-width="5"/></svg>';
const BALLW='<svg viewBox="-54 -54 108 108"><defs><clipPath id="ssw0"><path d="M0 0 A58 58 0 0 1 0.00 -50.00 A50 50 0 0 1 43.30 25.00 A58 58 0 0 0 0 0 Z"/></clipPath><clipPath id="ssw1"><path d="M0 0 A58 58 0 0 1 43.30 25.00 A50 50 0 0 1 -43.30 25.00 A58 58 0 0 0 0 0 Z"/></clipPath><clipPath id="ssw2"><path d="M0 0 A58 58 0 0 1 -43.30 25.00 A50 50 0 0 1 0.00 -50.00 A58 58 0 0 0 0 0 Z"/></clipPath><clipPath id="ballsw"><circle r="49"/></clipPath></defs><circle r="50" fill="#fff"/><g clip-path="url(#ballsw)"><circle cx="-52.34" cy="-25.00" r="77.5" fill="none" stroke="#FF7A1A" stroke-width="13" clip-path="url(#ssw0)"/><circle cx="47.82" cy="-32.82" r="77.5" fill="none" stroke="#FF7A1A" stroke-width="13" clip-path="url(#ssw1)"/><circle cx="4.52" cy="57.82" r="77.5" fill="none" stroke="#FF7A1A" stroke-width="13" clip-path="url(#ssw2)"/><g fill="none" stroke="#0E1A3B" stroke-width="5" stroke-linecap="round"><path d="M0 0 A58 58 0 0 1 0.00 -50.00"/><path d="M0 0 A58 58 0 0 1 43.30 25.00"/><path d="M0 0 A58 58 0 0 1 -43.30 25.00"/><circle cx="-52.34" cy="-25.00" r="71" clip-path="url(#ssw0)"/><circle cx="-52.34" cy="-25.00" r="84" clip-path="url(#ssw0)"/><circle cx="47.82" cy="-32.82" r="71" clip-path="url(#ssw1)"/><circle cx="47.82" cy="-32.82" r="84" clip-path="url(#ssw1)"/><circle cx="4.52" cy="57.82" r="71" clip-path="url(#ssw2)"/><circle cx="4.52" cy="57.82" r="84" clip-path="url(#ssw2)"/></g></g><circle r="48.3" fill="none" stroke="#0E1A3B" stroke-width="5"/></svg>';

/* ================= state ================= */
const uid=()=>Math.random().toString(36).slice(2,10);
const RULES0={level:'ms',sets:3,pts:25,decider:15,playAll:false,subs:18,tos:2,measure:'points'};
function blankTeam(name){return {id:uid(),name:name||'Our Team',players:[],games:[],cur:null,settings:Object.assign({},RULES0)}}
function blank(){const t=blankTeam();return {v:1,teams:[t],teamId:t.id,drills:[],favDrills:[],ui:{tab:'game',view:'plan',set:0,stat:'all',dfocus:'All',rview:'players',rsort:'num',player:null},
  board:{home:'Home',away:'Away',h:0,a:0,hs:0,as:0,serve:'h',swap:false,hist:[]}}}
// Each team keeps its own roster, game days and rules. S.players, S.games, S.cur, S.team and S.settings point at the current team.
function norm(s){
  const b=blank();if(!s||s.v!==1)return attach(b);
  const o=Object.assign({},b,s,{ui:Object.assign(b.ui,s.ui||{}),board:Object.assign(b.board,s.board||{})});
  if(!Array.isArray(s.teams)||!s.teams.length){   // before teams existed: one roster at the top level
    const t=blankTeam((s.team&&s.team.name)||'Our Team');t.players=s.players||[];t.games=s.games||[];t.cur=s.cur||null;Object.assign(t.settings,s.settings||{});
    o.teams=[t];o.teamId=t.id}
  ['players','games','cur','team','settings'].forEach(k=>delete o[k]);
  o.teams.forEach(t=>{t.settings=Object.assign({},RULES0,t.settings||{});if(t.settings.subLimit){delete t.settings.subLimit}
    ['players','games'].forEach(k=>{if(!Array.isArray(t[k]))t[k]=[]});if(!t.cur&&t.games.length)t.cur=t.games[t.games.length-1].id;if(!t.name)t.name='Our Team'});
  if(!o.teams.some(t=>t.id===o.teamId))o.teamId=o.teams[0].id;
  if(!Array.isArray(o.drills))o.drills=[];if(!Array.isArray(o.favDrills))o.favDrills=[];
  return attach(o)}
function attach(o){const T=()=>o.teams.find(t=>t.id===o.teamId)||o.teams[0];
  const prop=(k,get,set)=>Object.defineProperty(o,k,{get,set,enumerable:false,configurable:true});
  prop('players',()=>T().players,v=>{T().players=v});prop('games',()=>T().games,v=>{T().games=v});prop('cur',()=>T().cur,v=>{T().cur=v});
  prop('team',()=>T(),()=>{});prop('settings',()=>T().settings,v=>{T().settings=v});return o}
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const lsSet=(k,v)=>{try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const hasData=s=>!!s&&((s.players&&s.players.length)||(s.games&&s.games.length)||(s.drills&&s.drills.length)||(Array.isArray(s.teams)&&s.teams.some(t=>(t.players&&t.players.length)||(t.games&&t.games.length))));
let S=norm(lsGet(DEVICE_KEY));
let saveTo='device';try{if(localStorage.getItem(MODE_KEY)==='account')saveTo='account'}catch(e){}
let ME=null, syncState='', saveTimer=null, saving=null;
const WA=window.WebApps||null;
const onAccount=()=>saveTo==='account'&&!!ME;
const store={
  async load(){if(WA.mode==='supabase'){const r=await WA.client.from('volleyball_state').select('state').eq('user_id',ME.id).maybeSingle();if(r.error)throw r.error;return r.data?r.data.state:null}return lsGet(LOCAL_KEY+ME.id)},
  async put(st){if(WA.mode==='supabase'){const r=await WA.client.from('volleyball_state').upsert({user_id:ME.id,state:st,updated_at:new Date().toISOString()});if(r.error)throw r.error;return}lsSet(LOCAL_KEY+ME.id,st)}
};
function save(){
  if(DEMO)return;
  if(onAccount()){lsSet(ACCT_KEY+ME.id,S);clearTimeout(saveTimer);syncState='saving';saveTimer=setTimeout(pushState,700);if(S.team&&S.team.cloud)queueCloud()}
  else lsSet(DEVICE_KEY,S);
}
const personal=st=>{const o=JSON.parse(JSON.stringify(st));o.teams=(o.teams||[]).filter(t=>!t.cloud);return o};
async function pushState(){clearTimeout(saveTimer);saveTimer=null;if(!onAccount())return;const snap=personal(S);
  const run=async()=>{try{await store.put(snap);syncState='saved';}catch(e){syncState='error';toast("Couldn't save to your account. It will try again on your next change.")}if(S.ui.tab==='settings')render()};
  saving=(saving||Promise.resolve()).then(run);return saving}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&saveTimer)pushState()});
async function startAccount(){
  if(!WA||!WA.me){ME=null;S=norm(lsGet(DEVICE_KEY));render();return}
  const me=WA.me;ME={id:me.id,username:me.username,name:me.display_name};
  try{const apps=await WA.apps();const a=apps.find(x=>x.slug===APP);if(a&&!a.status)await WA.join(APP)}catch(e){}
  if(saveTo!=='account'){render();return}
  const cached=lsGet(ACCT_KEY+ME.id);S=norm(cached);syncState='';
  try{const st=await store.load();
    if(st&&(hasData(st)||Array.isArray(st.teams))){S=norm(st);syncState='saved'}
    else{const dev=lsGet(DEVICE_KEY);if(hasData(dev)&&!hasData(cached)){S=norm(dev);lsSet(ACCT_KEY+ME.id,S);await pushState();toast("Copied this device's notebook into your account")}else if(hasData(cached)){await pushState()}else syncState='saved'}
  }catch(e){syncState='offline';toast('Offline. Showing your last saved notebook.')}
  await loadCloud(true);await refreshDrills();
  lsSet(ACCT_KEY+ME.id,S);render();
}

/* ================= shared teams =================
   A shared team lives in volleyball_teams (everything but live scoring) and volleyball_sets (each set's scoring),
   so a scorekeeper can score without touching the roster. Roles: owner, coach, scorekeeper, viewer. */
const LIVE_KEYS=['first','opp','started','ended','ev','startedAt','endedAt'];
const roleOf=t=>t&&t.cloud?t.role:'owner';
const canEdit=t=>['owner','coach'].includes(roleOf(t||S.team));
const canScore=t=>['owner','coach','scorekeeper'].includes(roleOf(t||S.team));
const canShare=t=>['owner','coach'].includes(roleOf(t||S.team));
const ROLE_NAME={owner:'Owner',coach:'Coach',scorekeeper:'Scorekeeper',viewer:'Viewer'};
function canon(v){if(Array.isArray(v))return '['+v.map(canon).join(',')+']';if(v&&typeof v==='object')return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';return JSON.stringify(v===undefined?null:v)}
function splitTeam(t){
  const sets={};const games=t.games.map(g=>({id:g.id,date:g.date,opp:g.opp,sets:g.sets.map((x,i)=>{const live={};LIVE_KEYS.forEach(k=>{if(x[k]!==undefined)live[k]=x[k]});sets[g.id+'|'+i]=live;return {lineup:x.lineup,libero:x.libero}})}));
  return {struct:{name:t.name,players:t.players,games,settings:t.settings},sets}}
function joinTeam(struct,rows,prev){
  const t=Object.assign(blankTeam(struct.name),{name:struct.name||'Team',players:struct.players||[],settings:Object.assign({},RULES0,struct.settings||{})});
  t.games=(struct.games||[]).map(g=>({id:g.id,date:g.date,opp:g.opp,sets:(g.sets||[]).map((x,i)=>Object.assign(newSet(),{lineup:x.lineup||[null,null,null,null,null,null],libero:x.libero||null},(rows&&rows[g.id+'|'+i])||{}))}));
  t.cur=prev&&prev.cur&&t.games.some(g=>g.id===prev.cur)?prev.cur:(t.games.length?t.games[t.games.length-1].id:null);
  return t}
const CL={};   // what the server has, per shared team, to send only what changed
function snapshot(t,structData,rows){const c=CL[t.id]={struct:canon(structData),sets:{}};
  t.games.forEach(g=>g.sets.forEach((x,i)=>{const k=g.id+'|'+i;c.sets[k]=canon(rows&&rows[k]?rows[k]:splitTeam({games:[{id:g.id,sets:[x]}],players:[],settings:{}}).sets[g.id+'|0'])}))}

const CLOUD={
  ok(){return !!(WA&&ME&&saveTo==='account')},
  sb(){return WA.mode==='supabase'},
  async list(){

/* ================= replay: everything about a set comes from its event list ================= */
// Slots I-VI are the starting-lineup columns. Rotation r: position p holds slot (r+p-1)%6.
const slotAt=(p,r)=>(r+p-1)%6;
const posOf=(slot,r)=>((slot-r)%6+6)%6+1;
function replay(set){
  const R={sc:{us:0,them:0},serve:set.first,r:{us:0,them:0},slots:{us:set.lineup.slice(),them:set.opp.slice()},
    lib:{},subs:{us:0,them:0},subLog:{us:[],them:[]},tos:{us:[],them:[]},terms:{us:[],them:[]},term:null,
    run:{us:[],them:[]},pt:{},rallies:0,log:[],
    rot:Array.from({length:6},()=>({w:0,l:0,rw:0,rl:0,sw:0,sl:0})),
    tm:{srv:0,srvW:0,rcv:0,rcvW:0,oSrv:0,oSrvW:0,best:{us:0,them:0},cur:{w:null,n:0}}};
  const mark=id=>R.pt[id]||(R.pt[id]={rallies:0,rots:0,started:false,left:false,ins:0,outs:0,on:false,srv:0,srvW:0,terms:0,pm:0,won:0});
  const scoreStr=t=>t==='us'?R.sc.us+'-'+R.sc.them:R.sc.them+'-'+R.sc.us;
  const onCourt=()=>R.slots.us.filter(Boolean);
  const startTerm=t=>{R.term={team:t,slot:R.r[t]%6,from:R.sc[t]};if(t==='us'){const id=R.slots.us[R.r.us%6];if(id)mark(id).terms++}};
  const endTerm=()=>{if(R.term){R.terms[R.term.team].push({slot:R.term.slot,score:R.sc[R.term.team],pts:R.sc[R.term.team]-R.term.from});R.term=null}};
  const libCheck=()=>{for(const k of Object.keys(R.lib)){const s=+k;const p=posOf(s,R.r.us);if(p>=2&&p<=4){const back=R.lib[k];const l=R.slots.us[s];R.slots.us[s]=back;delete R.lib[k];mark(back).rots++;R.log.push({t:'lib',auto:true,txt:`Libero ${num(l)} out, ${num(back)} back in (front row)`});}}};
  const rotate=t=>{R.r[t]++;if(t==='us'){onCourt().forEach(id=>mark(id).rots++);libCheck()}};
  if(!set.started) return R;
  set.lineup.forEach(id=>{if(id){const m=mark(id);m.started=true;m.rots=1}});
  startTerm(set.first);
  for(const e of set.ev){
    if(e.t==='pt'){
      const w=e.w, serving=R.serve, ri=R.r.us%6, rs=R.rot[ri];
      R.rallies++;onCourt().forEach(id=>{const m=mark(id);m.rallies++;m.pm+=w==='us'?1:-1;if(w==='us')m.won++});
      if(w==='us')rs.w++;else rs.l++;
      if(serving==='us'){R.tm.srv++;rs.sw+=w==='us'?1:0;rs.sl+=w==='us'?0:1;const sid=R.slots.us[ri];if(sid){const m=mark(sid);m.srv++;if(w==='us')m.srvW++}if(w==='us')R.tm.srvW++}
      else{R.tm.rcv++;R.tm.oSrv++;if(w==='us'){R.tm.rcvW++;rs.rw++}else{R.tm.oSrvW++;rs.rl++}}
      const c=R.tm.cur;if(c.w===w)c.n++;else{c.w=w;c.n=1}R.tm.best[w]=Math.max(R.tm.best[w],c.n);
      R.sc[w]++;R.run[w].push({n:R.sc[w],served:w===serving});
      if(w!==serving){endTerm();R.serve=w;rotate(w);startTerm(w);R.log.push({t:'pt',w,txt:`${w==='us'?'We':'They'} side out · ${R.sc.us}-${R.sc.them}`});}
      else R.log.push({t:'pt',w,txt:`${w==='us'?'We':'They'} score on serve · ${R.sc.us}-${R.sc.them}`});
    }else if(e.t==='rot'){
      const t=e.team||'us';const same=R.term&&R.term.team===t;if(same)endTerm();rotate(t);if(same)startTerm(t);R.log.push({t:'rot',txt:'Rotated'});
    }else if(e.t==='sub'){
      const team=e.team,out=R.slots[team][e.slot];
      if(team==='us'){
        if(e.lib){
          if(e.in===set.libero&&out!==set.libero){R.lib[e.slot]=out;R.slots.us[e.slot]=e.in;mark(e.in).rots++;R.log.push({t:'lib',txt:`Libero ${num(e.in)} in for ${num(out)}`});}
          else if(out===set.libero&&R.lib[e.slot]){const back=R.lib[e.slot];R.slots.us[e.slot]=back;delete R.lib[e.slot];mark(back).rots++;R.log.push({t:'lib',txt:`Libero out, ${num(back)} back in`});}
          continue;
        }
        if(R.lib[e.slot]) delete R.lib[e.slot];
        R.slots.us[e.slot]=e.in;R.subs.us++;
        const mo=mark(out);mo.left=true;mo.outs++;const mi=mark(e.in);mi.ins++;mi.rots++;
        R.subLog.us.push({slot:e.slot,out,in:e.in,score:scoreStr('us')});
        R.log.push({t:'sub',txt:`Sub: ${num(e.in)} in for ${num(out)} · ${R.sc.us}-${R.sc.them}`});
      }else{
        R.slots.them[e.slot]=e.in;R.subs.them++;
        R.subLog.them.push({slot:e.slot,out,in:e.in,score:scoreStr('them')});
        R.log.push({t:'sub',txt:`They sub #${e.in} for #${out||'?'}`});
      }
    }else if(e.t==='to'){
      R.tos[e.team].push(scoreStr(e.team));R.log.push({t:'to',txt:`Timeout ${e.team==='us'?S.team.name:'them'} · ${R.sc.us}-${R.sc.them}`});
    }
  }
  if(set.ended) endTerm();
  for(const id of onCourt()) mark(id).on=true;
  for(const id in R.pt){const m=R.pt[id];m.full=set.ended&&m.started&&!m.left;m.played=m.rallies>0||m.started||m.ins>0||m.on}
  return R;
}
function target(g,i){const st=S.settings;const n=g.sets.length;return (n>=3&&n%2===1&&i===n-1)?st.decider:st.pts}
function setWon(R,t){const a=R.sc.us,b=R.sc.them;if(Math.max(a,b)>=t&&Math.abs(a-b)>=2)return a>b?'us':'them';return null}
function gameRecord(g){let w=0,l=0;g.sets.forEach(s=>{if(s.ended){const R=replay(s);if(R.sc.us>R.sc.them)w++;else if(R.sc.them>R.sc.us)l++;}});
  const need=Math.floor(g.sets.length/2)+1;const over=g.sets.length>1&&(w>=need||l>=need);return {w,l,over}}
// a set that won't be played: the match is decided and the rules only play the last set when needed
const notNeeded=(g,i)=>{const s=g.sets[i];if(s.started||S.settings.playAll)return false;return gameRecord(g).over}

/* ================= render ================= */
const LOGO='<img src="icon-512.png" alt="">';
function render(){
  if(DR.raf){cancelAnimationFrame(DR.raf);DR.raf=0}

  document.querySelector('.top').hidden=(t==='board');
  const m=$('#main');
  const rb=S.team.cloud&&['game','sheet','roster'].includes(t)?`<div class="rolebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.7-3.2 3.1-5 6-5s5.3 1.8 6 5"/><path d="M16 4.5a3 3 0 0 1 0 6M18 14c1.7.6 2.8 2.2 3.2 4.5"/></svg><span><b>${esc(S.team.name)}</b> is shared · you're ${roleOf(S.team)==='owner'?'the owner':roleOf(S.team)==='coach'?'a coach':roleOf(S.team)==='scorekeeper'?'the scorekeeper':'a viewer'}</span>${cloudState==='error'?'<span class="pill part" style="margin-left:auto">Not saved</span>':''}</div>`:'';
  m.innerHTML=rb+(t==='game'?viewGame():t==='sheet'?viewSheet():t==='board'?viewBoard():t==='drills'?viewDrills():t==='settings'?viewSettings():viewRoster());

function emptyRoster(){return `<div class="card empty">${LOGO}<h2>Start with your roster</h2><p>Add your players with their numbers and positions. Then you can plan lineups for every set and track rotations, subs, playing time and stats.</p>
  ${canEdit()?`<div class="row" style="justify-content:center;gap:10px;flex-wrap:wrap"><button class="btn pri" data-act="tab" data-tab="roster">Add players</button><button class="btn ghost" data-act="sample">Try a sample team</button></div>`:'<p class="muted">A coach needs to add the players first.</p>'}</div>`}
function noGame(){return `<div class="card empty">${LOGO}<h2>No game day yet</h2><p>Make a game day for a match or scrimmage. Each one has its own sets, lineups, scorecard, playing time and stats.</p>${canEdit()?'<button class="btn pri" data-act="newGame">New game day</button>':'<p class="muted">A coach sets up game days.</p>'}</div>`}

function setChips(g,cur,extra){
  return `<div class="chips">${extra?`<button class="chip ${cur==='plan'?'on':''}" data-act="view" data-v="plan">All sets</button><button class="chip alt ${cur==='time'?'on':''}" data-act="view" data-v="time">Playing time</button><button class="chip alt ${cur==='stats'?'on':''}" data-act="view" data-v="stats">Stats</button>`:''}${g.sets.map((s,i)=>{
    const R=s.started?replay(s):null;const st=s.ended?` ${R.sc.us}-${R.sc.them}`:'';
    return `<button class="chip ${cur===i?'on':''}" data-act="pickSet" data-i="${i}">${s.started&&!s.ended?'<span class="dot"></span>':''}Set ${i+1}${st}</button>`}).join('')}
    ${g.sets.length<5&&canEdit()?`<button class="chip" data-act="addSet" aria-label="Add a set">+</button>`:''}
</div>`;
}

function viewGame(){
  if(!S.players.length) return emptyRoster();
  const g=G(); if(!g) return noGame();
  const v=S.ui.view;
  if(v==='plan') return setChips(g,'plan',true)+viewPlan(g);
  if(v==='time') return setChips(g,'time',true)+viewTime(g);
  if(v==='stats') return setChips(g,'stats',true)+viewStats(g);
  const i=Math.min(S.ui.set,g.sets.length-1);const s=g.sets[i];
  return setChips(g,i,true)+(s.started?viewLive(g,s,i):viewEdit(g,s,i));
}

function court(slots,r,o){
  o=o||{};const order=[4,3,2,5,6,1];
  return `<div class="court ${o.mini?'mini':''}"><div class="net"></div><div class="atk"></div><div class="cgrid">${order.map(p=>{
    const s=slotAt(p,r);const id=slots[s];const pl=id?P(id):null;
    const act=o.act?`data-act="${o.act}" data-slot="${s}"`:'';
    const tag=o.act?'button':'div';
    if(!pl) return `<${tag} class="spot empty-s" ${act}><span class="pos">${p}</span>${o.mini?'—':'+ Player'}</${tag}>`;
    const isL=o.libero&&id===o.libero;const m=o.R&&o.R.pt[id];
    const tm=m?(S.settings.measure==='rotations'?m.rots+' rot':m.rallies+' pts'):'';
    return `<${tag} class="spot ${p===1&&o.serving?'srv':''} ${isL?'lib':''}" ${act}><span class="pos">${p}</span><span class="slot">${ROMAN[s]}</span><span class="jn">${esc(pl.num)}</span><span class="nm">${esc(short(pl))}</span><span class="rl">${isL?'Libero':esc(POSNAME[pl.pos]||'')}</span>${m?`<span class="tm">${tm}</span>`:''}${p===1&&o.serving?BALL:''}</${tag}>`}).join('')}</div></div>`;
}

function viewPlan(g){const rec=gameRecord(g);
  return `${rec.over?`<div class="banner ${rec.w>rec.l?'':'info'}">${rec.w>rec.l?'Match won':'Match lost'} ${rec.w}–${rec.l}${S.settings.playAll&&g.sets.some(s=>!s.ended)?'. Your rules play every set, so keep going.':''}</div>`:''}<p class="muted" style="margin:0 0 10px">${canEdit()?'Your starting lineup for each set. Tap a set to change it or start it.':'The starting lineup for each set. Tap a set to see it'+(canScore()?' or start it.':'.')}</p><div class="plan">${g.sets.map((s,i)=>{
    const R=s.started?replay(s):null;const filled=s.lineup.filter(Boolean).length;
    const st=s.ended?`<span class="pill done">Final ${R.sc.us}-${R.sc.them}</span>`:notNeeded(g,i)?'<span class="pill">Not needed</span>':s.started?`<span class="pill live">Live ${R.sc.us}-${R.sc.them}</span>`:filled===6?'<span class="pill ok">Ready</span>':`<span class="pill">${filled}/6 set</span>`;
    const lib=s.libero?P(s.libero):null;
    return `<div class="card"><div class="row" style="margin-bottom:8px"><h3 style="margin:0">Set ${i+1}</h3><span class="muted" style="font-size:12px">to ${target(g,i)}</span><span style="margin-left:auto">${st}</span></div>
      <button data-act="pickSet" data-i="${i}" style="display:block;width:100%;${notNeeded(g,i)?'opacity:.45':''}">${court(s.lineup,0,{mini:true})}</button>
      <div class="row" style="margin-top:8px;font-size:13px"><span class="muted">${lib?'Libero #'+esc(lib.num)+' '+esc(short(lib)):'No libero'} · ${s.first==='us'?'We serve':'They serve'}</span></div></div>`}).join('')}</div>`;
}

function viewEdit(g,s,i){
  const filled=s.lineup.filter(Boolean).length;const r=S.ui.preview||0;
  const others=g.sets.map((x,j)=>j).filter(j=>j!==i&&g.sets[j].lineup.some(Boolean));
  return `<div class="layout two"><div>
    ${court(s.lineup,r,{act:canEdit()?'pickSpot':'',serving:s.first==='us',libero:s.libero})}
    <div class="row" style="justify-content:center;margin-top:10px;gap:8px">
      <button class="btn sm ghost" data-act="preview">↻ Preview rotation ${r%6+1}</button>
      ${r?`<button class="btn sm ghost" data-act="previewReset">Back to start</button>`:''}
    </div></div>
    <div class="card">
      <h3>Set ${i+1} lineup</h3>
      <p class="muted" style="margin:0 0 12px;font-size:14px">${canEdit()?'':'The coach sets the lineup. '}Tap a spot on the court to put a player there. Position 1 serves first.${r?' <b>Previewing rotation '+(r%6+1)+'</b>; tap a spot to edit the start.':''}</p>
      <div class="field"><span class="lbl">Libero</span><select data-act="setLibero" data-change="1" ${canEdit()?'':'disabled'}><option value="">None</option>${S.players.slice().sort(byNum).map(p=>`<option value="${p.id}" ${s.libero===p.id?'selected':''}>#${esc(p.num)} ${esc(p.name)}${p.pos==='L'?' (L)':''}</option>`).join('')}</select></div>
      <div class="field"><span class="lbl">First serve</span><div class="seg"><button class="${s.first==='us'?'on':''}" data-act="first" data-w="us">We serve</button><button class="${s.first==='them'?'on':''}" data-act="first" data-w="them">They serve</button></div></div>
      ${others.length&&canEdit()?`<div class="row wrap" style="margin-bottom:12px"><span class="lbl" style="margin-right:4px">Copy from</span>${others.map(j=>`<button class="btn sm" data-act="copySet" data-from="${j}">Set ${j+1}</button>`).join('')}</div>`:''}
      ${canScore()?`<button class="btn pri wide" data-act="startSet" ${filled<6?'disabled':''}>${filled<6?`Pick ${6-filled} more player${6-filled>1?'s':''}`:`Start Set ${i+1}`}</button>`:''}
      ${filled&&canEdit()?`<button class="btn ghost wide" style="margin-top:8px" data-act="clearLineup">Clear lineup</button>`:''}
    </div></div>`;
}

function viewLive(g,s,i){
  const R=replay(s);const tg=target(g,i);const won=!s.ended&&setWon(R,tg);
  const onIds=R.slots.us.filter(Boolean);
  const bench=S.players.filter(p=>!onIds.includes(p.id)).sort(byNum);
  const lim=S.settings.subs, tol=S.settings.tos;
  return `${won?`<div class="banner">${won==='us'?'We':'They'} reached ${tg}. <button class="btn sm dark" data-act="endSet">End set</button></div>`:''}
  <div class="layout two"><div>
    ${strip(R,g)}
    ${court(R.slots.us,R.r.us,{act:s.ended||!canScore()?'':'tapPlayer',serving:R.serve==='us',libero:s.libero,R})}
    ${s.ended||!canScore()?'':`<div class="ctl"><button class="btn us" data-act="pt" data-w="us">+1 ${esc(S.team.name)}</button><button class="btn them" data-act="pt" data-w="them">+1 ${esc(g.opp)}</button>
      <button class="btn dark" data-act="rotate">↻ Rotate</button><button class="btn ghost" data-act="undo" ${s.ev.length?'':'disabled'}>Undo</button></div>`}
    <div class="meta"><span class="pill ${R.subs.us>=lim?'part':''}">Subs ${R.subs.us} / ${lim>=99?'∞':lim}</span><span class="pill">Rotation ${R.r.us%6+1}</span><span class="pill ${R.tos.us.length>=tol?'part':''}">Timeouts ${R.tos.us.length} / ${tol}</span>${s.ended?'<span class="pill done">Final</span>':''}</div>
  </div><div>
    <div class="card"><div class="row"><h3 style="margin:0">Bench</h3><span class="muted" style="margin-left:auto;font-size:13px">${canScore()?'tap a player on court to sub':''}</span></div>
      <div class="bench" style="margin-top:10px">${bench.map(p=>{const m=R.pt[p.id];return `<span class="bp"><span class="num">${esc(p.num)}</span>${esc(short(p))}${m&&m.rallies?` <span class="muted" style="font-size:12px">${m.rallies} pts</span>`:''}</span>`}).join('')||'<span class="muted">Everyone is on the court.</span>'}</div></div>
    <div class="card"><h3>This set</h3>${timeTable([s],[i],true)}</div>
    ${canScore()?`<div class="row" style="margin-top:12px;gap:8px">${s.ended?`<button class="btn ghost" data-act="reopen">Reopen set</button>`:`<button class="btn dark" data-act="endSet">End set</button><button class="btn ghost" data-act="timeout" data-team="us">Timeout</button>`}</div>`:''}
  </div></div>`;
}

function strip(R,g){
  const sv=(t,right)=>R.serve===t?`<div class="sv" ${right?'style="justify-content:flex-end"':''}>${BALLW} Serving</div>`:'<div class="sv" style="visibility:hidden">&nbsp;</div>';
  return `<div class="strip" data-tour="strip"><div class="tbox us"><div style="min-width:0"><div class="tn">${esc(S.team.name)}</div>${sv('us')}</div><div class="sc">${R.sc.us}</div></div>
    <div class="tbox them"><div class="sc">${R.sc.them}</div><div style="min-width:0;text-align:right"><div class="tn">${esc(g.opp)}</div>${sv('them',1)}</div></div></div>`;
}

function timeCell(m,R,isOn){
  const rot=S.settings.measure==='rotations';
  const pill=m.full?'<span class="pill ok">Full</span>':isOn&&!m.left?'<span class="pill live">On</span>':'<span class="pill part">Part</span>';
  const detail=rot?`${m.rots} rot`:`${m.rallies}/${R.rallies}`;
  return `<td class="c">${pill}<div class="sm" style="margin-top:2px;white-space:nowrap">${detail}</div></td>`;
}
function timeTable(sets,idx,compact){
  const Rs=sets.map(s=>s.started?replay(s):null);const rot=S.settings.measure==='rotations';
  let allR=0;Rs.forEach(R=>{if(R)allR+=R.rallies});
  const rows=S.players.slice().sort(byNum).map(p=>{
    let tot=0,rots=0,starts=0,full=0,ins=0,any=false;
    const cells=Rs.map((R,k)=>{const m=R&&R.pt[p.id];if(!m||!m.played)return '<td class="c muted">—</td>';
      any=true;tot+=m.rallies;rots+=m.rots;if(m.started)starts++;if(m.full)full++;ins+=m.ins;
      return timeCell(m,R,!sets[k].ended&&m.on)}).join('');
    if(compact&&!any)return '';
    return `<tr><td><span class="num" style="min-width:30px;height:30px;font-size:16px">${esc(p.num)}</span></td><td style="font-weight:600">${esc(p.name)}</td>${cells}${compact?'':`<td class="c"><b>${starts}</b></td><td class="c"><b>${full}</b></td><td class="c"><b>${rot?rots:tot}</b>${!rot&&allR?`<div class="sm">${pct(tot,allR)}</div>`:''}</td><td class="c">${ins}</td>`}</tr>`}).join('');
  return `<div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>Player</th>${idx.map(i=>`<th class="c">${compact?'Time':'Set '+(i+1)}</th>`).join('')}${compact?'':`<th class="c">Starts</th><th class="c">Full sets</th><th class="c">${rot?'Rotations':'Points played'}</th><th class="c">Subbed in</th>`}</tr></thead><tbody>${rows||`<tr><td colspan="9" class="muted">No one has played yet.</td></tr>`}</tbody></table></div>`;
}

function viewTime(g){
  const rec=gameRecord(g);
  return `<div class="card"><div class="row wrap"><h3 style="margin:0">Playing time · vs ${esc(g.opp)}</h3><span class="pill" style="margin-left:auto">Sets ${rec.w}-${rec.l}</span></div>
  <p class="muted" style="font-size:13px;margin:6px 0 10px"><b>Full</b> means they started the set and were never subbed out. <b>Part</b> shows ${S.settings.measure==='rotations'?'how many rotations they were on the court for':'how many points they were on the court for, out of the points played in that set'}. Libero swaps don't count as subs.</p>
  ${timeTable(g.sets,g.sets.map((s,i)=>i),false)}</div>`;
}

/* ================= stats ================= */
function gatherStats(g,which){
  const idx=g.sets.map((s,i)=>i).filter(i=>g.sets[i].started&&(which==='all'||+which===i));
  const T={pts:0,opp:0,srv:0,srvW:0,rcv:0,rcvW:0,oSrv:0,oSrvW:0,best:0,obest:0,subs:0,tos:0,rallies:0,sets:idx.length};
  const rot=Array.from({length:6},()=>({w:0,l:0,rw:0,rl:0,sw:0,sl:0}));const pl={};
  idx.forEach(i=>{const R=replay(g.sets[i]);T.pts+=R.sc.us;T.opp+=R.sc.them;T.srv+=R.tm.srv;T.srvW+=R.tm.srvW;T.rcv+=R.tm.rcv;T.rcvW+=R.tm.rcvW;T.oSrv+=R.tm.oSrv;T.oSrvW+=R.tm.oSrvW;
    T.best=Math.max(T.best,R.tm.best.us);T.obest=Math.max(T.obest,R.tm.best.them);T.subs+=R.subs.us;T.tos+=R.tos.us.length;T.rallies+=R.rallies;
    R.rot.forEach((x,k)=>{for(const f in x)rot[k][f]+=x[f]});
    for(const id in R.pt){const m=R.pt[id];const a=pl[id]||(pl[id]={srv:0,srvW:0,terms:0,pm:0,rallies:0,won:0});a.srv+=m.srv;a.srvW+=m.srvW;a.terms+=m.terms;a.pm+=m.pm;a.rallies+=m.rallies;a.won+=m.won}});
  return {T,rot,pl,idx};
}
function viewStats(g){
  const which=S.ui.stat==null?'all':S.ui.stat;const {T,rot,pl,idx}=gatherStats(g,which);
  const chips=`<div class="seg" style="margin-bottom:12px"><button class="${which==='all'?'on':''}" data-act="statSet" data-v="all">All sets</button>${g.sets.map((s,i)=>`<button class="${String(which)===String(i)?'on':''}" data-act="statSet" data-v="${i}" ${s.started?'':'disabled'}>Set ${i+1}</button>`).join('')}</div>`;
  if(!idx.length||!T.rallies) return chips+`<div class="card empty"><h2>No rallies yet</h2><p>Stats come from the scorecard. Every rally you score on the Lineup or Scorecard tab adds to them.</p></div>`;
  const pmc=v=>`<span class="pm ${v>0?'up':v<0?'dn':''}">${v>0?'+':''}${v}</span>`;
  const tiles=`<div class="tiles">
    <div class="tile"><b>${T.pts}–${T.opp}</b><span>Points</span><em>${T.rallies} rallies</em></div>
    <div class="tile"><b>${pct(T.rcvW,T.rcv)}</b><span>Side-out %</span><em>${T.rcvW} of ${T.rcv} when they served</em></div>
    <div class="tile"><b>${pct(T.srvW,T.srv)}</b><span>Points on our serve</span><em>${T.srvW} of ${T.srv} serves</em></div>
    <div class="tile"><b>${pct(T.srv-T.srvW,T.srv)}</b><span>Their side-out %</span><em>${T.srv-T.srvW} of ${T.srv} when we served</em></div>
    <div class="tile"><b>${T.best}</b><span>Longest run</span><em>Theirs: ${T.obest}</em></div>
    <div class="tile"><b>${T.subs}</b><span>Subs used</span><em>${T.sets} set${T.sets>1?'s':''}</em></div>
    <div class="tile"><b>${T.tos}</b><span>Timeouts used</span></div>
    <div class="tile"><b>${pmc(T.pts-T.opp)}</b><span>Point difference</span></div></div>`;
  const rotRows=rot.map((x,k)=>{const n=x.w+x.l;if(!n)return `<tr><td><b>Rot ${k+1}</b></td><td colspan="4" class="muted">Didn't play here</td></tr>`;
    return `<tr><td><b>Rot ${k+1}</b><div class="sm">${n} rallies</div></td><td class="c">${x.w}–${x.l}</td><td class="c">${pmc(x.w-x.l)}</td><td class="c">${pct(x.rw,x.rw+x.rl)}<div class="sm">${x.rw}/${x.rw+x.rl}</div></td><td class="c">${pct(x.sw,x.sw+x.sl)}<div class="sm">${x.sw}/${x.sw+x.sl}</div></td></tr>`}).join('');
  const ps=S.players.filter(p=>pl[p.id]&&(pl[p.id].rallies||pl[p.id].srv)).sort(byNum);
  const pRows=ps.map(p=>{const a=pl[p.id];return `<tr><td><span class="num" style="min-width:30px;height:30px;font-size:16px">${esc(p.num)}</span></td><td style="font-weight:600">${esc(p.name)}</td>
    <td class="c">${a.srv}<div class="sm">${a.terms} turn${a.terms===1?'':'s'}</div></td><td class="c">${a.srvW}</td><td class="c">${pct(a.srvW,a.srv)}</td><td class="c">${pmc(a.pm)}</td><td class="c">${a.won}/${a.rallies}<div class="sm">${pct(a.won,a.rallies)}</div></td></tr>`}).join('');
  return chips+`<div class="layout two"><div class="card"><h3>Team</h3>${tiles}</div>
  <div class="card"><h3>By rotation</h3><p class="muted" style="font-size:13px;margin:0 0 6px">Rotation 1 is your starting lineup. Find the rotations that leak points.</p>
    <div class="scroll"><table class="tbl"><thead><tr><th></th><th class="c">Won–lost</th><th class="c">+/-</th><th class="c">Side-out</th><th class="c">On serve</th></tr></thead><tbody>${rotRows}</tbody></table></div></div></div>
  <div class="card" style="margin-top:12px"><h3>Players</h3><p class="muted" style="font-size:13px;margin:0 0 6px"><b>Serves</b> are rallies with her serving. <b>+/-</b> is points won minus points lost while she was on the court.</p>
    <div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>Player</th><th class="c">Serves</th><th class="c">Points on serve</th><th class="c">Serve win %</th><th class="c">+/-</th><th class="c">Rallies won</th></tr></thead><tbody>${pRows}</tbody></table></div></div>`;
}

/* ================= scorecard ================= */
function viewSheet(){
  if(!S.players.length) return `<div class="row" style="margin-bottom:10px"><h2 style="margin:0">Scorecard</h2><button class="helpbtn" data-act="help" aria-label="How scorekeeping works">?</button><span class="muted" style="font-size:13px">How it works</span></div>`+emptyRoster();
  const g=G(); if(!g) return noGame();
  const i=Math.min(S.ui.set,g.sets.length-1);const s=g.sets[i];
  let h=`<div class="row" style="margin-bottom:6px"><h2 style="margin:0">Scorecard</h2><button class="helpbtn" data-act="help" aria-label="How scorekeeping works">?</button><span class="muted" style="font-size:13px">How it works</span></div>`+setChips(g,i,false);
  if(!s.started){
    const ready=s.lineup.filter(Boolean).length===6;

      <div class="field" style="margin-top:14px" data-tour="first"><span class="lbl">First serve</span><div class="seg"><button class="${s.first==='us'?'on':''}" data-act="first" data-w="us">${esc(S.team.name)}</button><button class="${s.first==='them'?'on':''}" data-act="first" data-w="them">${esc(g.opp)}</button></div></div>
      ${!canScore()?'<p class="muted" style="margin:0">Waiting for the scorekeeper to start the set.</p>':ready?`<button class="btn pri wide" data-act="startSet" data-tour="start">Start Set ${i+1}</button>`:canEdit()?`<button class="btn dark wide" data-act="goLineup">Set our lineup first</button>`:'<p class="muted" style="margin:0">Waiting for a coach to set the lineup.</p>'}

function sheetTeam(R,s,t,name,g,i){
  const isUs=t==='us';

  const curSlot=R.serve===t&&!s.ended?R.r[t]%6:-1;
  const subs=k=>R.subLog[t].filter(x=>x.slot===k).map(x=>`<span class="sb">${esc(isUs?(P(x.in)||{}).num:x.in)} <i>${esc(x.score)}</i></span>`).join('')||'&nbsp;';
  const terms=k=>{let out=R.terms[t].filter(x=>x.slot===k).map(x=>`<span class="tb">${x.score}</span>`).join('');
    if(R.term&&R.term.team===t&&R.term.slot===k&&!s.ended)out+=`<span class="tb open">${R.sc[t]}</span>`;return out||'&nbsp;'};
  const tg=target(g,i);const top=Math.max(tg>15?30:15,Math.ceil((R.sc[t]+1)/15)*15);

  return `<div class="ss"><div class="ssh"><span class="tag" style="background:var(--${t})">${isUs?'A':'B'}</span><span class="tn">${esc(name)}</span>

    <tr data-tour="${t}-subs"><td class="rh">Subs</td>${ROMAN.map((x,k)=>`<td>${subs(k)}</td>`).join('')}</tr>
    <tr data-tour="${t}-service"><td class="rh">Service</td>${ROMAN.map((x,k)=>`<td>${terms(k)}</td>`).join('')}</tr></table>

// Every game day of the current team, added up per player.
function seasonStats(){
  const out={};const games=S.games.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  games.forEach(g=>g.sets.forEach(s=>{if(!s.started)return;const R=replay(s);
    for(const id in R.pt){const m=R.pt[id];if(!m.played)continue;
      const a=out[id]||(out[id]={games:0,_g:{},sets:0,starts:0,full:0,rallies:0,of:0,srv:0,srvW:0,pm:0,won:0,ins:0,rots:0,byGame:[]});
      if(!a._g[g.id]){a._g[g.id]={g,sets:0,full:0,starts:0,rallies:0,of:0,srv:0,srvW:0,pm:0,won:0};a.byGame.push(a._g[g.id]);a.games++}
      const bg=a._g[g.id];
      for(const [k,v] of [['sets',1],['starts',m.started?1:0],['full',m.full?1:0],['rallies',m.rallies],['of',R.rallies],['srv',m.srv],['srvW',m.srvW],['pm',m.pm],['won',m.won]]){a[k]+=v;bg[k]+=v}
      a.ins+=m.ins;a.rots+=m.rots}}));
  return out}
const pmTag=v=>`<span class="pm ${v>0?'up':v<0?'dn':''}">${v>0?'+':''}${v}</span>`;
function viewRoster(){
  if(S.ui.player&&P(S.ui.player))return viewPlayer(P(S.ui.player));

  const head=`<div class="row wrap" style="margin-bottom:10px;gap:8px"><h2 style="margin:0">${esc(S.team.name)}</h2>${canEdit()?'<button class="btn sm ghost" data-act="teamName">Rename</button>':''}
    ${S.teams.length>1?`<button class="btn sm ghost" data-act="tab" data-tab="settings">Switch team</button>`:''}</div>
    <div class="seg" style="margin-bottom:12px;max-width:420px"><button class="${rv==='players'?'on':''}" data-act="rview" data-v="players">Players</button><button class="${rv==='stats'?'on':''}" data-act="rview" data-v="stats">Team stats</button></div>`;

    ${canEdit()?`<button class="btn pri wide" style="margin-top:12px" data-act="editPlayer">+ Add player</button>
    ${ps.length?'':'<button class="btn ghost wide" style="margin-top:8px" data-act="sample">Load a sample team</button>'}`:''}
  </div>`;
}
const RCOLS=[['num','#'],['name','Player'],['games','Game days'],['sets','Sets'],['starts','Starts'],['full','Full sets'],['rallies','Points played'],['srv','Serves'],['srvW','Points on serve'],['srvP','Serve win %'],['pm','+/-'],['wonP','Rallies won']];
function rosterStats(ps,st){
  const val=(p,k)=>{const a=st[p.id]||{};if(k==='num')return +p.num||999;if(k==='name')return p.name;if(k==='srvP')return a.srv?a.srvW/a.srv:-1;if(k==='wonP')return a.rallies?a.won/a.rallies:-1;return a[k]||0};
  const k=S.ui.rsort||'num';const asc=k==='num'||k==='name';
  const rows=ps.slice().sort((x,y)=>{const a=val(x,k),b=val(y,k);return (typeof a==='string'?a.localeCompare(b):a-b)*(asc?1:-1)});
  if(!Object.keys(st).length)return `<div class="card empty"><h2>No stats yet</h2><p>Stats come from the scorecard. Once you keep score in a game day, every player's numbers add up here.</p></div>`;

  ${rows.map(p=>{const a=st[p.id];if(!a)return `<tr data-act="openPlayer" data-id="${p.id}" style="cursor:pointer"><td><span class="num" style="min-width:30px;height:30px;font-size:16px">${esc(p.num)}</span></td><td style="font-weight:600">${esc(p.name)}</td><td colspan="10" class="muted">Hasn't played yet</td></tr>`;
    return `<tr data-act="openPlayer" data-id="${p.id}" style="cursor:pointer"><td><span class="num" style="min-width:30px;height:30px;font-size:16px">${esc(p.num)}</span></td><td style="font-weight:600">${esc(p.name)}</td>
    <td class="c">${a.games}</td><td class="c">${a.sets}</td><td class="c">${a.starts}</td><td class="c">${a.full}</td><td class="c">${a.rallies}<div class="sm">${pct(a.rallies,a.of)} of sets</div></td><td class="c">${a.srv}</td><td class="c">${a.srvW}</td><td class="c">${pct(a.srvW,a.srv)}</td><td class="c">${pmTag(a.pm)}</td><td class="c">${pct(a.won,a.rallies)}<div class="sm">${a.won}/${a.rallies}</div></td></tr>`}).join('')}
  </tbody></table></div></div>`;
}

function afterDrills(){
  if(DR.mode==='view'){DR.t=0;DR.playing=false;drawPose()}
  if(DR.mode==='edit')bindEditor();
}
function drawPose(){
  const d=findDrill(DR.id);const svg=$('#dSvg');if(!d||!svg)return;
  const p=poseAt(d,DR.t);
  svg.querySelectorAll('#dToks .tok').forEach(g=>{const q=p.pos[g.dataset.tok];if(q)g.setAttribute('transform',`translate(${q[0].toFixed(3)} ${q[1].toFixed(3)})`)});
  const bg=svg.querySelector('[data-tok="ball"]');bg.setAttribute('transform',`translate(${p.ball[0].toFixed(3)} ${p.ball[1].toFixed(3)})`);bg.style.opacity=p.hide?0:1;
  const inner=bg.children[0];if(inner){const sh=inner.children[0],bl=inner.children[1];const s=1+p.lift*.18;bl.setAttribute('transform',`translate(0 ${(-p.lift).toFixed(3)}) scale(${s.toFixed(3)})`);sh.setAttribute('opacity',String(Math.max(.25,1-p.lift*.25)))}
  const n=d.frames.length;const atFrame=Math.abs(DR.t-Math.round(DR.t))<.001;const k=atFrame?Math.round(DR.t):Math.floor(DR.t)+1;
  const show=Math.min(k,n-1);
  const arrowSeg=atFrame?(show<n-1?show:-1):Math.floor(DR.t);
  const ar=svg.querySelector('#dArrows');const key=String(arrowSeg);if(ar.dataset.k!==key){ar.dataset.k=key;ar.innerHTML=arrowSeg>=0?segArrows(d,arrowSeg):''}
  $('#dStep').textContent=show?'STEP '+show+'/'+(n-1):'START';$('#dNote').textContent=d.frames[show].note||(show?'Step '+show:'Starting spots.');
  $('#dPlayBtn').textContent=DR.playing?'❚❚ Pause':(DR.t>=n-1?'↻ Replay':'▶ Play');
}
const STEP_MS=1300,HOLD_MS=550;
function tick(ts){
  const d=findDrill(DR.id);if(!d||!DR.playing||!$('#dSvg')){DR.raf=0;return}
  const dt=Math.min(64,ts-(DR.last||ts));DR.last=ts;const n=d.frames.length;
  DR.hold=(DR.hold||0);
  if(DR.hold>0){DR.hold-=dt*DR.speed}
  else{const prev=Math.floor(DR.t);DR.t+=dt*DR.speed/STEP_MS;if(Math.floor(DR.t)>prev){DR.t=Math.floor(DR.t);DR.hold=HOLD_MS}}
  if(DR.t>=n-1){DR.t=n-1;drawPose();if(DR.loop){DR.hold=HOLD_MS*2.5;DR.t=n-1;DR.wrap=true}else{DR.playing=false;drawPose();DR.raf=0;return}}
  if(DR.wrap&&DR.hold<=0){DR.wrap=false;DR.t=0;DR.hold=HOLD_MS}
  drawPose();DR.raf=requestAnimationFrame(tick);
}
function playDrill(){const d=findDrill(DR.id);if(!d)return;if(DR.t>=d.frames.length-1)DR.t=0;DR.playing=true;DR.last=0;DR.hold=DR.t===0?HOLD_MS*.6:0;DR.wrap=false;if(!DR.raf)DR.raf=requestAnimationFrame(tick);drawPose()}
function stopDrill(){DR.playing=false;if(DR.raf){cancelAnimationFrame(DR.raf);DR.raf=0}}

function bindEditor(){
  const svg=$('#edSvg');if(!svg)return;const d=DR.ed;const v=DV[d.view];
  const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return [Math.max(v.x+.4,Math.min(v.x+v.w-.4,q.x)),Math.max(v.y+.4,Math.min(v.y+v.h-.4,q.y))]};
  let drag=null;
  svg.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-tok]');if(!g)return;e.preventDefault();svg.setPointerCapture(e.pointerId);drag={id:g.dataset.tok,g,x0:e.clientX,y0:e.clientY,moved:false}});
  svg.addEventListener('pointermove',e=>{if(!drag)return;if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>4)drag.moved=true;if(!drag.moved)return;const q=pt(e);
    drag.g.setAttribute('transform',`translate(${q[0].toFixed(3)} ${q[1].toFixed(3)})`);drag.q=q});
  const end=e=>{if(!drag)return;keepEd();const fr=d.frames[DR.f];const r=(x)=>Math.round(x*20)/20;
    if(drag.moved&&drag.q){const q=[r(drag.q[0]),r(drag.q[1])];if(drag.id==='ball')fr.ball=q;else fr.pos[drag.id]=q;DR.sel=drag.id}
    else DR.sel=DR.sel===drag.id?null:drag.id;
    drag=null;render()};
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
}
function keepEd(){const d=DR.ed;if(!d)return;const v=id=>{const el=$('#'+id);return el?el.value:null};
  const n=v('edNote');if(n!=null)d.frames[DR.f].note=n.trim();const nm=v('edName');if(nm!=null)d.name=nm.trim()||'My drill';
  const fc=v('edFocus');if(fc)d.focus=fc;const ds=v('edDesc');if(ds!=null)d.desc=ds.trim();
  const le=$('#edLabel');if(le){const t=d.tokens.find(x=>x.id===le.dataset.id);if(t&&le.value.trim())t.label=le.value.trim()}}

  // settings
  setLevel(d,el){const L=LEVELS[el.value];S.settings.level=el.value;if(L&&L.sets){['sets','pts','decider','subs','tos'].forEach(k=>S.settings[k]=L[k])}commit()},
  setNum(d,el){S.settings[d.key]=+el.value;const L=LEVELS[S.settings.level];if(L&&L.sets&&L[d.key]!==+el.value)S.settings.level='custom';commit()},
  measure(d){S.settings.measure=d.v;commit()},
  async saveTo(d){if(d.v===saveTo)return;if(saveTo==='account'&&saveTimer)await pushState();saveTo=d.v;try{localStorage.setItem(MODE_KEY,saveTo)}catch(e){}
    if(saveTo==='device'){S=norm(lsGet(DEVICE_KEY));if(CH){try{WA.client.removeChannel(CH)}catch(e){}CH=null}toast('Now saving on this device');render()}
    else if(ME){await startAccount()}else render()},
  async signIn(){const u=$('#siU').value.trim(),p=$('#siP').value;const er=$('#siErr');if(!u||!p){er.textContent='Enter your username and password.';return}
    er.textContent='Signing in…';try{await WA.signIn(u,p)}catch(e){er.textContent=e.message||"Couldn't sign in.";$('#siP').value=''}},
  async signOut(){if(saveTimer)await pushState();if(saving)await saving.catch(()=>{});await WA.signOut()},
  sample(){
    const names=[['Ava Thompson',2,'S'],['Maya Patel',5,'OH'],['Chloe Ramirez',7,'MH'],['Lily Chen',9,'OPP'],['Sophia Brooks',11,'OH'],['Grace Kim',12,'MH'],['Emma Lewis',3,'L'],['Zoe Carter',14,'DS'],['Harper Wells',16,'OH'],['Nora Diaz',18,'MH']];
    S.team.name=S.team.name==='Our Team'?'Lady Hawks':S.team.name;
    names.forEach(([n,num,pos])=>{if(!S.players.some(p=>p.num===String(num)))S.players.push({id:uid(),name:n,num:String(num),pos})});
    if(!S.games.length){const by=n=>S.players.find(p=>p.num===String(n)).id;const g={id:uid(),date:today(),opp:'Eagles',sets:Array.from({length:Math.max(3,S.settings.sets)},newSet)};
      g.sets[0].lineup=[by(2),by(5),by(7),by(9),by(11),by(12)];g.sets[0].libero=by(3);
      g.sets[1].lineup=[by(2),by(16),by(18),by(9),by(5),by(7)];g.sets[1].libero=by(3);g.sets[1].first='them';
      g.sets[2].lineup=[by(2),by(11),by(12),by(9),by(16),by(18)];g.sets[2].libero=by(3);
      S.games.push(g);S.cur=g.id}
    S.ui.tab='game';S.ui.view='plan';toast('Sample team loaded');commit()},
  // drills
  dfocus(d){S.ui.dfocus=d.v;commit()},
  openDrill(d){DR.mode='view';DR.id=d.id;DR.t=0;stopDrill();render();scrollTo(0,0);setTimeout(playDrill,350)},
  drillBack(){stopDrill();DR.mode='list';render()},
  dPlay(){const d=findDrill(DR.id);if(DR.playing){stopDrill();drawPose()}else playDrill()},
  dNext(){const d=findDrill(DR.id);stopDrill();DR.t=Math.min(d.frames.length-1,Math.floor(DR.t+1e-6)+1);
    // animate just this step
    const from=DR.t-1;const t0=performance.now();const step=ts=>{const u=Math.min(1,(ts-t0)*DR.speed/STEP_MS);DR.t=from+u;drawPose();if(u<1&&!DR.playing)DR.raf=requestAnimationFrame(step);else DR.raf=0};DR.raf=requestAnimationFrame(step)},
  dPrev(){stopDrill();DR.t=Math.max(0,Math.ceil(DR.t-1e-6)-1);drawPose()},
  dSpeed(){DR.speed=DR.speed===1?.5:DR.speed===.5?2:1;$('#dSpeedBtn').textContent=DR.speed+'x'},
  newDrill(){DR.ed={id:'my'+uid(),name:'My drill',focus:'Passing',desc:'',view:'half',tokens:[{id:'t1',kind:'p',label:'1'},{id:'t2',kind:'c',label:'C'}],frames:[{pos:{t1:[4.5,15.5],t2:[4.5,10.6]},ball:[4.8,10.4],h:0,note:''}]};DR.f=0;DR.sel=null;DR.mode='edit';render();scrollTo(0,0)},
  copyDrill(d){stopDrill();const src=findDrill(d.id);const c=clone(src);c.id='my'+uid();delete c.builtin;delete c.cloudId;delete c.received;delete c.from;c.name=src.name+' (mine)';DR.ed=c;DR.f=0;DR.sel=null;DR.mode='edit';render();scrollTo(0,0)},
  editDrill(d){stopDrill();DR.ed=clone(findDrill(d.id));DR.f=0;DR.sel=null;DR.mode='edit';render();scrollTo(0,0)},
  delDrill(d){const dr=findDrill(d.id);sheet(`<h2>Delete this drill?</h2>${dr&&shareCount(dr)?`<p class="muted">It will also disappear for the ${shareCount(dr)} ${shareCount(dr)===1?'person':'people'} you shared it with.</p>`:''}<button class="btn bad wide" data-act="delDrillYes" data-id="${esc(d.id)}">Delete</button>`)},
  async delDrillYes(d){const dr=S.drills.find(x=>x.id===d.id);if(dr&&dr.cloudId&&CLOUD.ok()){try{await CLOUD.delDrill(dr.cloudId)}catch(e){toast(e.message);return}delete MYSHARES[dr.cloudId]}
    S.drills=S.drills.filter(x=>x.id!==d.id);S.favDrills=S.favDrills.filter(x=>x!==d.id);closeSheet();DR.mode='list';commit()},
  edCancel(){DR.ed=null;DR.mode=DR.id&&findDrill(DR.id)?'view':'list';render()},
  edSave(){keepEd();const d=DR.ed;if(!d.tokens.length){toast('Add at least one player first');return}
    if(d.cloudId&&CLOUD.ok())CLOUD.publishDrill(d).then(()=>{if(shareCount(d))toast('Saved. Everyone you shared it with sees the change.')}).catch(()=>toast("Saved here, but couldn't update the shared copy."));const i=S.drills.findIndex(x=>x.id===d.id);if(i>=0)S.drills[i]=d;else S.drills.push(d);
    DR.id=d.id;DR.ed=null;DR.mode='view';toast('Drill saved');commit();setTimeout(playDrill,350)},
  edFrame(d){keepEd();DR.f=+d.i;render()},
  edAddStep(){keepEd();const d=DR.ed;const c=clone(d.frames[DR.f]);c.note='';c.h=1;delete c.jump;d.frames.splice(DR.f+1,0,c);DR.f++;render()},
  edDelStep(){const d=DR.ed;if(DR.f>0){d.frames.splice(DR.f,1);DR.f--;render()}},
  edH(d){keepEd();const fr=DR.ed.frames[DR.f];if(d.v==='j'){fr.jump=1;fr.h=0}else{delete fr.jump;fr.h=+d.v}render()},
  edAdd(d){keepEd();const e=DR.ed;const k=d.k;const n=e.tokens.filter(t=>t.kind===k).length+1;const id='t'+uid();
    const label=k==='p'?String(e.tokens.filter(t=>t.kind==='p').length+1):k==='o'?'X':k==='c'?'C':k==='t'?'T':'';
    const at=e.view==='half'?[4.5+((n%3)-1)*1.4,13.5+Math.floor(n/3)*.9]:[4.5+((n%3)-1)*1.4,13.5];
    e.tokens.push({id,kind:k,label});e.frames.forEach(f=>f.pos[id]=at.slice());DR.sel=id;render()},
  edDelTok(){const e=DR.ed;const id=DR.sel;e.tokens=e.tokens.filter(t=>t.id!==id);e.frames.forEach(f=>delete f.pos[id]);DR.sel=null;render()},
  edView(d){keepEd();DR.ed.view=d.v;render()},
  edPreview(){keepEd();const d=DR.ed;const tmp=clone(d);tmp.id='__preview';PREVIEW=tmp;sheet(`<h2>${esc(d.name)}</h2><div class="dfield">${drillSVG(tmp,{id:'dSvg'})}</div><div class="dnote"><span class="sn" id="dStep">START</span><span id="dNote"></span></div><div class="dctl"><button class="btn pri play" data-act="dPlay" id="dPlayBtn">▶ Play</button><button class="btn ghost sm" data-act="dSpeed" id="dSpeedBtn">${DR.speed}x</button></div>`);
    const back=DR.id;DR.id='__preview';DR.t=0;DR.prevId=back;playDrill();
    const sc=$('#scrim');const obs=new MutationObserver(()=>{if(!document.body.contains(sc)){stopDrill();DR.id=DR.prevId;obs.disconnect()}});obs.observe(document.body,{childList:true})}
};

const EDIT_ACTS=new Set(['addSet','newGame','saveGame','editGame','saveEditGame','delGame','delGameYes','pickSpot','setSpot','setLibero','copySet','clearLineup','teamName','teamSave','editPlayer','savePlayer','delPlayer','sample','setLevel','setNum','measure','playAll']);
const SCORE_ACTS=new Set(['startSet','pt','rotate','undo','timeout','endSet','endSetYes','reopen','doSub','oppSub','oppSubSave','first','tapPlayer']);
function allowed(act){if(EDIT_ACTS.has(act)&&!canEdit()){toast(`Only coaches can change that. You're ${roleOf(S.team)==='viewer'?'a viewer':'the scorekeeper'} on ${S.team.name}.`);return false}
  if(SCORE_ACTS.has(act)&&!canScore()){toast(`You can watch ${S.team.name}, but not keep score.`);return false}return true}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.dataset.change)return;if(el.closest('#edSvg'))return;const f=A[el.dataset.act];if(f){e.preventDefault();if(!allowed(el.dataset.act))return;f(el.dataset,el,e)}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.change&&A[el.dataset.act]){if(!allowed(el.dataset.act)){render();return}A[el.dataset.act](el.dataset,el,e)}
  if(el.dataset.opp!=null){if(!canScore()){render();return}const s=curSet();s.opp[+el.dataset.opp]=el.value.trim();save()}
  if(DR.mode==='edit'&&['edLabel'].includes(el.id)){keepEd();render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Enter'&&e.target.tagName==='INPUT'){if(e.target.id==='siP'||e.target.id==='siU'){A.signIn();return}const b=document.querySelector('#scrim .btn.pri');if(b)b.click()}});

render();
if(WA){WA.ready.then(async()=>{let last=WA.me&&WA.me.id;await startAccount();
  WA.onChange(async me=>{const id=me&&me.id;if(id===last)return;last=id;if(!me){ME=null;if(CH){try{WA.client.removeChannel(CH)}catch(e){}CH=null}if(saveTo==='account'){S=norm(lsGet(DEVICE_KEY))}render();return}await startAccount();if(saveTo==='account')toast('Signed in. Your notebook is saved to your account.')})}).catch(()=>{})}
window.__vb={get S(){return S},replay,DR,get ME(){return ME}};
})();
</script>
<script src="../shared/analytics.js" defer></script>
</body>
