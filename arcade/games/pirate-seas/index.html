<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}</style>
<title>Pirate Seas Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pirata+One&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* Layout: full-bleed game canvas; HUD pinned to corners (menu+coins TL, prototype panel L, status TC, compass TR, actions BL, joystick BR) */
:root{
  --deep:#0f4a5c; --glass:rgba(8,36,48,.55); --glass-line:rgba(255,255,255,.22);
  --text:#ffffff; --muted:#bfe0e8; --sun:#ffc93c; --coral:#ff6b5b; --teal:#16a88a; --friend:#7fe3c4;
  --panel:#0e3646; --panel-2:#0a2a37; --ink:#3b2410; --paper:#f1dfb3;
  --font-ui:"Fredoka",ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif;
  --font-map:"Pirata One","Georgia",serif; --font-fell:"IM Fell English","Georgia",serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--deep);color:var(--text);font-family:var(--font-ui)}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--font-ui)}
.hud{position:fixed;z-index:5}
.glass{background:var(--glass);border:1.5px solid var(--glass-line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

.topleft{top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));display:flex;align-items:center;gap:14px}
.burger{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0}
.burger span{display:block;width:20px;height:3px;border-radius:3px;background:#fff;box-shadow:0 -6px 0 #fff,0 6px 0 #fff}
.burger:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.coins{display:flex;align-items:center;gap:6px}
.coins svg{width:36px;height:36px}
.coins b{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff;
  text-shadow:0 2px 0 #5a3a0a,2px 0 0 #5a3a0a,-2px 0 0 #5a3a0a,0 -2px 0 #5a3a0a,1.5px 1.5px 0 #5a3a0a,-1.5px 1.5px 0 #5a3a0a,1.5px -1.5px 0 #5a3a0a,-1.5px -1.5px 0 #5a3a0a}
.coins b.pop{animation:pop .4s ease-out}
@keyframes pop{40%{transform:scale(1.35)}}

.status{top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
  padding:8px 16px 8px 12px;border-radius:999px;font-weight:600;font-size:16px;white-space:nowrap;max-width:calc(100% - 330px)}
@media (max-width:520px){.status{max-width:none;top:calc(170px + env(safe-area-inset-top,0px));font-size:14px;padding:6px 12px 6px 10px}.hull{top:calc(210px + env(safe-area-inset-top,0px))!important}.toast{top:calc(236px + env(safe-area-inset-top,0px))!important}}
.status svg{width:22px;height:22px;color:var(--sun);flex:none}
.status #statusText{overflow:hidden;text-overflow:ellipsis}
.meter{width:56px;height:8px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden;flex:none}
.meter i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#22c4a0,var(--sun));transition:width .15s}
.hull{top:calc(60px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;
  font-size:12px;font-weight:700;letter-spacing:.06em;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.hull .bar{width:110px;height:8px;border-radius:8px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid rgba(255,255,255,.35)}
.hull .bar i{display:block;height:100%;background:#22c4a0;transition:width .2s,background .2s}

.compass{top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));
  width:140px;height:140px;border-radius:50%;cursor:pointer;touch-action:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.compass:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.compass-hint{top:calc(156px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));width:140px;
  display:flex;justify-content:center;transition:opacity .6s;pointer-events:none}
.compass-hint span{padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600}

.actions{left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:236px;height:236px;transform-origin:0 100%}
.actions::before{content:"";position:absolute;inset:26px;border-radius:50%;background:radial-gradient(circle,rgba(8,36,48,.12) 40%,rgba(8,36,48,.34));border:1.5px solid rgba(255,255,255,.14)}
.actions .act{position:absolute;width:62px;height:62px}
.actions .act .disk{width:44px;height:44px}.actions .act .disk svg{width:23px;height:23px}
.actions .act.fire{width:90px;height:90px;left:73px;top:73px}.actions .act.fire .disk{width:64px;height:64px}.actions .act.fire .disk svg{width:32px;height:32px}
.actions .act.n{left:87px;top:2px}.actions .act.e{left:172px;top:87px}.actions .act.s{left:87px;top:172px}
.wslot{position:absolute;left:2px;top:87px;width:62px;height:62px;border-radius:50%;border:2px dashed rgba(255,255,255,.2);background:rgba(8,36,48,.18)}
.actions .act.n .lbl{top:auto;bottom:calc(100% + 2px)}
.actions .act.e .lbl{top:50%;left:calc(100% + 6px);transform:translateY(-50%)}
.actions .act.fire .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.act.bag small{position:absolute;right:-8px;bottom:-4px;background:#123b4a;color:#fff;font:700 11px/1 Fredoka,system-ui,sans-serif;padding:3px 6px;border-radius:999px;border:1.5px solid rgba(255,255,255,.35);white-space:nowrap;pointer-events:none}
.act.bag.full small{background:#c8322a;border-color:#ffb3a8}
.act.bag .disk svg{width:27px!important;height:27px!important}
.act{--c:#16a88a;--p:1;position:relative;width:76px;height:76px;border-radius:50%;padding:0;cursor:pointer;display:grid;place-items:center;
  background:var(--glass);border:1.5px solid var(--glass-line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);touch-action:none;transition:opacity .2s}
.act::before{content:"";position:absolute;inset:7px;border-radius:50%;border:2px dashed rgba(255,255,255,.25)}
.act::after{content:"";position:absolute;inset:-1.5px;border-radius:50%;pointer-events:none;
  background:conic-gradient(var(--c) calc(var(--p)*360deg),transparent 0);
  -webkit-mask:radial-gradient(circle closest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(circle closest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));opacity:.9}
.act .disk{position:relative;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--c);
  background:radial-gradient(circle at 38% 32%,#fff,#e6f4f7 45%,#b9d9e2);box-shadow:0 6px 12px rgba(0,0,0,.35),inset 0 -3px 0 rgba(0,0,0,.12);transition:transform .08s}
.act .disk svg{width:27px;height:27px}
.act .lbl{position:absolute;top:calc(100% + 3px);left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;white-space:nowrap;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.act.pressed .disk{transform:scale(.88)}
.act:disabled{opacity:.42;cursor:default}
.act:disabled::after{opacity:0}
.act:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.act.fire{--c:#ef4d3c}
.act.dig{--c:#d18a00}
.act.talk{--c:#1b8f72}
.act.hot .disk{animation:wiggle 1.2s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-10deg)}20%{transform:rotate(10deg)}30%{transform:rotate(0)}}

.joy{right:calc(48px + env(safe-area-inset-right,0px));bottom:calc(52px + env(safe-area-inset-bottom,0px));
  width:136px;height:136px;border-radius:50%;touch-action:none}
.joy::before{content:"";position:absolute;inset:14px;border-radius:50%;border:2px dashed rgba(255,255,255,.25)}
.joy .chev{position:absolute;width:10px;height:10px;border-top:3px solid rgba(255,255,255,.55);border-left:3px solid rgba(255,255,255,.55);border-radius:2px}
.knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 38% 32%,#fff,#e6f4f7 45%,#b9d9e2);box-shadow:0 6px 12px rgba(0,0,0,.35),inset 0 -3px 0 rgba(0,0,0,.12)}
.knob::after{content:"";position:absolute;inset:16px;border-radius:50%;border:3px solid rgba(15,74,92,.18)}
body.joy-left .joy{right:auto;left:calc(48px + env(safe-area-inset-left,0px))}
body.joy-left .actions{left:auto;right:calc(14px + env(safe-area-inset-right,0px));transform-origin:100% 100%}
.joy.floating{right:auto!important;bottom:auto!important;pointer-events:none}

.proto{top:calc(76px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));width:212px;border-radius:20px;padding:6px;max-height:calc(100% - 440px);min-height:46px;overflow-y:auto}
.proto-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border:none;background:none;color:#fff;cursor:pointer;
  font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.proto-head .tag{font-size:10px;padding:2px 7px;border-radius:999px;background:var(--sun);color:#3d2604;letter-spacing:.08em}
.proto-head svg{width:16px;height:16px;transition:transform .2s}
.proto.closed .proto-head svg{transform:rotate(-90deg)}
.proto.closed .proto-body{display:none}
.proto-head:focus-visible{outline:3px solid var(--sun);border-radius:12px}
.proto-body{padding:0 4px 6px}
.proto h4{margin:6px 2px 6px;font-size:12px;font-weight:600;color:var(--muted)}
.picks{display:grid;gap:6px}
.picks.p4{grid-template-columns:repeat(4,1fr)}
.picks.p3{grid-template-columns:repeat(3,1fr)}
.pick{min-width:0;border-radius:12px;background:rgba(255,255,255,.08);border:2px solid transparent;padding:2px 0 4px;cursor:pointer;color:#fff;
  font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1}
.pick canvas{width:100%;height:auto;display:block}
.pick small{font-size:9.5px;color:var(--muted);font-weight:500}
.pick[aria-pressed="true"]{border-color:var(--sun);background:rgba(255,201,60,.16)}
.pick:focus-visible{outline:3px solid #fff;outline-offset:1px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.tool{padding:8px 4px;border-radius:12px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font-size:11.5px;font-weight:600;cursor:pointer}
.tool.wide{grid-column:1/-1;background:rgba(255,201,60,.16);border-color:rgba(255,201,60,.5)}
.tool:focus-visible{outline:3px solid var(--sun)}

.toast{top:calc(84px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:999px;
  font-size:16px;font-weight:600;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;transition:opacity .4s;pointer-events:none}
.keys{bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:12.5px;font-weight:500;
  color:rgba(255,255,255,.8);text-shadow:0 1px 2px rgba(0,0,0,.7);white-space:nowrap}
@media (pointer:coarse){.keys{display:none}}
body.no-hints .keys{display:none}
.blackout{position:fixed;inset:0;z-index:40;background:#000;opacity:0;pointer-events:none;transition:opacity .7s ease}
.blackout.on{opacity:1}

.map-overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(6,18,24,.62);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.map-wrap{position:relative;animation:unroll .35s ease-out}
.map-wrap canvas{display:block;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55))}
.map-close{position:absolute;top:7%;right:7%}
@keyframes unroll{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}

.note-back{position:fixed;inset:0;z-index:32;display:grid;place-items:center;background:rgba(3,18,26,.55);
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.note-card{position:relative;width:min(420px,100%);padding:26px 26px 22px;border-radius:6px 14px 8px 16px;color:var(--ink);
  background:radial-gradient(ellipse 60% 40% at 85% 15%,rgba(150,95,30,.18),transparent 70%),radial-gradient(ellipse 50% 35% at 10% 90%,rgba(120,70,20,.16),transparent 70%),var(--paper);
  box-shadow:0 24px 50px rgba(0,0,0,.5),inset 0 0 40px rgba(120,70,20,.35);transform:rotate(-1deg);animation:rise .3s cubic-bezier(.2,1.3,.4,1)}
.note-eyebrow{font-family:var(--font-ui);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8a5a1c}
.note-card h3{margin:4px 0 10px;font-family:var(--font-map);font-weight:400;font-size:32px;line-height:1.05;text-wrap:balance}
.note-card p{margin:0;font-family:var(--font-fell);font-size:19px;line-height:1.45}
.note-reward{margin-top:14px;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#3b2410;color:#ffd77a;font-family:var(--font-ui);font-size:14px;font-weight:600}
.note-btn{display:block;margin:18px 0 0 auto;padding:10px 20px;border-radius:999px;border:none;background:#0e3646;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.note-btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* conversations */
.talk-back{position:fixed;inset:0;z-index:31;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(transparent 30%,rgba(3,18,26,.6));
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.talk{width:min(540px,100%);max-height:calc(100% - 40px);overflow-y:auto;border-radius:26px;padding:16px 18px 18px;background:linear-gradient(180deg,var(--panel),var(--panel-2));
  border:1.5px solid rgba(255,255,255,.14);box-shadow:0 20px 50px rgba(0,0,0,.5);animation:rise .25s cubic-bezier(.2,1.3,.4,1)}
.talk-head{display:flex;gap:12px;align-items:center}
.talk-head canvas{width:64px;height:64px;border-radius:50%;background:#2a6a7a;flex:none;border:2px solid rgba(255,255,255,.25)}
.talk-name{font-size:20px;font-weight:700}
.talk-role{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--friend)}
.talk-role::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--friend)}
.talk-text{font-size:17px;line-height:1.45;margin:12px 2px 14px;min-height:2.9em;cursor:pointer}
.talk-opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:11px 14px;border-radius:14px;border:1.5px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;font-size:15px;font-weight:600;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;gap:10px}
.opt small{color:var(--sun);font-weight:700;font-size:13px;white-space:nowrap}
.opt:disabled{opacity:.45;cursor:default}
.opt.primary{background:var(--sun);color:#3d2604;border-color:transparent}
.opt.primary small{color:#3d2604}
.opt:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.modal-back{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(3,18,26,.55);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{width:min(560px,100%);max-height:min(640px,calc(100% - 24px));display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1.5px solid rgba(255,255,255,.14);border-radius:28px;
  box-shadow:0 24px 60px rgba(0,0,0,.5);animation:rise .28s cubic-bezier(.2,1.3,.4,1)}
@keyframes rise{from{transform:translateY(24px) scale(.96);opacity:0}}
.modal header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 12px}
.modal h2{margin:0;font-size:24px;font-weight:700}
.modal h2 small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}
.xbtn{width:40px;height:40px;flex:none;border-radius:50%;border:none;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.xbtn svg{width:18px;height:18px}
.xbtn:focus-visible,.tab:focus-visible,.ghost:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.map-close{background:rgba(59,36,16,.85);color:#f3e3b5}
.tabs{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;border:none;cursor:pointer;
  background:rgba(255,255,255,.08);color:var(--muted);font-size:15px;font-weight:600}
.tab svg{width:17px;height:17px}
.tab[aria-selected="true"]{background:var(--sun);color:#3d2604}
.panel{padding:6px 20px 22px;overflow-y:auto;min-height:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{padding:12px;border-radius:18px;background:rgba(255,255,255,.07);text-align:center}
.stat b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted);font-weight:500}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.06)}
.row .ic{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.1);color:var(--sun)}
.row .ic svg{width:22px;height:22px}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15.5px;font-weight:600}
.row .tx span{font-size:13px;color:var(--muted)}
.chip{flex:none;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.12);color:var(--muted)}
.chip.good{background:#22c4a0;color:#053b2f}
.chip.now{background:var(--sun);color:#3d2604}
.chip.bad{background:#ff6b5b;color:#3a0c06}
.pieces{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.piece{aspect-ratio:4/3;max-width:100%;border-radius:14px;border:2px dashed rgba(255,255,255,.25);display:grid;place-items:center;color:var(--muted);font-size:13px;font-weight:600;background:rgba(255,255,255,.04)}
.piece.got{border-style:solid;border-color:var(--sun);background:rgba(255,201,60,.14);color:#fff}
.sub{margin:18px 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.note{font-size:14px;color:var(--muted);line-height:1.5;margin:0}
.setting{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px;border-radius:16px;background:rgba(255,255,255,.06);margin-bottom:8px}
.setting b{display:block;font-size:15.5px;font-weight:600}
.setting span{font-size:13px;color:var(--muted)}
.switch{position:relative;flex:none;width:52px;height:30px}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,.2);transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked+i{background:#22c4a0}
.switch input:checked+i::after{transform:translateX(22px)}
.switch input:focus-visible+i{outline:3px solid var(--sun);outline-offset:2px}
.ghost{margin-top:8px;width:100%;padding:12px;border-radius:16px;border:1.5px solid rgba(255,255,255,.2);background:transparent;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
@media (max-width:420px){.stat b{font-size:22px}.actions{transform:scale(.86)}.joy{width:124px;height:124px}.proto{width:196px}}

  function loop(type,f,q,vol){const s=ac.createBufferSource();s.buffer=noise;s.loop=true;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=ac.createGain();g.gain.value=vol;s.connect(fl);fl.connect(g);g.connect(master);s.start(0,Math.random()*1.5);return{gain:g.gain,filter:fl}}

/* ---------- kraken ---------- */
function spawnKraken(near){
  const f=focus();
  for(let i=0;i<300;i++){let x,y;
    if(near){const a=Math.random()*TAU,d=420+Math.random()*120;x=f.x+Math.cos(a)*d;y=f.y+Math.sin(a)*d}
    else{x=200+Math.random()*(WW-400);y=200+Math.random()*(WH-400)}
    if(x<160||y<160||x>WW-160||y>WH-160||Math.hypot(x-C0.cx,y-C0.cy)<1300||Math.hypot(x-WRECK.cx,y-WRECK.cy)<REEF_ZONE+200)continue;
    if(shoreDist(x,y)<(near?160:320)||pierZone(x,y,200))continue;
    if(!near&&Math.hypot(x-f.x,y-f.y)<700)continue;
    return{x,y,hp:120,max:120,state:'idle',t:Math.random()*10,atk:0,hitDone:false,atkAng:0,atkLen:60,cd:1.5,flash:0,sinkT:0,aggro:false}}
  return null}
function krakenTargets(){const c=[];if(S.mode==='ship'&&!S.ship.sinking)c.push(S.ship);else if(S.mode==='foot'&&S.player.swim)c.push(S.player);for(const n of S.navy)if(!n.sinking)c.push(n);return c}

function krakenStrike(k,tgt){
  const sx=k.x+Math.cos(k.atkAng)*Math.min(k.atkLen,190),sy=k.y+Math.sin(k.atkAng)*Math.min(k.atkLen,190);
  splash(sx,sy,14);SFX.splash(.3);
  if(!tgt||Math.hypot(tgt.x-k.x,tgt.y-k.y)>220)return;
  if(tgt.type==='navy'){tgt.hp-=20;tgt.hurt=.4;floatText(tgt.x,tgt.y-50,'-20','#ff6b5b');if(tgt.hp<=0&&!tgt.sinking){tgt.hp=0;tgt.sinking=true;tgt.sinkT=0;tgt.tilt=1;if(inView(tgt.x,tgt.y,300))toast('The Kraken drags a Navy ship under!')}return}
  if(tgt===S.ship){damageShip(20);if(!S.ship.sinking)toast('The Kraken strikes the hull!')}
  else{if(settings.shake&&!reduceMotion)S.shake=8;const d=Math.hypot(tgt.x-k.x,tgt.y-k.y)||1;
    tgt.x=clamp(tgt.x+(tgt.x-k.x)/d*90,70,WW-70);tgt.y=clamp(tgt.y+(tgt.y-k.y)/d*90,70,WH-70);tgt.hurt=.5;toast('The Kraken swats you away!')}
}
function updateKraken(dt){
  if(!S.kraken){S.krakenTimer-=dt;if(S.krakenTimer<=0){S.kraken=spawnKraken(false);S.krakenTimer=5}return}
  const k=S.kraken;k.t+=dt;k.flash=Math.max(0,k.flash-dt*4);
  if(k.state==='sinking'){k.sinkT+=dt;if(Math.random()<.5)parts.push({t:'bubble',x:k.x+(Math.random()-.5)*50,y:k.y+(Math.random()-.5)*20,vx:0,vy:-12,life:.9,max:.9});
    if(k.sinkT>=2.6){S.chests.push({x:k.x,y:k.y,t:0,value:250,items:[pick(['idol','crown'])],from:'Kraken'});S.kraken=null;S.krakenTimer=45;toast('Treasure floats to the surface!')}return}

  k.aggro=d<420&&(tgt===S.ship||tgt===S.player||krakenTargets().some(c=>(c===S.ship||c===S.player)&&Math.hypot(c.x-k.x,c.y-k.y)<420));
  if(k.aggro){
    if(d>140&&k.atk===0){const nx=k.x+(tgt.x-k.x)/d*40*dt,ny=k.y+(tgt.y-k.y)/d*40*dt;if(shoreDist(nx,ny)>110&&!pierZone(nx,ny,80)){k.x=nx;k.y=ny}}
    k.cd-=dt;

const SHARK_N=16;let sharkWarnT=0,deepT=0;
function spawnShark(near){const f=focus();for(let i=0;i<300;i++){let x,y;
    if(near){const a=Math.random()*TAU,d=650+Math.random()*200;x=f.x+Math.cos(a)*d;y=f.y+Math.sin(a)*d}else{x=300+Math.random()*(WW-600);y=300+Math.random()*(WH-600)}

function updateSharks(dt){const p=S.player,sw=S.mode==='foot'&&p.swim,psd=sw?shoreDist(p.x,p.y):0;sharkWarnT-=dt;
  // swimming far from land draws a shark in
  if(sw&&psd>420){deepT+=dt;if(deepT>5&&!S.sharks.some(k=>!k.dead&&Math.hypot(k.x-p.x,k.y-p.y)<1000)){let far=null,fd=0;for(const k of S.sharks){if(k.dead)continue;const d=Math.hypot(k.x-p.x,k.y-p.y);if(d>fd){fd=d;far=k}}const n=spawnShark(true);if(far&&n)Object.assign(far,n);deepT=0}}else deepT=0;
  for(const k of S.sharks){k.t+=dt;k.cd-=dt;k.hurt=Math.max(0,k.hurt-dt);k.flee=Math.max(0,k.flee-dt);

    const d=Math.hypot(p.x-k.x,p.y-k.y);let want,spd=55;
    if(k.flee>0){want=Math.atan2(k.y-p.y,k.x-p.x);spd=170;k.state='flee'}
    else if(sw&&psd>120&&d<(psd>260?950:400)){if(k.state!=='hunt'&&sharkWarnT<=0){toast('Shark! Swim for shallow water!');sharkWarnT=8}k.state='hunt';want=Math.atan2(p.y-k.y,p.x-k.x)+Math.sin(k.t*3)*.25*(d>90?1:0);spd=d<140?160:d<400?120:95;
      if(d<24&&k.cd<=0){k.cd=1.2;damagePlayer(14,'A shark dragged your bag to the bottom.');splash(p.x,p.y,12);SFX.splash(.35);k.flee=.8}}
    else{k.state='cruise';if(!k.wp||Math.hypot(k.wp.x-k.x,k.wp.y-k.y)<80)k.wp=sharkWp(k);want=Math.atan2(k.wp.y-k.y,k.wp.x-k.x)}
    const ax=k.x+Math.cos(k.h)*70,ay=k.y+Math.sin(k.h)*70;if(shoreDist(ax,ay)<110||nearReef(ax,ay)&&reefHit(ax,ay,30)){const I=islandAt(k.x,k.y).I;want=Math.atan2(k.y-I.cy,k.x-I.cx);if(k.state==='hunt')spd=40}
    const dH=Math.atan2(Math.sin(want-k.h),Math.cos(want-k.h));k.h+=clamp(dH,-2.6*dt,2.6*dt);k.v+=(spd-k.v)*Math.min(1,dt*2);

    if(p.kind==='pet'){g.fillStyle='rgba(255,255,255,.08)';g.beginPath();g.ellipse(44,72,24,6,0,0,TAU);g.fill();
      if(!p.id){g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=3;g.lineCap='round';g.beginPath();g.arc(44,44,16,0,TAU);g.moveTo(33,55);g.lineTo(55,33);g.stroke()}
      else if(p.id==='parrot'){g.strokeStyle='#8a5a2c';g.lineWidth=4;g.beginPath();g.moveTo(18,70);g.lineTo(70,66);g.stroke();drawParrot(44,67,1,false,0,2.6)}

      g.translate(44,94);g.scale(1.7,1.7);drawPirate({x:0,y:0,dir:'down',face:1,moving:true,walk:t*6,swim:false,hurt:0,aim:0,dig:0},t,p.o)}

function repairBoat(){const st=S.story;
  if(st&&st.got.length<BEAM_N){SFX.thud();toast(`You need ${BEAM_N-st.got.length} more driftwood beam${BEAM_N-st.got.length>1?'s':''}`);return}
  fixWreck();SFX.creak(1.4);SFX.splash(.3);toast('Rowboat repaired! Tap Board to set sail.')}
function fixWreck(){S.ship=newShip('rowboat');S.ship.wrecked=false;unstickShip(S.ship);splash(S.ship.x,S.ship.y,14);if(S.story&&S.story.stage!=='done')S.story.stage='sail';updateQuest()}
function skipStory(){if(S.ship.wrecked){S.ship.wrecked=false;S.ship=newShip('rowboat');unstickShip(S.ship)}S.story={stage:'done',got:beamSpots().map(b=>b.i)};updateQuest()}
// ---- drawing
function drawBeam(b,t){const k=Math.sin(t*2.4+b.i)*.5+.5;ctx.save();ctx.translate(b.x,b.y);ctx.scale(1.35,1.35);
  ctx.fillStyle='rgba(120,90,40,.28)';ctx.beginPath();ctx.ellipse(0,3,26,8,0,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,236,190,.55)';ctx.beginPath();ctx.ellipse(-4,1,20,6,0,0,TAU);ctx.fill();
  ctx.rotate(b.rot*.25);
  // one end buried, the other poking up out of the sand
  ctx.fillStyle='#5a3418';ctx.beginPath();ctx.moveTo(-22,2);ctx.lineTo(14,-12);ctx.lineTo(19,-7);ctx.lineTo(-17,6);ctx.closePath();ctx.fill();
  ctx.fillStyle='#8a5a2c';ctx.beginPath();ctx.moveTo(-22,2);ctx.lineTo(14,-12);ctx.lineTo(16,-16);ctx.lineTo(-20,-2);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#4a2c14';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-14,-2);ctx.lineTo(8,-11);ctx.stroke();ctx.fillStyle='#2e1a0a';ctx.beginPath();ctx.arc(10,-11,1.3,0,TAU);ctx.fill();
  ctx.fillStyle='#e8cf98';ctx.beginPath();ctx.ellipse(-18,3,9,4,0,0,TAU);ctx.fill();
  ctx.rotate(-b.rot*.25);
  // a glint so it can be spotted
  ctx.globalAlpha=.4+k*.6;ctx.fillStyle='#fff';ctx.translate(12,-20-k*3);ctx.beginPath();for(let i=0;i<8;i++){const r=i%2?1.4:5+k*2,a=i*PI/4;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.fill();
  ctx.restore()}
function drawWreckBoat(s,t){ctx.save();ctx.translate(s.x,s.y);ctx.scale(1.3,1.3);
  ctx.fillStyle='rgba(60,40,20,.25)';ctx.beginPath();ctx.ellipse(2,6,30,12,0,0,TAU);ctx.fill();
  ctx.rotate(s.h);
  // capsized hull lying on its side: dark planks, a smashed hole, a snapped oar
  const H=HULLS.rowboat;ctx.fillStyle='#6b4423';ctx.beginPath();H.forEach(([x,y],i)=>i?ctx.lineTo(x*1.3,y*1.3-3):ctx.moveTo(x*1.3,y*1.3-3));ctx.closePath();ctx.fill();
  ctx.fillStyle='#8a5a2c';ctx.beginPath();H.forEach(([x,y],i)=>i?ctx.lineTo(x*1.2,Math.min(y,0)*1.1-4):ctx.moveTo(x*1.2,Math.min(y,0)*1.1-4));ctx.closePath();ctx.fill();
  ctx.strokeStyle='#4a2c14';ctx.lineWidth=1.2;for(const y of[-9,-5]){ctx.beginPath();ctx.moveTo(-17,y);ctx.lineTo(18,y);ctx.stroke()}
  ctx.fillStyle='#1e120a';ctx.beginPath();ctx.moveTo(-4,-12);ctx.lineTo(4,-11);ctx.lineTo(7,-5);ctx.lineTo(1,-2);ctx.lineTo(-3,-6);ctx.lineTo(-7,-4);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#a8703a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-4,-12);ctx.lineTo(-6,-16);ctx.moveTo(4,-11);ctx.lineTo(7,-15);ctx.moveTo(7,-5);ctx.lineTo(11,-3);ctx.stroke();
  ctx.restore();
  ctx.save();ctx.translate(s.x+36,s.y+12);ctx.scale(1.3,1.3);ctx.rotate(-.5);ctx.fillStyle='#a8703a';ctx.fillRect(-14,-1.5,22,3);ctx.beginPath();ctx.ellipse(10,0,6,3,0,0,TAU);ctx.fill();ctx.restore();
  if(S.story&&S.story.stage==='repair'){const k=Math.sin(t*4)*.5+.5;ctx.strokeStyle=`rgba(255,201,60,${.4+k*.4})`;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(s.x,s.y+2,34+k*4,14+k*2,0,0,TAU);ctx.stroke()}}
/* ---------- games player bridge ---------- */
// Lets Pocket Arcade drive the game. Protocol "GP v1.1":
//  host -> game  {gp:1,type:'mode',mode:'console'|'fullscreen'}   {gp:1,type:'button',id,down}   {gp:1,type:'pause',paused}
//  game -> host  {gp:1,type:'ready',title,buttons,arcadeTab:true}   {gp:1,type:'labels',buttons}   {gp:1,type:'menu'} (open the Arcade panel)
//  button ids: up down left right a b l r select start
// The host may call window.GP.receive(msg) directly (same origin, keeps the tap's user gesture for audio) or use postMessage.
let gpPaused=false,gpMode=null;
// 'linked' turns on only after a player says hello, so the game opened on its own (even inside another frame) behaves as before
const GP=(()=>{const framed=window.parent!==window;let linked=false;const DIR={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'};
  const labels=()=>({a:fireLbl.textContent,b:boardBtn.disabled?'':boardLbl.textContent,l:'Dig',r:'Bag',select:'Map',start:'Log'});
  const post=m=>{if(framed)try{parent.postMessage({gp:1,...m},'*')}catch(_){}};
  const ready=()=>post({type:'ready',title:'Pirate Seas',buttons:labels(),arcadeTab:true});
  const modal=()=>introOn?$('intro'):!talkEl.hidden?talkEl:!noteEl.hidden?noteEl:!menuEl.hidden?menuEl:!mapOverlay.hidden?mapOverlay:null;
  const focusables=root=>[...root.querySelectorAll('button,input,[tabindex="0"]')].filter(b=>!b.disabled&&b.getClientRects().length&&getComputedStyle(b).visibility!=='hidden');
  function moveFocus(root,dir){const els=focusables(root);if(!els.length)return;const cur=document.activeElement;
    if(!els.includes(cur)){els[0].focus();return}
    const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bd=1e9;
    for(const e of els){if(e===cur)continue;const q=e.getBoundingClientRect(),x=q.left+q.width/2-cx,y=q.top+q.height/2-cy,v=dir==='up'||dir==='down';
      const along=dir==='up'?-y:dir==='down'?y:dir==='left'?-x:x;if(along<=4)continue;const d=along+(v?Math.abs(x):Math.abs(y))*2;if(d<bd){bd=d;best=e}}
    if(best){best.focus();best.scrollIntoView&&best.scrollIntoView({block:'nearest'})}}
  function cycleTab(step){const t=[...document.querySelectorAll('#tabs .tab')];if(!t.length)return;const i=t.findIndex(b=>b.getAttribute('aria-selected')==='true');const n=t[(i+step+t.length)%t.length];n.click();n.focus()}
  function press(id){if(gpPaused)return;unlockAudio();const root=modal();
    if(root){if(root===$('intro')){if(!started&&(id==='a'||id==='start'))introGo();else if(id==='b'||id==='start')introFinish();return}
      if(DIR[id]){moveFocus(root,id);return}
      if(id==='a'){const f=document.activeElement;if(root.contains(f)&&f.tagName==='BUTTON')f.click();else{const els=focusables(root);if(root===noteEl)closeNote();else if(els[0])els[0].focus()}return}
      if(root===menuEl&&(id==='l'||id==='r')){cycleTab(id==='r'?1:-1);return}
      if(id==='b'||id==='start'||id==='select'){if(root===talkEl)closeTalk();else if(root===noteEl)closeNote();else if(root===menuEl)toggleMenu(false);else toggleMap(false)}
      return}
    if(DIR[id]){keys.add(DIR[id]);return}
    if(id==='a')doFire();else if(id==='b')doContext();else if(id==='l')doDig();else if(id==='r'){activeTab='bag';toggleMenu(true)}else if(id==='select')toggleMap(true);else if(id==='start')toggleMenu(true)}
  function release(id){if(DIR[id])keys.delete(DIR[id])}
  let stackEls=null,stack=null; // the pills that share the top-left stack in handheld mode, and where each one normally lives
  function stackHud(on){if(!stackEls)stackEls=[document.querySelector('.hud.topleft'),$('status'),$('quest'),$('hull'),toastEl];
    if(on){if(!stack){stack=document.createElement('div');stack.id='gpTop';stack.className='gp-top';document.body.append(stack)}
      for(const el of stackEls)if(!el.__home){el.__home=document.createComment('hud');el.replaceWith(el.__home)}
      const [tl,status,quest,hull,toastE]=stackEls;stack.append(tl,quest,hull,toastE);tl.append(status)}
    else for(const el of stackEls)if(el.__home){el.__home.replaceWith(el);el.__home=null}}
  function setMode(m){gpMode=m;stackHud(m==='console');document.body.classList.toggle('gp-console',m==='console');document.body.classList.toggle('gp-full',m==='fullscreen');if(m==='console'){joy.active=false;joy.x=joy.y=0}
    dispatchEvent(new Event('resize'))}
  function receive(m){if(!m||m.gp!==1)return;linked=true;
    if(m.type==='button'){m.down?press(m.id):release(m.id)}
    else if(m.type==='mode')setMode(m.mode);
    else if(m.type==='pause'){gpPaused=!!m.paused;if(gpPaused)keys.clear();SFX.setOn(!gpPaused&&settings.sound)}
    else if(m.type==='hello'){ready();if(!menuEl.hidden)renderTabs()}}
  addEventListener('message',e=>receive(e.data));
  // the same keys work whether the player or the game screen has focus
  const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',KeyX:'a',Space:'a',KeyZ:'b',KeyE:'b',KeyQ:'l',KeyF:'l',KeyC:'r',KeyB:'r',ShiftLeft:'select',ShiftRight:'select',KeyM:'select',Enter:'start',Tab:'start'};
  {addEventListener('keydown',e=>{if(!linked||e.metaKey||e.ctrlKey||e.altKey)return;
      if(e.code==='Escape'){if(introOn||(modal()&&!gpPaused))return;e.preventDefault();e.stopImmediatePropagation();post({type:'menu'});return}
      const id=KEYMAP[e.code];if(!id)return;e.preventDefault();e.stopImmediatePropagation();if(!e.repeat)press(id)},true);
    addEventListener('keyup',e=>{const id=KEYMAP[e.code];if(linked&&id){e.stopImmediatePropagation();release(id)}},true)}
  let lastL='';setInterval(()=>{if(!linked)return;const L=JSON.stringify(labels());if(L!==lastL){lastL=L;post({type:'labels',buttons:JSON.parse(L)})}},200);
  if(framed)setTimeout(ready,0);
  return{receive,get linked(){return linked},openArcade:()=>post({type:'menu'}),debug:()=>({x:S.player.x|0,y:S.player.y|0,swing:+(S.player.swing||0).toFixed(2),mode:S.mode,log:!menuEl.hidden,paused:gpPaused,intro:introOn})}})();
window.GP=GP;
/* ---------- loop ---------- */
function populate(){S.kraken=spawnKraken(false);S.navy=[];for(let i=0;i<6;i++){const n=spawnNavy(false,'border');if(n)S.navy.push(n)}for(let i=0;i<6;i++){const n=spawnNavy(false,'roam');if(n)S.navy.push(n)}
  S.bottles=[];for(let i=0;i<36;i++){const b=spawnBottle(false);if(b)S.bottles.push(b)}S.sharks=[];for(let i=0;i<SHARK_N;i++){const k=spawnShark();if(k)S.sharks.push(k)}populateNPCs()}
setTimeout(()=>{$('compassHint').style.opacity=0},6000);
let last=performance.now(),T=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  try{if(!paused())update(dt,T);drawWorld(T);drawCompass(T)}catch(err){console.error(err)}finally{ctx=mainCtx}
  if(settings.protoOpen){try{drawPreviews(T)}catch(err){console.error(err)}finally{ctx=mainCtx}}}
function start(data){
  if(data&&data.worldV===2&&data.player&&data.ship&&data.ship.type&&Array.isArray(data.fleet)&&Array.isArray(data.npcs)&&data.npcs.length){Object.assign(S,data);S.bag=S.bag||[];S.keys=S.keys||{wreck:false};S.wood=S.wood||0;S.hoardWood=S.hoardWood||0;S.sharks=S.sharks||[];S.hoard=S.hoard||{};S.drops=S.drops||[];S.bagCap=S.bagCap||BAG_BASE;S.story=S.story||{stage:'done',got:[]};S.cam={x:focus().x,y:focus().y};goldEl.textContent=S.gold.toLocaleString()}
  else{populate();playIntro(()=>{toast('Washed up on the Isle of First Tides. Find 5 driftwood beams to fix your rowboat')})}
  fixFleet();if(!S.ship.wrecked)unstickShip(S.ship);updateQuest();applySettings();buildPicks();updateBagBtn();updatePistolBtn();updateKeyBtn();
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(()=>JSON.parse(JSON.stringify({mode:S.mode,gold:S.gold,pirate:S.pirate,kills:S.kills,navySunk:S.navySunk,bandits:S.bandits,soldiers:S.soldiers,loots:S.loots,found:S.found,mapPieces:S.mapPieces,maps:S.maps,log:S.log,
  fleet:S.fleet,stash:S.stash,disguises:S.disguises,disguise:S.disguise,player:S.player,ship:S.ship,treasure:S.treasure,kraken:S.kraken?{...S.kraken,victim:null}:null,krakenTimer:S.krakenTimer,chests:S.chests,navy:S.navy,navyTimer:S.navyTimer,bottles:S.bottles,bottleTimer:S.bottleTimer,npcs:S.npcs,enemyTimers:S.enemyTimers,pet:S.pet,worldV:2,hasPistol:S.hasPistol,keys:S.keys,navyChestOpen:S.navyChestOpen,bossBeaten:S.bossBeaten,bag:S.bag,bagCap:S.bagCap,hoard:S.hoard,drops:S.drops,wood:S.wood,hoardWood:S.hoardWood,sharks:S.sharks,story:S.story})));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
