<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Primeval Isle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap">
<style>
/* Layout: full-bleed canvas; HUD pinned to corners (menu+vitals TL, dev panel L, status TC, minimap TR, action wheel BL, joystick BR) */
:root{
  --deep:#0d2a1f; --glass:rgba(9,30,22,.58); --glass-line:rgba(255,255,255,.22);
  --text:#fff; --muted:#c4e3cf; --sun:#ffc23c; --amber:#ff9f1c; --coral:#ff6b5b; --leaf:#4fd18b; --sky:#7fd6ff;
  --panel:#123a2b; --panel-2:#0c281d; --paper:#f3e6c4; --ink:#2c2414;
  --font-ui:"Fredoka",ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif; --font-title:"Lilita One","Fredoka",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--deep);color:var(--text);font-family:var(--font-ui)}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--font-ui)}
[hidden]{display:none!important}
.hud{position:fixed;z-index:5}
.glass{background:var(--glass);border:1.5px solid var(--glass-line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

.topleft{top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.burger{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0}
.burger span{display:block;width:20px;height:3px;border-radius:3px;background:#fff;box-shadow:0 -6px 0 #fff,0 6px 0 #fff}
.burger:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.vitals{display:flex;align-items:center;gap:14px;padding:7px 14px 7px 10px;border-radius:999px}
.vit{display:flex;align-items:center;gap:6px;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.vit svg{width:22px;height:22px;flex:none}
.hp{width:84px;height:9px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.hp i{display:block;height:100%;width:100%;border-radius:9px;background:linear-gradient(90deg,#ff5a4a,#ff9b5a);transition:width .25s}
.vit b.pop{animation:pop .4s ease-out}
@keyframes pop{40%{transform:scale(1.35)}}

.status{top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
  padding:8px 16px 8px 12px;border-radius:999px;font-weight:600;font-size:16px;white-space:nowrap;max-width:calc(100% - 520px)}
.status svg{width:22px;height:22px;color:var(--sun);flex:none}
.status #statusText{overflow:hidden;text-overflow:ellipsis}
.meter{width:56px;height:8px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden;flex:none}
.meter i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--leaf),var(--sun))}
@media (max-width:760px){.status{max-width:none;top:calc(72px + env(safe-area-inset-top,0px));left:12px;transform:none;font-size:14px;padding:6px 12px 6px 10px}
  .toast{top:calc(172px + env(safe-area-inset-top,0px))!important;white-space:normal!important;text-align:center;width:max-content;max-width:calc(100% - 32px)!important;border-radius:20px!important}}
@media (max-width:520px){.vitals{gap:9px;padding:6px 10px 6px 9px}.vit{font-size:15px;gap:4px}.vit svg{width:18px;height:18px}.hp{width:46px}
  .actions{transform:scale(.8);transform-origin:0 100%}body.joy-left .actions{transform-origin:100% 100%}.joy{right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px))}}

.minimap{top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));
  width:150px;height:150px;border-radius:50%;cursor:pointer;touch-action:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.minimap:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
@media (max-width:520px){.minimap{width:96px;height:96px}}

.actions{left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:236px;height:236px}
.actions::before{content:"";position:absolute;inset:26px;border-radius:50%;background:radial-gradient(circle,rgba(9,30,22,.12) 40%,rgba(9,30,22,.34));border:1.5px solid rgba(255,255,255,.14)}
.act{--c:#ef4d3c;--p:1;position:absolute;width:90px;height:90px;left:73px;top:73px;border-radius:50%;padding:0;cursor:pointer;display:grid;place-items:center;
  background:var(--glass);border:1.5px solid var(--glass-line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);touch-action:none;transition:opacity .2s}
.act::before{content:"";position:absolute;inset:7px;border-radius:50%;border:2px dashed rgba(255,255,255,.25)}
.act::after{content:"";position:absolute;inset:-1.5px;border-radius:50%;pointer-events:none;
  background:conic-gradient(var(--c) calc(var(--p)*360deg),transparent 0);
  -webkit-mask:radial-gradient(circle closest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(circle closest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));opacity:.9}
.act .disk{position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:var(--c);
  background:radial-gradient(circle at 38% 32%,#fff,#eef6ee 45%,#c3dccb);box-shadow:0 6px 12px rgba(0,0,0,.35),inset 0 -3px 0 rgba(0,0,0,.12);transition:transform .08s}
.act .disk svg{width:34px;height:34px}
.act .cnt{position:absolute;right:-6px;bottom:-2px;background:#173d2e;color:#fff;font:700 12px/1 Fredoka,system-ui,sans-serif;padding:4px 7px;border-radius:999px;border:1.5px solid rgba(255,255,255,.4);pointer-events:none}
.act.empty .cnt{background:#c8322a}
.act.pressed .disk{transform:scale(.88)}
.act:disabled{opacity:.42;cursor:default}
.act:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.wedge{--c:#4fd18b;position:absolute;inset:0;padding:0;margin:0;border:0;background:none;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;transition:opacity .2s}
.wedge .wg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wedge .wp{fill:rgba(9,30,22,.62);stroke:rgba(255,255,255,.26);stroke-width:1.5;transition:fill .12s}
.wedge .wa{fill:none;stroke:var(--c);stroke-width:4;stroke-linecap:round;opacity:.85}
.wedge .ic{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:2px;pointer-events:none}
.wedge .disk{width:30px;height:30px;display:grid;place-items:center;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.55));transition:transform .08s}
.wedge .disk svg{width:24px;height:24px}
.wedge .lbl{font-size:10.5px;font-weight:700;line-height:1;white-space:nowrap;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.wedge .lbl b{font-weight:700;color:#c8f5da}
.wedge.pressed .wp{fill:rgba(40,120,80,.75)}.wedge.pressed .disk{transform:scale(.88)}
.wedge:disabled{opacity:.42;cursor:default}
.wedge:focus-visible{outline:none}.wedge:focus-visible .wp{stroke:var(--sun);stroke-width:3}
.wedge.bag{--c:#e0b070}.wedge.sneak{--c:#7fd6ff}.wedge.use{--c:#4fd18b}
.wedge.on .wp{fill:rgba(30,90,120,.78)}
.wedge.hot .disk{animation:wiggle 1.2s ease-in-out infinite}.wedge.hot .wa{opacity:1;stroke-width:5}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-10deg)}20%{transform:rotate(10deg)}30%{transform:rotate(0)}}
.wedge.n{clip-path:path('M40.4 30.9A111 111 0 0 1 187.6 30.9L150.4 72.8A55 55 0 0 0 77.6 72.8Z')}.wedge.n .ic{left:114px;top:32px}
.wedge.e{clip-path:path('M197.1 40.4A111 111 0 0 1 197.1 187.6L155.2 150.4A55 55 0 0 0 155.2 77.6Z')}.wedge.e .ic{left:196px;top:114px}
.wedge.s{clip-path:path('M187.6 197.1A111 111 0 0 1 40.4 197.1L77.6 155.2A55 55 0 0 0 150.4 155.2Z')}.wedge.s .ic{left:114px;top:196px}
.wslot{position:absolute;inset:0;width:100%;height:100%;fill:rgba(9,30,22,.2);stroke:rgba(255,255,255,.2);stroke-width:1.5;stroke-dasharray:5 5;pointer-events:none}
@media (prefers-reduced-motion:reduce){.wedge.hot .disk,.modal{animation:none}.blackout{transition-duration:.2s}}

.joy{right:calc(48px + env(safe-area-inset-right,0px));bottom:calc(52px + env(safe-area-inset-bottom,0px));width:136px;height:136px;border-radius:50%;touch-action:none}
.joy::before{content:"";position:absolute;inset:14px;border-radius:50%;border:2px dashed rgba(255,255,255,.25)}
.knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 38% 32%,#fff,#eef6ee 45%,#c3dccb);box-shadow:0 6px 12px rgba(0,0,0,.35),inset 0 -3px 0 rgba(0,0,0,.12)}
.knob::after{content:"";position:absolute;inset:16px;border-radius:50%;border:3px solid rgba(13,42,31,.18)}
body.joy-left .joy{right:auto;left:calc(48px + env(safe-area-inset-left,0px))}
body.joy-left .actions{left:auto;right:calc(14px + env(safe-area-inset-right,0px))}
.joy.floating{right:auto!important;bottom:auto!important;pointer-events:none}

.proto{top:calc(76px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));width:222px;border-radius:20px;padding:6px;max-height:calc(100% - 380px);min-height:46px;overflow-y:auto}
@media (max-width:760px){.proto{top:calc(120px + env(safe-area-inset-top,0px));max-height:calc(100% - 420px)}}
.proto-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border:none;background:none;color:#fff;cursor:pointer;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.proto-head .tag{font-size:10px;padding:2px 7px;border-radius:999px;background:var(--sun);color:#3d2604;letter-spacing:.08em}
.proto-head svg{width:16px;height:16px;transition:transform .2s}
.proto.closed .proto-head svg{transform:rotate(-90deg)}
.proto.closed .proto-body{display:none}
.proto-head:focus-visible{outline:3px solid var(--sun);border-radius:12px}
.proto-body{padding:0 4px 6px}
.proto h4{margin:8px 2px 6px;font-size:12px;font-weight:600;color:var(--muted)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tool{padding:8px 4px;border-radius:12px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font-size:11.5px;font-weight:600;cursor:pointer}
.tool.wide{grid-column:1/-1;background:rgba(255,194,60,.16);border-color:rgba(255,194,60,.5)}
.tool[aria-pressed="true"]{background:rgba(79,209,139,.25);border-color:var(--leaf)}
.tool:focus-visible{outline:3px solid var(--sun)}

.toast{top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:999px;font-weight:600;font-size:15px;transition:opacity .4s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.keys{bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:12.5px;font-weight:500;color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap;pointer-events:none}
@media (pointer:coarse){.keys{display:none}}
@media (max-width:900px){.keys{display:none}}
body.no-hints .keys{display:none}
.blackout{position:fixed;inset:0;z-index:40;background:#000;opacity:0;pointer-events:none;transition:opacity .55s ease}
.blackout.on{opacity:1}
.hurt{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(circle,transparent 45%,rgba(200,20,10,.55));transition:opacity .4s}

/* title + loading */
.title{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,rgba(6,20,14,.5),rgba(4,12,8,.2) 70%,rgba(4,12,8,.55));text-align:center;padding:24px}
body:has(#title:not([hidden])) .hud{opacity:0;pointer-events:none}
.title>div{padding:28px 34px;border-radius:32px;background:radial-gradient(ellipse,rgba(6,20,14,.62),rgba(6,20,14,0) 72%)}
.title h1{margin:0;font-family:var(--font-title);font-weight:400;font-size:clamp(46px,10vw,108px);line-height:.95;letter-spacing:.02em;color:#ffe9b0;
  text-shadow:0 4px 0 #8a4a10,0 8px 24px rgba(0,0,0,.6)}
.title .eyebrow{font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);font-size:13px;margin-bottom:10px}
.title p{color:rgba(255,255,255,.75);margin:14px 0 0;font-size:14px}
.title .go{margin-top:28px;padding:14px 34px;border-radius:999px;border:0;font-size:20px;font-weight:700;cursor:pointer;color:#2c1a04;background:linear-gradient(#ffd56a,#ffab2e);box-shadow:0 6px 0 #a85e10,0 10px 24px rgba(0,0,0,.4)}
.title .go:disabled{opacity:.6;cursor:wait}
.title .go:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* map */
.map-overlay{position:fixed;inset:0;z-index:30;background:rgba(4,14,10,.7);display:grid;place-items:center;padding:18px}
.map-wrap{position:relative;width:min(92vw,86vh);aspect-ratio:1;border-radius:26px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6);border:3px solid rgba(255,255,255,.25)}
.map-wrap canvas{width:100%;height:100%;display:block}
.xbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--glass-line);background:var(--glass);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.xbtn svg{width:20px;height:20px}
.xbtn:focus-visible{outline:3px solid var(--sun)}
.map-close{position:absolute;top:12px;right:12px}

/* modal: field journal, chest */
.modal-back{position:fixed;inset:0;z-index:30;background:rgba(4,14,10,.6);display:grid;place-items:center;padding:16px}
.modal{width:min(640px,100%);max-height:min(720px,calc(100vh - 32px));display:flex;flex-direction:column;border-radius:26px;overflow:hidden;
  background:linear-gradient(#173f2f,#0f2c21);border:2px solid rgba(255,255,255,.18);box-shadow:0 24px 60px rgba(0,0,0,.55);animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px 22px}
.modal h2{margin:0;font-family:var(--font-title);font-weight:400;font-size:28px;letter-spacing:.02em;color:#ffe9b0}
.modal h2 small{display:block;font-family:var(--font-ui);font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.tabs{display:flex;gap:6px;padding:0 16px 10px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-weight:600;font-size:14px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--sun);color:#3a2504;border-color:var(--sun)}
.tab:focus-visible{outline:3px solid #fff}
.panel{padding:6px 16px 18px;overflow-y:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.slot{position:relative;aspect-ratio:1;border-radius:16px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14);display:grid;place-items:center;color:#fff;padding:4px;cursor:pointer}
.slot.empty{cursor:default;border-style:dashed;opacity:.55}
.slot svg{width:36px;height:36px}
.slot .n{position:absolute;right:6px;bottom:4px;font-weight:700;font-size:13px}
.slot .nm{position:absolute;left:0;right:0;bottom:-1px;font-size:9.5px;text-align:center;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.slot:not(.empty):hover{border-color:var(--sun)}
.slot:focus-visible{outline:3px solid var(--sun)}
.sec{margin:14px 2px 8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.hint{color:var(--muted);font-size:13px;margin:10px 2px 0}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.card{border-radius:18px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
.card canvas{width:100%;height:auto;border-radius:12px;background:linear-gradient(#5d8c3c,#4a7a30)}
.card.unseen canvas{opacity:.7}
.card b{font-size:15px}.card small{color:var(--muted);font-size:12px}
.card .stats{display:flex;gap:10px;font-size:12px;margin-top:4px;color:#e8f6ee}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.08)}
.set-row input[type=range]{width:160px;accent-color:var(--sun)}
.switch{width:52px;height:30px;border-radius:999px;border:0;background:rgba(255,255,255,.2);position:relative;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--leaf)}.switch[aria-checked="true"]::after{left:25px}
.switch:focus-visible{outline:3px solid var(--sun)}
.itembar{display:flex;gap:8px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.08)}
.itembar .t{flex:1;font-size:14px}.itembar .t small{display:block;color:var(--muted)}
.btn{padding:9px 16px;border-radius:999px;border:0;font-weight:700;font-size:14px;cursor:pointer;background:var(--sun);color:#3a2504}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff}
.btn:focus-visible{outline:3px solid #fff}
.dest{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.dest-card{gap:6px}.dest-card canvas{background:#0e5f7d}.dest-card .btn{margin-top:6px;align-self:flex-start}.btn:disabled{opacity:.7;cursor:default}
.quest{top:calc(170px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px;padding:7px 14px 7px 10px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap}
.quest svg{width:18px;height:18px;color:var(--sun)}
@media (max-width:520px){.proto.closed{width:168px}.quest{top:calc(114px + env(safe-area-inset-top,0px));font-size:12.5px;padding:5px 10px 5px 8px}}
.bk-txt{position:absolute;inset:0;display:grid;place-items:center;color:#ffe9b0;font:400 clamp(26px,5vw,44px) var(--font-title);letter-spacing:.02em;text-align:center;padding:20px}
.tv-note{color:var(--muted);font-size:13px}
</style></head><body>
<canvas id="game" aria-label="Dinosaur island game world"></canvas>
<div class="hurt" id="hurt"></div>

<div class="hud topleft">
  <button class="burger glass" id="menuBtn" aria-label="Open field journal"><span></span></button>
  <div class="vitals glass" id="vitals">
    <span class="vit" title="Health"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.3-9.4C1.4 8 3.6 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.7 1.2-1.6 2.8-2.7 4.8-2.7 3.6 0 5.8 3.5 4.5 7.1C19.5 16.4 12 21 12 21z" fill="#ff5a4a"/></svg><span class="hp" aria-hidden="true"><i id="hpBar"></i></span></span>
    <span class="vit" title="Tranquilizer darts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21l7-7" stroke="#c9d4cf" stroke-width="2.4" stroke-linecap="round"/><path d="M10 14l7.5-7.5" stroke="#e8eef0" stroke-width="3.4" stroke-linecap="round"/><path d="M17 7l4-4" stroke="#ffc23c" stroke-width="2.4" stroke-linecap="round"/><path d="M4 16l4 4M2.5 18.5l3 3" stroke="#ff6b5b" stroke-width="2" stroke-linecap="round"/></svg><b id="dartCount">0</b></span>
    <span class="vit" title="DNA samples"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3c0 6 10 6 10 12s-10 3-10 6M17 3c0 6-10 6-10 12" stroke="#4fd18b" stroke-width="2.2" stroke-linecap="round"/><path d="M8.5 6.5h7M8.5 17.5h7M10 12h4" stroke="#7fd6ff" stroke-width="2" stroke-linecap="round"/></svg><b id="dnaCount">0</b></span>
  </div>
</div>

<div class="hud proto glass" id="proto">
  <button class="proto-head" id="protoToggle" aria-expanded="true"><span>Prototype <span class="tag">DEV</span></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>

<script>
(()=>{"use strict";
/* ---------- constants & small helpers ---------- */
const TAU=Math.PI*2,PI=Math.PI;
const WW=12000,WH=12000;           // world size in units (1 unit = 1 css px at zoom 1)
const ICX=6000,ICY=6000;           // island centre
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t)};
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>PI)d-=TAU;if(d<-PI)d+=TAU;return d};
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function rng(seed){let s=(seed>>>0)||1;return()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function hash2(x,y,s){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y,s){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  const a=hash2(ix,iy,s),b=hash2(ix+1,iy,s),c=hash2(ix,iy+1,s),d=hash2(ix+1,iy+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,o,s){let t=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){t+=a*vnoise(x*f,y*f,s+i*17);n+=a;a*=.5;f*=2.03}return t/n}
function ridged(x,y,o,s){let t=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){t+=a*(1-Math.abs(vnoise(x*f,y*f,s+i*31)*2-1));n+=a;a*=.5;f*=2.1}return t/n}
function hexRGB(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]}
function shade(hex,amt){const[r0,g0,b0]=hexRGB(hex);const f=amt<0?0:255,p=Math.abs(amt);
  return`rgb(${Math.round((f-r0)*p+r0)},${Math.round((f-g0)*p+g0)},${Math.round((f-b0)*p+b0)})`}
function mix(h1,h2,t){const a=hexRGB(h1),b=hexRGB(h2);return`rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c}
// Catmull-Rom resample of a control polyline into evenly spaced points
function spline(pts,step){const out=[];const P=[pts[0],...pts,pts[pts.length-1]];
  for(let i=1;i<P.length-2;i++){const[p0,p1,p2,p3]=[P[i-1],P[i],P[i+1],P[i+2]];const L=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]);const n=Math.max(2,Math.ceil(L/step));
    for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;
      out.push([.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
                .5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)])}}
  out.push(pts[pts.length-1]);return out}

/* ---------- settings (per-viewer, localStorage wrapped) ---------- */
const settings={vol:.8,joyLeft:false,hints:true,holdSteer:true,quality:'high'};
try{Object.assign(settings,JSON.parse(localStorage.getItem('dino-settings')||'{}'))}catch(_){}
function saveSettings(){try{localStorage.setItem('dino-settings',JSON.stringify(settings))}catch(_){}}
// canvas drawing helpers (use the global ctx that the renderer swaps)
let ctx=null;
function dot(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,Math.abs(r),0,TAU);ctx.fill()}
function ell(x,y,rx,ry,col,rot=0){ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot,0,TAU);ctx.fill()}
function limb(x1,y1,x2,y2,col,w){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}

/* ---------- island layout ---------- */
const CABIN={x:6050,y:9640,w:250,d:170};           // footprint top-left is (x-w/2, y-d); front wall at y
const START={x:6050,y:9760};
const LAKE={cx:7150,cy:5050};
const RIDGE=[[2300,2600],[3500,2050],[4900,2350],[6200,1950],[7600,2250],[8800,2750],[9500,3550]];
const RIVERS=[
  {name:'North Falls',pts:[[6450,2350],[6600,3000],[6750,3600],[6950,4100],[7050,4520]],w0:26,w1:52},
  {name:'Eastwater',pts:[[7750,5150],[8350,5450],[9100,5300],[9800,5650],[10500,5850],[11200,5900]],w0:52,w1:84},
  {name:'Serpent River',pts:[[3550,2750],[3350,3700],[2950,4700],[2550,5700],[2350,6700],[1800,7550],[900,8100],[300,8300]],w0:26,w1:84},
  {name:'Fern Creek',pts:[[4600,6750],[4950,7700],[4650,8700],[4850,9800],[4750,10600],[4800,11400]],w0:20,w1:46}];
const ROADS=[
  {pts:[[6330,9790],[6280,9150],[6050,8300],[5950,7520]]},
  {loop:true,pts:[[5950,7520],[6950,7350],[8100,7250],[8700,6550],[8850,5700],[8550,4700],[7900,4000],[7000,3750],[6000,4000],[5000,4500],[4300,5400],[3900,6400],[4100,7300],[5000,7750]]},
  {pts:[[3900,6400],[3000,6650],[2200,6950],[1500,7050]]}];
const PLACES=[
  {name:'Cabin',x:5900,y:10020},{name:'Lake Verdant',x:LAKE.cx,y:LAKE.cy},{name:'Ironback Mountains',x:4700,y:2500},
  {name:'Tangle Jungle',x:3200,y:7600},{name:'Long Meadow',x:7800,y:8000},{name:'North Falls',x:6650,y:3050},
  {name:'Serpent River',x:2600,y:5300},{name:'Sunset Beach',x:1300,y:6900},{name:'Mosasaur Bay',x:10500,y:8800}];

/* ---------- terrain grid ---------- */
const GS=20,GN=WW/GS;                     // 600 x 600 cells
const N=GN*GN;
const LAND=new Float32Array(N),LAKEF=new Float32Array(N),RIV=new Float32Array(N).fill(999),ROAD=new Float32Array(N).fill(999),ROADA=new Float32Array(N),
  H=new Float32Array(N),SH=new Float32Array(N),JUN=new Float32Array(N),FOR=new Float32Array(N),CR=new Uint8ClampedArray(N),CG=new Uint8ClampedArray(N),CB=new Uint8ClampedArray(N);
const HS=900;            // height scale (units per 1.0 of H) for shading
const PEAK=.8;           // H above this is sheer rock: no one passes

function coastR(a,x,y){return 4850+420*Math.sin(3*a+1.1)+260*Math.sin(5*a+2.3)+170*Math.sin(9*a+.4)+(fbm(x/1500,y/1500,4,1)-.5)*1300}
function lakeR(a){return 640+130*Math.sin(3*a+1)+90*Math.sin(5*a+.3)+50*Math.sin(8*a+2)}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return[Math.hypot(px-ax-dx*t,py-ay-dy*t),t]}
function ridgeDist(x,y){let m=1e9;for(let i=0;i<RIDGE.length-1;i++){const[d]=segDist(x,y,...RIDGE[i],...RIDGE[i+1]);if(d<m)m=d}return m}

const RIVER_PATHS=[],ROAD_PATHS=[];
function stamp(F,pts,wfn,angF){ // signed distance (dist - halfwidth) written into F, min-combined
  for(let i=0;i<pts.length;i++){const[x,y]=pts[i];const w=wfn(i/(pts.length-1));const R=w+60;
    const p2=pts[Math.min(pts.length-1,i+1)],p1=pts[Math.max(0,i-1)];const ang=Math.atan2(p2[1]-p1[1],p2[0]-p1[0]);
    const gx0=Math.max(0,Math.floor((x-R)/GS)),gx1=Math.min(GN-1,Math.floor((x+R)/GS)),gy0=Math.max(0,Math.floor((y-R)/GS)),gy1=Math.min(GN-1,Math.floor((y+R)/GS));
    for(let gy=gy0;gy<=gy1;gy++)for(let gx=gx0;gx<=gx1;gx++){const cx=(gx+.5)*GS,cy=(gy+.5)*GS;const d=Math.hypot(cx-x,cy-y)-w;const k=gy*GN+gx;if(d<F[k]){F[k]=d;if(angF)angF[k]=ang}}}}

function genTerrain(){
  // rivers: wobble the spline sideways with noise so they meander
  RIVERS.forEach((rv,ri)=>{const s=spline(rv.pts,18);const out=[];
    for(let i=0;i<s.length;i++){const a=s[Math.max(0,i-1)],b=s[Math.min(s.length-1,i+1)];const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
      const off=(fbm(i*.018,ri*7.3,3,40+ri)-.5)*300*smooth(0,.08,i/s.length);out.push([s[i][0]-Math.sin(ang)*off,s[i][1]+Math.cos(ang)*off])}
    RIVER_PATHS.push(out);stamp(RIV,out,t=>lerp(rv.w0,rv.w1,t))});
  ROADS.forEach(rd=>{const pts=rd.loop?[...rd.pts,rd.pts[0],rd.pts[1]]:rd.pts;let s=spline(pts,16);if(rd.loop)s=s.slice(0,Math.floor(s.length*(rd.pts.length)/(rd.pts.length+1))+2);
    ROAD_PATHS.push(s);stamp(ROAD,s,()=>44,ROADA)});
  for(let gy=0;gy<GN;gy++)for(let gx=0;gx<GN;gx++){
    const k=gy*GN+gx,x=(gx+.5)*GS,y=(gy+.5)*GS;
    const dx=x-ICX,dy=y-ICY,a=Math.atan2(dy,dx),d=Math.hypot(dx,dy);
    let land=coastR(a,x,y)-d;
    // keep a calm sandy bay below the cabin
    land=Math.max(land,520-Math.hypot((x-6050)/1.6,y-10000));
    LAND[k]=land;
    const ldx=x-LAKE.cx,ldy=y-LAKE.cy;LAKEF[k]=Math.hypot(ldx,ldy)-lakeR(Math.atan2(ldy,ldx))+(fbm(x/300,y/300,3,9)-.5)*120;
    const rd=ridgeDist(x,y);
    let m=Math.max(0,1-rd/1250);m=Math.pow(m,1.5)*(.62+.75*ridged(x/900,y/900,3,5));
    let h=smooth(0,1400,land)*.2+(fbm(x/2200,y/2200,3,4)-.5)*.14+(fbm(x/700,y/700,4,3)-.5)*.05+m*1.05;
    if(land<0)h=land/700;
    // lake basin and river beds pull the ground down
    h-=Math.max(0,1-Math.max(0,LAKEF[k])/500)*.12;
    H[k]=h;
    // biome weights
    let j=(5300-x)/1500+(fbm(x/1100,y/1100,4,21)-.5)*1.8+Math.exp(-((x-9200)**2+(y-8400)**2)/(900*900))*1.4-Math.max(0,(4200-y)/900);
    j+=Math.exp(-((x-4700)**2+(y-8200)**2)/(700*700))*.8;
    JUN[k]=smooth(.15,.6,j);
    let f=smooth(.24,.42,h)*1.4*(1-smooth(.62,.78,h))+smooth(4600,3300,y)*.7+(fbm(x/900,y/900,3,33)-.5)*.6;
    FOR[k]=clamp(smooth(.2,.6,f)*(1-JUN[k]*.7),0,1);
    H[k]=h;
  }
  // hillshade (light from the north-west, high in the sky) from a smoothed copy of the heights
  const HB=new Float32Array(H);const tmp=new Float32Array(N);
  for(let pass=0;pass<3;pass++){for(let gy=0;gy<GN;gy++)for(let gx=0;gx<GN;gx++){let t=0,n=0;for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){const xx=gx+ox,yy=gy+oy;if(xx<0||yy<0||xx>=GN||yy>=GN)continue;t+=HB[yy*GN+xx];n++}tmp[gy*GN+gx]=t/n}HB.set(tmp)}
  const Lx=-.5,Ly=-.2,Lz=.84;
  for(let gy=0;gy<GN;gy++)for(let gx=0;gx<GN;gx++){const k=gy*GN+gx;
    const hx=(HB[gy*GN+Math.min(GN-1,gx+1)]-HB[gy*GN+Math.max(0,gx-1)])/(2*GS)*HS,hy=(HB[Math.min(GN-1,gy+1)*GN+gx]-HB[Math.max(0,gy-1)*GN+gx])/(2*GS)*HS;
    const l=(-hx*Lx-hy*Ly+Lz)/Math.sqrt(hx*hx+hy*hy+1);SH[k]=clamp(1+(l/Lz-1)*.8,.5,1.3);const slope=Math.hypot(hx,hy);
    // base land colour
    const x=(gx+.5)*GS,y=(gy+.5)*GS;
    const J=JUN[k],F=FOR[k],h=H[k];
    const n=fbm(x/260,y/260,3,77);
    let r=lerp(132,166,n),g=lerp(186,196,n),b=lerp(74,84,n);                       // meadow
    r=lerp(r,lerp(46,74,n),J);g=lerp(g,lerp(112,128,n),J);b=lerp(b,lerp(40,46,n),J);  // jungle floor
    r=lerp(r,lerp(88,112,n),F);g=lerp(g,lerp(132,140,n),F);b=lerp(b,lerp(58,64,n),F); // forest floor
    const rk=Math.max(smooth(.75,1.5,slope+(n-.5)*.5)*smooth(.3,.45,h),smooth(.74,.82,h));r=lerp(r,lerp(118,140,n),rk);g=lerp(g,lerp(112,130,n),rk);b=lerp(b,lerp(100,114,n),rk);
    
    CR[k]=r;CG[k]=g;CB[k]=b}
}

/* fast sampling: bilinear on the grid (cell centres) */
function bil(A,x,y){let fx=x/GS-.5,fy=y/GS-.5;let ix=Math.floor(fx),iy=Math.floor(fy);if(ix<0){ix=0;fx=0}if(iy<0){iy=0;fy=0}if(ix>GN-2){ix=GN-2;fx=GN-1}if(iy>GN-2){iy=GN-2;fy=GN-1}
  const tx=fx-ix,ty=fy-iy,k=iy*GN+ix;return(A[k]*(1-tx)+A[k+1]*tx)*(1-ty)+(A[k+GN]*(1-tx)+A[k+GN+1]*tx)*ty}
// Terrain query used for movement. kinds: deep (ocean/lake deep), water (shallow ocean or lake), river, road, bridge, beach, land, cliff
function terr(x,y){return S&&S.land==='city'?cityTerr(x,y):islandTerr(x,y)}
function islandTerr(x,y){
  if(x<0||y<0||x>=WW||y>=WH)return{k:'deep',depth:999};
  const land=bil(LAND,x,y),road=bil(ROAD,x,y);
  if(land<0){const dp=-land;return{k:dp>70?'deep':'water',depth:dp}}
  if(road<0){const rv=bil(RIV,x,y);return{k:rv<4?'bridge':'road'}}
  const lk=bil(LAKEF,x,y);if(lk<0)return{k:-lk>60?'deep':'water',depth:-lk,lake:true};
  const rv=bil(RIV,x,y);if(rv<0)return{k:'river',depth:-rv};
  const h=bil(H,x,y);if(h>PEAK)return{k:'cliff',h};
  if(land<150)return{k:'beach'};
  const J=bil(JUN,x,y),F=bil(FOR,x,y);return{k:'land',J,F,h}}
const walkable=t=>t.k!=='cliff'&&t.k!=='deep';

/* ---------- noise tiles for per-pixel texture ---------- */
const NT1=new Float32Array(65536),NT2=new Float32Array(65536);
for(let y=0;y<256;y++)for(let x=0;x<256;x++){
  // tileable: sample noise on a torus-ish by blending
  const a=fbm(x/5,y/5,3,101),b=fbm((x+256)/5,y/5,3,101),c=fbm(x/5,(y+256)/5,3,101),d=fbm((x+256)/5,(y+256)/5,3,101);
  const u=x/256,v=y/256;NT1[y*256+x]=(lerp(lerp(d,c,u),lerp(b,a,u),v)-.5)*2;
  const a2=fbm(x/24,y/24,4,202),b2=fbm((x+256)/24,y/24,4,202),c2=fbm(x/24,(y+256)/24,4,202),d2=fbm((x+256)/24,(y+256)/24,4,202);
  NT2[y*256+x]=(lerp(lerp(d2,c2,u),lerp(b2,a2,u),v)-.5)*2}

/* ---------- terrain chunks (baked ImageData + decals) ---------- */
const CELL=480;
const chunks=new Map();let chunkTick=0;
function s4(A,k,a,b,c,d){return A[k]*a+A[k+1]*b+A[k+GN]*c+A[k+GN+1]*d}
function bakeChunk(cx,cy){
  const res=settings.quality==='low'?.5:1;
  const W=Math.round(CELL*res),c=mkCanvas(W,W),g=c.getContext('2d');
  const img=g.createImageData(W,W),D=img.data;
  const x0=cx*CELL,y0=cy*CELL,inv=1/res;
  for(let py=0;py<W;py++){
    const wy=y0+(py+.5)*inv;let fy=wy/GS-.5;let iy=Math.floor(fy);if(iy<0){iy=0;fy=0}if(iy>GN-2){iy=GN-2;fy=GN-1}const ty=fy-iy;
    for(let px=0;px<W;px++){
      const wx=x0+(px+.5)*inv;let fx=wx/GS-.5;let ix=Math.floor(fx);if(ix<0){ix=0;fx=0}if(ix>GN-2){ix=GN-2;fx=GN-1}const tx=fx-ix;
      const k=iy*GN+ix,w00=(1-tx)*(1-ty),w10=tx*(1-ty),w01=(1-tx)*ty,w11=tx*ty;
            const nx=(wx|0)&255,ny=(wy|0)&255;const n1=NT1[ny*256+nx],n2=NT2[(((wy/4)|0)&255)*256+(((wx/4)|0)&255)];
      const land=s4(LAND,k,w00,w10,w01,w11)+n2*18;
      const o=(py*W+px)*4;let r,gg,b,a=255;
      const road=s4(ROAD,k,w00,w10,w01,w11);
      if(land<0){ // ocean
        const dp=-land;
        if(dp<7){r=240;gg=250;b=246;a=225}
        else if(dp<14){r=150;gg=226;b=214;a=200}
        else{const t=smooth(14,560,dp);r=lerp(78,10,t)+n1*4;gg=lerp(206,90,t)+n1*4;b=lerp(196,120,t)+n1*4;a=lerp(215,0,smooth(30,600,dp))}
      }else{
        const lk=s4(LAKEF,k,w00,w10,w01,w11)+n2*14,rv=road<0?99:s4(RIV,k,w00,w10,w01,w11)+n2*8;
        if(road>=0&&(lk<0||rv<0)){ // fresh water
          const dp=lk<0?-lk:-rv,lake=lk<0;
          if(dp<4){r=232;gg=240;b=226;a=200}
          else{const t=smooth(4,lake?320:70,dp);r=lerp(88,22,t)+n1*5;gg=lerp(170,104,t)+n1*5;b=lerp(150,112,t)+n1*4;a=lerp(225,lake?70:150,t)}
        }else{
          // land colour
          r=s4(CR,k,w00,w10,w01,w11);gg=s4(CG,k,w00,w10,w01,w11);b=s4(CB,k,w00,w10,w01,w11);
          const sh=s4(SH,k,w00,w10,w01,w11);
          const J=s4(FOR,k,w00,w10,w01,w11)*.0+s4(JUN,k,w00,w10,w01,w11);
          // dappled jungle floor + litter
          const tex=1+n1*.07+n2*(.1+J*.08);
          r*=tex;gg*=tex;b*=tex;
          if(J>.4&&n2>.35){const q=(n2-.35)*1.4*J;r=lerp(r,96,q);gg=lerp(gg,84,q);b=lerp(b,44,q)}
          // beach
          const bw=150+n2*70;
          if(land<bw){const t=smooth(bw,bw-40,land);const wet=smooth(42,18,land);
            const sr=lerp(236,196,wet)+n1*8,sg=lerp(214,170,wet)+n1*8,sb=lerp(160,118,wet)+n1*6;r=lerp(r,sr,t);gg=lerp(gg,sg,t);b=lerp(b,sb,t)}
          // muddy lake shore and river banks
          const bank=Math.min(lk,rv);if(bank<26&&road>=0){const t=smooth(26,4,bank);r=lerp(r,128+n1*10,t*.8);gg=lerp(gg,112+n1*10,t*.8);b=lerp(b,78,t*.8)}
          const hh=s4(H,k,w00,w10,w01,w11);
          if(hh>PEAK-.05){const t=smooth(PEAK-.05,PEAK+.01,hh);const band=((hh*55+n2*.35)%1+1)%1;const st=band<.22?.72:band<.3?1.12:1;
            r=lerp(r,(132+n1*12)*st,t);gg=lerp(gg,(118+n1*10)*st,t);b=lerp(b,(102+n1*8)*st,t)}
          r*=sh;gg*=sh;b*=sh;
          if(road<4){ // dirt road / bridge
            const rv2=s4(RIV,k,w00,w10,w01,w11)+n2*8;
            if(rv2<6&&road<0){ // bridge planks
              const ang=ROADA[k];const along=wx*Math.cos(ang)+wy*Math.sin(ang);const pl=((along/7)|0)&1;
              const edge=road>-7;r=edge?74:(pl?150:132)+n1*10;gg=edge?48:(pl?104:90)+n1*8;b=edge?28:(pl?62:52)+n1*6;
            }else{
              const t=smooth(4,-6,road);const rut=(road<-15&&road>-29)?.84:1;
              r=lerp(r,(190+n1*12)*rut*sh,t);gg=lerp(gg,(156+n1*10)*rut*sh,t);b=lerp(b,(104+n1*8)*rut*sh,t)}
          }
        }
      }
      D[o]=r;D[o+1]=gg;D[o+2]=b;D[o+3]=a}}
  g.putImageData(img,0,0);
  g.setTransform(res,0,0,res,-x0*res,-y0*res);
  bakeDecals(g,cx,cy);
  return{c,res,t:0}}
function getChunk(cx,cy,allowBake){const key=cx+','+cy;let ch=chunks.get(key);if(ch){ch.t=chunkTick;return ch}
  if(!allowBake)return null;ch=S&&S.land==='city'?bakeCityChunk(cx,cy):bakeChunk(cx,cy);ch.t=chunkTick;chunks.set(key,ch);
  if(window.createImageBitmap){const c0=ch;createImageBitmap(ch.c).then(b=>{c0.c=b}).catch(()=>{})}
  if(chunks.size>70){let old=null,ot=1e9;for(const[k2,v] of chunks)if(v.t<ot){ot=v.t;old=k2}chunks.delete(old)}
  return ch}

/* ---------- low-res whole-island image (minimap, full map, fallback while chunks bake) ---------- */
let MINI=null;
function makeMini(){const c=mkCanvas(GN,GN),g=c.getContext('2d'),img=g.createImageData(GN,GN),D=img.data;
  for(let k=0;k<N;k++){const o=k*4;const land=LAND[k];let r,gg,b;
    if(land<0){const t=smooth(0,600,-land);r=lerp(80,14,t);gg=lerp(200,92,t);b=lerp(196,128,t)}
    else if(ROAD[k]<0){r=190*SH[k];gg=156*SH[k];b=104*SH[k]}
    else if(LAKEF[k]<0){const t=smooth(0,300,-LAKEF[k]);r=lerp(80,24,t);gg=lerp(170,100,t);b=lerp(150,120,t)}
    else if(RIV[k]<6){r=74;gg=160;b=150}
    else if(land<150){r=232;gg=210;b=156}
    else{const s=SH[k];r=CR[k]*s*(1-JUN[k]*.25);gg=CG[k]*s*(1-JUN[k]*.12);b=CB[k]*s}
    D[o]=r;D[o+1]=gg;D[o+2]=b;D[o+3]=255}
  g.putImageData(img,0,0);MINI=c}

/* ---------- animated water underlay ---------- */
let waterPatA=null,waterPatB=null;
function makeWaterPats(g){
  const mk=(seed,alpha,count,len)=>{const c=mkCanvas(256,256),q=c.getContext('2d');const r=rng(seed);q.lineCap='round';
    for(let i=0;i<count;i++){const x=r()*256,y=r()*256,w=len*(.6+r()*.8);q.strokeStyle=`rgba(225,250,255,${alpha*(.5+r()*.5)})`;q.lineWidth=1.4+r()*1.4;
      for(const ox of[-256,0,256])for(const oy of[-256,0,256]){q.beginPath();q.moveTo(x+ox,y+oy);q.quadraticCurveTo(x+ox+w/2,y+oy-4,x+ox+w,y+oy);q.stroke()}}
    return g.createPattern(c,'repeat')};
  waterPatA=mk(3,.16,26,18);waterPatB=mk(11,.11,20,24)}

/* ---------- vegetation & rock sprites (pre-rendered once, drawn with drawImage) ---------- */
const SPR=2; // sprites are painted at 2x for sharp high-DPI drawing
const ALL_SPR=[];
function sprite(w,h,ox,oy,paint){const c=mkCanvas(w*SPR,h*SPR),g=c.getContext('2d');g.scale(SPR,SPR);g.translate(ox,oy);g.lineCap='round';g.lineJoin='round';paint(g);const s={c,w,h,ox,oy};ALL_SPR.push(s);return s}
// immutable bitmaps draw much faster than canvases when many different sprites are interleaved
function bitmapAll(){if(!window.createImageBitmap)return Promise.resolve();return Promise.all(ALL_SPR.map(s=>createImageBitmap(s.c).then(b=>{s.c=b}).catch(()=>{})))}
function drawSpr(s,x,y,alpha=1,skew=0){if(alpha<.995)ctx.globalAlpha=alpha;
  if(skew){ctx.save();ctx.translate(x,y);ctx.transform(1,0,skew,1,0,0);ctx.drawImage(s.c,-s.ox,-s.oy,s.w,s.h);ctx.restore()}
  else ctx.drawImage(s.c,x-s.ox,y-s.oy,s.w,s.h);if(alpha<.995)ctx.globalAlpha=1}
function circ(g,x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,Math.max(0,r),0,TAU);g.fill()}
function oval(g,x,y,rx,ry,col,rot=0){g.fillStyle=col;g.beginPath();g.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),rot,0,TAU);g.fill()}

const PAL={
  jungle:[['#173f1d','#285f27','#3f8434','#76b44c'],['#163a26','#24583a','#3a7b48','#6cae6a'],['#1d4219','#336a22','#558f2f','#94c254']],
  oak:[['#2a5220','#447f31','#67a645','#a5d26a'],['#30561c','#4f8a2a','#79b23e','#b8dc62']],
  bloom:['#ff7aa8','#ffd25a','#ff9a4a','#f4f0ff']};
function paintClumpCanopy(g,R,pal,r,blooms){
  const n=Math.round(22+R/3),cl=[];
  for(let i=0;i<n;i++){const a=r()*TAU,d=Math.sqrt(r())*R*.7;cl.push([Math.cos(a)*d,Math.sin(a)*d*.9,R*(.24+r()*.16)])}
  cl.sort((a,b)=>a[1]-b[1]);
  // soft ambient-occlusion underside
  oval(g,R*.08,R*.12,R*1.02,R*.92,'rgba(10,30,10,.35)');
  for(const[x,y,c] of cl){circ(g,x+1.5,y+2.6,c,pal[0])}
  for(const[x,y,c] of cl){circ(g,x,y,c*.9,pal[1]);circ(g,x-c*.22,y-c*.3,c*.62,pal[2]);g.globalAlpha=.75;circ(g,x-c*.38,y-c*.46,c*.26,pal[3]);g.globalAlpha=1}
  // crisp leaf speckles
  for(let i=0;i<R*5;i++){const a=r()*TAU,d=Math.sqrt(r())*R*.95,x=Math.cos(a)*d,y=Math.sin(a)*d*.9;const lit=(-x-y)/(R*1.4);
    oval(g,x,y,2.6+r()*1.6,1.3+r()*.8,pal[lit>.15?3:lit>-.3?2:1],r()*PI);}
  // jagged edge leaves
  for(let i=0;i<R*1.4;i++){const a=r()*TAU,d=R*(.86+r()*.14),x=Math.cos(a)*d,y=Math.sin(a)*d*.9;oval(g,x,y,3.4,1.6,pal[(a>PI*.9&&a<PI*1.7)?2:1],a+PI/2)}
  if(blooms)for(let i=0;i<R*.7;i++){const a=r()*TAU,d=Math.sqrt(r())*R*.85;const x=Math.cos(a)*d,y=Math.sin(a)*d*.9;circ(g,x,y,1.8+r(),blooms);circ(g,x-.5,y-.5,.8,'#fff')}
  // overall light falloff to the lower right
  const gr=g.createRadialGradient(-R*.4,-R*.45,R*.1,0,0,R*1.15);gr.addColorStop(0,'rgba(255,255,220,.10)');gr.addColorStop(.6,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,25,10,.32)');
  g.globalCompositeOperation='source-atop';g.fillStyle=gr;g.fillRect(-R*1.3,-R*1.3,R*2.6,R*2.6);g.globalCompositeOperation='source-over'}
function paintTrunk(g,h,w,col,r,roots){
  const grd=g.createLinearGradient(-w/2,0,w/2,0);grd.addColorStop(0,shade(col,.18));grd.addColorStop(.45,col);grd.addColorStop(1,shade(col,-.45));
  if(roots){g.fillStyle=shade(col,-.2);for(const s of[-1,1]){g.beginPath();g.moveTo(s*w*.3,-h*.18);g.quadraticCurveTo(s*w*.6,-4,s*w*1.4,2);g.lineTo(s*w*.4,2);g.fill()}
    g.beginPath();g.moveTo(-w*.2,-h*.15);g.quadraticCurveTo(-w*.1,0,-w*.3,5);g.lineTo(w*.3,5);g.quadraticCurveTo(w*.1,0,w*.2,-h*.15);g.fill()}
  g.fillStyle=grd;g.beginPath();g.moveTo(-w/2,2);g.quadraticCurveTo(-w*.42,-h*.5,-w*.32,-h);g.lineTo(w*.32,-h);g.quadraticCurveTo(w*.42,-h*.5,w/2,2);g.fill();
  g.strokeStyle='rgba(30,15,5,.35)';g.lineWidth=1;for(let i=0;i<6;i++){const x=(r()-.5)*w*.7;g.beginPath();g.moveTo(x,-r()*h*.2);g.lineTo(x+(r()-.5)*3,-h*(.4+r()*.5));g.stroke()}}
function paintFrond(g,x0,y0,a,L,droop,width,col,dark,r,lift=0){
  // a frond seen from above at an angle: spine curving out and down
  const pts=[];for(let i=0;i<=14;i++){const t=i/14;pts.push([x0+Math.cos(a)*L*t,y0+Math.sin(a)*L*t*.62-(Math.sin(PI*t*.75)*lift-t*t*droop)])}
  g.strokeStyle=dark;g.lineWidth=1.6;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();
  for(let i=1;i<pts.length;i++){const t=i/14,[x,y]=pts[i],[px,py]=pts[i-1];const da=Math.atan2(y-py,x-px);const wl=width*Math.sin(PI*Math.min(1,t*1.1))*(.8+r()*.3);
    for(const s of[-1,1]){const la=da+s*(1.1-t*.3);g.strokeStyle=s<0?col:shade(col,-.18);g.lineWidth=2.3;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(la)*wl,y+Math.sin(la)*wl*.8+wl*.15);g.stroke()}}}

      for(let i=0;i<n;i++){const a=(i/(n-1))*PI+(r()-.5)*.2;paintFrond(g,0,-h,a,R*(.9+r()*.2),R*.3,R*.26,'#5aa443','#2d6a26',r,R*.26)}
      circ(g,0,-h,5,'#2d5a22');for(let i=0;i<5;i++){g.strokeStyle='#8a7a40';g.lineWidth=1.5;g.beginPath();g.arc(-3+i*1.5,-h-3,2.5,PI,TAU*.9);g.stroke()}})})}
  TREES.palm=[];for(let v=0;v<4;v++){const h=92+v*10,lean=(v%2?1:-1)*(14+v*4),R=58;

/* ---------- streamed per-cell objects (deterministic per cell) ---------- */
const cellCache=new Map();
function nearCabin(x,y,m){return x>CABIN.x-CABIN.w/2-m&&x<CABIN.x+CABIN.w/2+m&&y>CABIN.y-CABIN.d-m&&y<CABIN.y+m+60}
function cellObjs(cx,cy){if(S&&S.land==='city')return cityCellObjs(cx,cy);const key=cx+','+cy;let o=cellCache.get(key);if(o)return o;
  const r=rng(hash2(cx,cy,9)*4e9);const trees=[],bushes=[],rocks=[];const x0=cx*CELL,y0=cy*CELL;
  const clear=(x,y,m)=>bil(ROAD,x,y)<m||bil(RIV,x,y)<m*.6||bil(LAKEF,x,y)<m*.6||nearCabin(x,y,m+120)||dist(x,y,HELI_I.x,HELI_I.y)<m+190;
  for(let j=0;j<3;j++)for(let i=0;i<3;i++){const x=x0+(i+.5)*160+(r()-.5)*64,y=y0+(j+.5)*160+(r()-.5)*64;const q=r(),q2=r();
    const t=terr(x,y);if(t.k!=='land'&&t.k!=='beach')continue;if(clear(x,y,46))continue;
    const land=bil(LAND,x,y);
    if(land<420){if(land>60&&q<.32)trees.push(mkTree(x,y,'palm',q2));continue}
    const J=t.J,F=t.F,M=Math.max(0,1-J-F);
    const p=J*.95+F*.62+M*.045+(t.h>.62?-.25:0);
    if(q<p){let type;if(J>F&&J>M)type=q2<.6?'jungle':q2<.86?'fern':'palm';else if(F>M)type=t.h>.45||q2<.6?'conifer':'jungle';else type=q2<.75?'oak':'jungle';
      trees.push(mkTree(x,y,type,r()))}}
  for(let j=0;j<3;j++)for(let i=0;i<3;i++){const x=x0+(i+.5)*160+80+(r()-.5)*40,y=y0+(j+.5)*160+80+(r()-.5)*40;const q=r(),q2=r();
    const t=terr(x,y);if(t.k!=='land'||t.J<.45||clear(x,y,46))continue;
    if(q<t.J*.75&&!trees.some(tr=>dist(tr.x,tr.y,x,y)<112))trees.push(mkTree(x,y,q2<.6?'fern':q2<.8?'palm':'jungle',r()))}
  for(let j=0;j<3;j++)for(let i=0;i<3;i++){const x=x0+(i+.5)*160+80+(r()-.5)*60,y=y0+(j+.5)*160+80+(r()-.5)*60;const q=r();
    const t=terr(x,y);if(t.k!=='land'&&t.k!=='beach')continue;if(clear(x,y,40))continue;
    const p=t.k==='beach'?.06:t.h>.5?.4:.05;if(q<p&&!trees.some(tr=>dist(tr.x,tr.y,x,y)<70)){const v=(r()*ROCKS.length)|0;rocks.push({x,y,v,r:ROCKS[v].R*.85})}}
  for(let j=0;j<8;j++)for(let i=0;i<8;i++){const x=x0+(i+.5)*60+(r()-.5)*40,y=y0+(j+.5)*60+(r()-.5)*40;const q=r(),q2=r();
    const t=terr(x,y);if(t.k!=='land'&&t.k!=='beach')continue;if(clear(x,y,20))continue;
    if(trees.some(tr=>dist(tr.x,tr.y,x,y)<26)||rocks.some(k=>dist(k.x,k.y,x,y)<k.r+14))continue;
    let kind=null;
    if(t.k==='beach'){if(q<.12)kind='dune'}
    else{const J=t.J,F=t.F,M=Math.max(0,1-J-F);const p=J*.5+F*.28+M*.12;if(q<p){kind=J>.5?(q2<.55?'fern':'shrub'):F>M?(q2<.5?'fern':'shrub'):(q2<.75?'grass':'shrub')}}
    if(kind){const set=BUSH[kind];const v=(r()*set.length)|0;bushes.push({x,y,kind,v,R:set[v].R,rs:0,ph:r()*TAU})}}
  o={trees,bushes,rocks};cellCache.set(key,o);
  if(cellCache.size>400){const k0=cellCache.keys().next().value;cellCache.delete(k0)}
  return o}
function mkTree(x,y,type,q){const set=TREES[type];const v=Math.min(set.length-1,(q*set.length)|0);const T=set[v];
  return{x,y,type,v,r:type==='conifer'?11:type==='palm'?9:type==='fern'?8:14,h:T.h,R:T.R,fade:1,ph:x*.01+y*.007}}
function forCells(x,y,rad,fn){const c0=Math.floor((x-rad)/CELL),c1=Math.floor((x+rad)/CELL),r0=Math.floor((y-rad)/CELL),r1=Math.floor((y+rad)/CELL);
  const lim=worldW()/CELL;for(let cy=r0;cy<=r1;cy++)for(let cx=c0;cx<=c1;cx++)if(cx>=0&&cy>=0&&cx<lim&&cy<lim)fn(cellObjs(cx,cy))}
// Push a circle out of trees, boulders and the cabin. Returns true if it hit something.
function collideSolids(o,rad){if(S&&S.land==='city')return cityCollide(o,rad);let hit=false;
  forCells(o.x,o.y,rad+40,c=>{for(const s of c.trees){const dx=o.x-s.x,dy=o.y-s.y,d=Math.hypot(dx,dy),m=s.r+rad;if(d<m&&d>.01){o.x=s.x+dx/d*m;o.y=s.y+dy/d*m;hit=true}}
    for(const s of c.rocks){const dx=o.x-s.x,dy=o.y-s.y,d=Math.hypot(dx,dy),m=s.r+rad;if(d<m&&d>.01){o.x=s.x+dx/d*m;o.y=s.y+dy/d*m;hit=true}}});
  // cabin footprint (box) + porch posts
  const bx0=CABIN.x-CABIN.w/2,bx1=CABIN.x+CABIN.w/2,by0=CABIN.y-CABIN.d,by1=CABIN.y;
  const nx=clamp(o.x,bx0,bx1),ny=clamp(o.y,by0,by1),dx=o.x-nx,dy=o.y-ny,d=Math.hypot(dx,dy);
  if(d<rad){hit=true;if(d>.01){o.x=nx+dx/d*rad;o.y=ny+dy/d*rad}else{o.y=by1+rad}}
  return hit}

/* bake decals + tree shadows into a terrain chunk */
function bakeDecals(g,cx,cy){
  const x0=cx*CELL,y0=cy*CELL,r=rng(hash2(cx,cy,3)*4e9);
  const dr=(s,x,y)=>g.drawImage(s.c,x-s.ox,y-s.oy,s.w,s.h);
  for(let j=0;j<20;j++)for(let i=0;i<20;i++){const x=x0+(i+.5)*24+(r()-.5)*22,y=y0+(j+.5)*24+(r()-.5)*22;const q=r(),q2=r();
    const t=terr(x,y);
    if(t.k==='beach'){if(q<.05)dr(DEC.shell[(q2*2)|0],x,y);else if(q<.08)dr(DEC.pebble[(q2*4)|0],x,y);continue}
    if(t.k==='road'){if(q<.05)dr(DEC.pebble[(q2*4)|0],x,y);continue}
    if(t.k==='river'||t.k==='water'){if(q<.12&&t.depth<12)dr(DEC.pebble[(q2*4)|0],x,y);continue}
    if(t.k!=='land')continue;
    if(bil(ROAD,x,y)<6)continue;
    const J=t.J,F=t.F,M=Math.max(0,1-J-F);
    if(t.h>.55&&q<.25){dr(DEC.pebble[(q2*4)|0],x,y);continue}
    if(J>.4){if(q<.22)dr(DEC.minifern[(q2*3)|0],x,y);else if(q<.42)dr(DEC.leaf[(q2*4)|0],x,y);else if(q<.6)dr(DEC.jtuft[(q2*4)|0],x,y);else if(q<.62)dr(DEC.mush[(q2*2)|0],x,y)}
    else if(F>M){if(q<.2)dr(DEC.leaf[(q2*4)|0],x,y);else if(q<.42)dr(DEC.jtuft[(q2*4)|0],x,y);else if(q<.47)dr(DEC.mush[(q2*2)|0],x,y);else if(q<.55)dr(DEC.minifern[(q2*3)|0],x,y)}
    else{if(q<.42)dr(DEC.tuft[(q2*6)|0],x,y);else if(q<.5)dr(DEC.flower[(q2*4)|0],x,y);else if(q<.53)dr(DEC.pebble[(q2*4)|0],x,y)}}
  // shadows from trees, rocks and bushes in this and neighbouring cells (sun from the north-west)
  g.fillStyle='rgba(8,30,12,.26)';
  for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){const cxx=cx+ox,cyy=cy+oy;if(cxx<0||cyy<0||cxx>=WW/CELL||cyy>=WH/CELL)continue;const c=cellObjs(cxx,cyy);
    for(const t of c.trees){const hh=t.type==='conifer'?TREES.conifer[t.v].trunk.h*.5:t.h;g.beginPath();g.ellipse(t.x+hh*.38,t.y+hh*.1,t.R*(t.type==='conifer'?.7:1),t.R*.62,.25,0,TAU);g.fill();
      g.beginPath();g.ellipse(t.x+hh*.19,t.y+hh*.05,hh*.22,4,.26,0,TAU);g.fill()}
    for(const k of c.rocks){g.beginPath();g.ellipse(k.x+k.r*.5,k.y+k.r*.2,k.r*1.2,k.r*.55,.2,0,TAU);g.fill()}}}

const seaOK=(x,y)=>{const t=terr(x,y);return t.k==='deep'&&!t.lake&&bil(LAND,x,y)<-160};
function spawnAll(){
  S.dinos=[];dinoId=0;
  const put=(sp,cx,cy,R,o)=>{const[x,y]=findSpot(cx,cy,R,SPECIES[sp].water?seaOK:landOK,dinoId*31+7);return mkDino(sp,x,y,{...o,home:o?.home||R+600})};
  put('trex',5200,5600,500,{home:1500});
  put('spino',2650,5300,300,{home:900});
  for(let i=0;i<3;i++)put('raptor',3100,8100,200,{herd:'r1',home:900});
  put('trike',7800,8100,200);put('trike',8600,7500,200);put('trike',6900,6600,200);
  put('stego',4300,3950,250);put('stego',8250,3800,250);
  put('apato',6500,5750,250,{home:700});put('apato',7900,5950,250,{home:700});put('apato',7600,4250,250,{home:700});
  for(let i=0;i<5;i++)put('para',8250,4950,220,{herd:'p1',home:800});
  for(let i=0;i<8;i++)put('galli',7300,8650,260,{herd:'g1',home:1100});
  put('mosa',10750,8900,300,{home:900});
  S.pteras=[];for(let f=0;f<2;f++)for(let i=0;i<4;i++){const c=f?[LAKE.cx,LAKE.cy]:[5400,2600];S.pteras.push({cx:c[0],cy:c[1],R:f?700:1000,ang:i*.5+f*2,spd:(f?.11:.08)*(i%2?1:1.1),off:i*36,x:0,y:0,z:230+i*20,a:0,fr:5+i,seed:i*1.7,flap:0,sc:1,id:'pt'+f+i})}
}
function spawnPicks(){
  S.picks=[];const r=rng(99);let id=0;
  const add=(kind,test,n)=>{let k=0,tries=0;while(k<n&&tries<4000){tries++;const x=800+r()*10400,y=800+r()*10400;if(!test(x,y))continue;if(nearCabin(x,y,200))continue;
    let blocked=false;forCells(x,y,30,c=>{for(const s of c.trees)if(dist(s.x,s.y,x,y)<s.r+18)blocked=true;for(const s of c.rocks)if(dist(s.x,s.y,x,y)<s.r+18)blocked=true});if(blocked)continue;
    const pid=kind+(id++);if(S.taken&&S.taken.has(pid))continue;S.picks.push({id:pid,kind,x,y,ph:r()*TAU});k++}};
  add('darts',(x,y)=>{const rd=bil(ROAD,x,y);return rd>8&&rd<40&&landOK(x,y)},14);
  add('medkit',(x,y)=>{const rd=bil(ROAD,x,y);return rd>8&&rd<60&&landOK(x,y)},5);
  add('amber',(x,y)=>{const t=terr(x,y);return t.k==='land'&&(bil(RIV,x,y)<120||t.h>.45)&&bil(RIV,x,y)>10},16);
  add('fossil',(x,y)=>{const t=terr(x,y);return(t.k==='beach'&&bil(LAND,x,y)>40)||(t.k==='land'&&t.h>.5)},16);
  // one of each right by the cabin so the loop is easy to discover
  S.picks.push({id:'start-amber',kind:'amber',x:CABIN.x-210,y:CABIN.y+150,ph:0},{id:'start-darts',kind:'darts',x:CABIN.x+170,y:CABIN.y+210,ph:1});
  if(S.taken)S.picks=S.picks.filter(p=>!S.taken.has(p.id))}

/* ---------- particles ---------- */
function part(o){S.parts.push(Object.assign({x:0,y:0,z:0,vx:0,vy:0,vz:0,life:1,max:1,type:'dust',size:6,col:'#c8b080',g:0},o));if(S.parts.length>600)S.parts.splice(0,S.parts.length-600)}
function updParts(dt){for(let i=S.parts.length-1;i>=0;i--){const p=S.parts[i];p.life-=dt;if(p.life<=0){S.parts.splice(i,1);continue}
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vz-=p.g*dt;if(p.z<0&&p.g){p.z=0;p.vz=0;p.vx*=.5;p.vy*=.5}
  if(p.type==='dust'||p.type==='smoke'){p.vx*=1-dt*1.5;p.vy*=1-dt*1.5}}}
function drawPart(p){const k=p.life/p.max;
  if(p.type==='dust'||p.type==='smoke'){ctx.globalAlpha=k*(p.type==='smoke'?.35:.45);dot(p.x,p.y-p.z,p.size*(1.8-k),p.col);ctx.globalAlpha=1}
  else if(p.type==='leaf'){ctx.save();ctx.translate(p.x,p.y-p.z);ctx.rotate(p.life*6+p.size);ell(0,0,3,1.5,p.col);ctx.restore()}
  else if(p.type==='splash'){ctx.globalAlpha=Math.min(1,k*1.5);dot(p.x,p.y-p.z,p.size*(.6+k*.4),p.col);ctx.globalAlpha=1}
  else if(p.type==='ring'){ctx.globalAlpha=k*.7;ctx.strokeStyle=p.col;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(p.x,p.y,Math.max(0,p.size*(1-k)+4),Math.max(0,(p.size*(1-k)+4)*.45),0,0,TAU);ctx.stroke();ctx.globalAlpha=1}
  else if(p.type==='zzz'){ctx.globalAlpha=Math.min(1,k*2);ctx.font=`700 ${p.size}px Fredoka,system-ui,sans-serif`;ctx.fillStyle='#fff';ctx.strokeStyle='rgba(20,40,60,.8)';ctx.lineWidth=3;ctx.strokeText('z',p.x,p.y-p.z);ctx.fillText('z',p.x,p.y-p.z);ctx.globalAlpha=1}
  else if(p.type==='spark'){ctx.globalAlpha=k;ctx.strokeStyle=p.col;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y-p.z);ctx.lineTo(p.x-p.vx*.03,p.y-p.z-p.vy*.03+p.vz*.03);ctx.stroke();ctx.globalAlpha=1}
  else if(p.type==='text'){ctx.globalAlpha=Math.min(1,k*2);ctx.font='700 15px Fredoka,system-ui,sans-serif';ctx.textAlign='center';ctx.lineJoin='round';ctx.lineWidth=4;ctx.strokeStyle='rgba(10,30,20,.85)';ctx.strokeText(p.txt,p.x,p.y-p.z);ctx.fillStyle=p.col;ctx.fillText(p.txt,p.x,p.y-p.z);ctx.textAlign='left';ctx.globalAlpha=1}}
function burst(x,y,type,n,o={}){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=(o.spd||60)*(.4+Math.random());part({x,y,z:o.z||0,vx:Math.cos(a)*s,vy:Math.sin(a)*s*.6,vz:(o.up||0)*(.5+Math.random()),g:o.g||0,life:(o.life||.8)*(.6+Math.random()*.6),max:o.life||.8,type,size:o.size||5,col:Array.isArray(o.col)?o.col[(Math.random()*o.col.length)|0]:o.col||'#c8b080'})}}

/* ---------- the ranger ---------- */
const RANGER={shirt:'#cdb57e',shirtD:'#a8905c',pants:'#5d6a3c',boots:'#4a3424',skin:'#e2b088',hat:'#d8c38a',hatD:'#b39c62',band:'#5a3a20',pack:'#55693a',packD:'#3e4f29'};
function drawRanger(x,y,a,t,o={}){ctx.save();ctx.translate(x,y);ctx.scale(1.15,1.15);ctx.translate(-x,-y);drawRanger0(x,y,a,t,o);ctx.restore()}
function drawRanger0(x,y,a,t,o){
  const R=RANGER,fx=Math.cos(a),fy=Math.sin(a),lx=-fy,ly=fx;
  const cr=o.sneak?4:0,mv=o.moving||0,sw=Math.sin(o.phase||0)*mv;
  const z0=o.z||0;y-=z0;
  if(!o.seated&&!o.swim)ell(x+2,y+z0+1,10,4.2,'rgba(10,25,10,.32)');
  if(o.hurt>0&&Math.sin(t*40)>0)ctx.globalAlpha=.55;
  const hipY=y-15+cr;
  // legs
  if(!o.seated&&!o.swim){const legs=[-1,1].map(s=>{const st=sw*s,lift=Math.max(0,st)*3;
      const hx=x+lx*3.4*s,hy=hipY+ly*1.4*s,fx2=x+lx*3.8*s+fx*st*7,fy2=y+ly*1.6*s+fy*st*3.5-lift;
      return{s,hx,hy,fx2,fy2,kx:(hx+fx2)/2+fx*2.5,ky:(hy+fy2)/2+fy*1.2-1,dep:ly*s}});
    legs.sort((p,q)=>p.dep-q.dep);
    for(const L of legs){ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=L.dep<0?shade(R.pants,-.18):R.pants;ctx.lineWidth=5.2;ctx.beginPath();ctx.moveTo(L.hx,L.hy);ctx.lineTo(L.kx,L.ky);ctx.lineTo(L.fx2,L.fy2-2);ctx.stroke();
      ell(L.fx2+fx*1.6,L.fy2,3.8,2.4,R.boots)}}
  const bw=9.5+4*Math.abs(fy),top=y-31+cr,bot=hipY+1;
  const packFirst=fy>-.25;
  const drawPack=()=>{const px=x-fx*5.5,py=y-24+cr-fy*1.5;ctx.fillStyle=R.packD;ctx.beginPath();ctx.roundRect(px-6.2,py-7.5,12.4,15,4);ctx.fill();ctx.fillStyle=R.pack;ctx.beginPath();ctx.roundRect(px-5.6,py-7.5,11.2,12.5,4);ctx.fill();
    ctx.fillStyle=R.packD;ctx.fillRect(px-5.6,py-3,11.2,2);ell(px,py-7.6,5,2,'#6e824a')};
  const drawGun=()=>{if(o.swim||(o.seated&&!o.aimT))return;const hx=x+fx*5+lx*2,hy=y-22+cr+fy*2.5;const ex=hx+fx*21,ey=hy+fy*21*.62;const bx=hx-fx*7,by=hy-fy*7*.62;
    ctx.lineCap='round';limb(bx,by,ex,ey,'#2c3236',4.2);limb(hx,hy,ex+fx*4,ey+fy*2.5,'#454d52',2.2);limb(bx,by,hx-fx*1,hy-fy*.6,'#7a4e2c',5);
    dot(lerp(hx,ex,.35),lerp(hy,ey,.35)-2.4,1.8,'#1c2124');limb(lerp(hx,ex,.55),lerp(hy,ey,.55),lerp(hx,ex,.7),lerp(hy,ey,.7),'#ff9f1c',4.4);
    // arms
    const shR=[x+lx*5.5,top+3+ly*1.5],shL=[x-lx*5.5,top+3-ly*1.5];
    limb(shR[0],shR[1],hx,hy,R.shirtD,4);limb(shL[0],shL[1],lerp(hx,ex,.45),lerp(hy,ey,.45),R.shirt,4);dot(hx,hy,2.2,R.skin);dot(lerp(hx,ex,.45),lerp(hy,ey,.45),2.2,R.skin)};
  if(packFirst)drawPack();
  if(fy<-.1)drawGun();
  if(!o.swim){ // torso
    const g=ctx.createLinearGradient(x-bw/2,0,x+bw/2,0);g.addColorStop(0,shade(R.shirt,.12));g.addColorStop(.6,R.shirt);g.addColorStop(1,R.shirtD);
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x-bw/2,top,bw,bot-top,[5,5,3,3]);ctx.fill();
    ctx.fillStyle='#4a3020';ctx.fillRect(x-bw/2,bot-4,bw,2.6);
    if(fy>.3){ctx.fillStyle=R.shirtD;ctx.fillRect(x-4.4,top+5,3.2,2.6);ctx.fillRect(x+1.2,top+5,3.2,2.6);ctx.fillStyle='#e8dcb8';ctx.beginPath();ctx.moveTo(x-3,top);ctx.lineTo(x,top+3.5);ctx.lineTo(x+3,top);ctx.fill()}
  }
  if(!packFirst)drawPack();
  if(fy>=-.1)drawGun();
  // head
  const hx=x,hy=y-37+cr;
  ctx.fillStyle=shade(R.skin,-.15);ctx.fillRect(hx-2,hy+4,4,4);
  dot(hx,hy,6.2,R.skin);
  if(fy<-.3){ctx.fillStyle='#6a4428';ctx.beginPath();ctx.arc(hx,hy+1,6,0,PI);ctx.fill()}
  for(const s of[-1,1]){const vy=fy+ly*s*.8;if(vy<-.15)continue;const ex=hx+fx*2.4+lx*2.3*s,ey=hy+.8+fy*1.4+ly*.8*s;
    if(o.sleep){ctx.strokeStyle='#3a2414';ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(ex-1.2,ey);ctx.lineTo(ex+1.2,ey);ctx.stroke()}else{ell(ex,ey,1,1.3,'#2a1a10');dot(ex+.3,ey-.4,.35,'#fff')}}
  if(fy>-.3)dot(hx+fx*4.2,hy+2.2+fy*1.2,1,shade(R.skin,-.2));
  // safari hat
  ell(hx,hy-3.2,11.2,4.8,R.hatD);ell(hx,hy-3.8,10.6,4.3,R.hat);
  ctx.fillStyle=R.hatD;ctx.beginPath();ctx.ellipse(hx,hy-6.6,6.6,4.6,0,PI,TAU);ctx.fill();ctx.fillRect(hx-6.6,hy-6.6,13.2,2.6);
  ctx.fillStyle=R.hat;ctx.beginPath();ctx.ellipse(hx-.6,hy-7.2,5.8,4.2,0,PI,TAU);ctx.fill();
  ctx.fillStyle=R.band;ctx.fillRect(hx-6.6,hy-5.4,13.2,1.8);
  if(o.swim){ctx.strokeStyle='rgba(235,250,250,.75)';ctx.lineWidth=2;const ph=(t*1.6)%1;ctx.beginPath();ctx.ellipse(x,y-4,12+ph*8,5+ph*3,0,0,TAU);ctx.stroke()}
  ctx.globalAlpha=1}

/* ---------- movement helpers ---------- */
function bushTouch(x,y,r,spd){let n=0;forCells(x,y,r+40,c=>{for(const b of c.bushes){if(Math.abs(b.x-x)>b.R+r||Math.abs(b.y-y)>b.R+r)continue;if(dist(b.x,b.y,x,y)<b.R*.75+r){b.rs=Math.max(b.rs,Math.min(1,spd/140));n++;
  if(spd>200&&Math.random()<.08)part({x:b.x,y:b.y,z:12,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*50,vz:40,g:120,life:.9,max:.9,type:'leaf',col:'#4a9a3a',size:Math.random()*6})}}});return n}
function listener(){return S.mode==='jeep'?S.jeep:S.p}
function hurtPlayer(dmg,fx,fy){if(S.god||S.inside)return;const p=S.p;p.hp-=dmg;p.hurtT=.6;p.regenT=5;S.shake=Math.max(S.shake,10);SFX.hurt();$('hurt').style.opacity=.9;setTimeout(()=>$('hurt').style.opacity=0,250);
  if(S.mode==='foot'){const d=dist(fx,fy,p.x,p.y)||1;p.kx=(p.x-fx)/d*360;p.ky=(p.y-fy)/d*360}
  else{const j=S.jeep;const d=dist(fx,fy,j.x,j.y)||1;j.x+=(j.x-fx)/d*20;j.y+=(j.y-fy)/d*20;j.v*=.4;j.bump=1}
  updHud();if(p.hp<=0)knockout()}
function knockout(){if(S.ko)return;S.ko=true;toast('You were knocked out…');
  if(S.land==='city'){blackout(()=>{S.p.hp=100;S.mode='foot';S.p.x=CITY.inst.x0+650;S.p.y=CITY.inst.y1+70;S.p.a=PI/2;S.p.kx=S.p.ky=0;S.ko=false;S.cam.x=S.p.x;S.cam.y=S.p.y;for(const d of S.dinos)if(d.state==='chase'||d.state==='attack'){d.state='idle';d.stT=4}updHud();setTimeout(()=>toast('Institute medics patched you up'),700)},1.2);return}
  blackout(()=>{S.p.hp=100;S.mode='foot';S.jeep.x=6330;S.jeep.y=9760;S.jeep.a=-PI/2;S.jeep.v=0;
  enterCabin(true);S.ip.x=96;S.ip.y=150;S.ip.sit='bed';S.ko=false;S.p.kx=S.p.ky=0;
  for(const d of S.dinos){if(d.state==='chase'||d.state==='attack'){d.state='idle';d.stT=4}}
  setTimeout(()=>toast('You wake up back in your cabin'),700)},1.2)}

/* ---------- on foot ---------- */
function updFoot(dt,inp){const p=S.p;
  let spd=p.sneak?82:150;const t=terr(p.x,p.y);
  p.swim=t.k==='deep'?1:0;p.wade=(t.k==='river'||t.k==='water')?1:0;
  if(p.swim)spd=82;else if(p.wade)spd*=.62;
  if(!p.swim&&!p.wade&&bushTouch(p.x,p.y,8,inp.m*spd))spd*=.86;
  p.v=inp.m*spd;
  if(inp.m>0){if(p.shotT<=0)p.a+=angDiff(p.a,Math.atan2(inp.y,inp.x))*Math.min(1,dt*14);
    p.phase+=dt*p.v/9;
    let nx=p.x+inp.x*p.v*dt,ny=p.y+inp.y*p.v*dt;
    if(!walkable2(nx,ny)){if(walkable2(nx,p.y))ny=p.y;else if(walkable2(p.x,ny))nx=p.x;else{nx=p.x;ny=p.y}}
    p.x=nx;p.y=ny;
    if(p.wade&&Math.random()<dt*8)part({x:p.x,y:p.y,type:'ring',life:.8,max:.8,size:16,col:'rgba(235,250,250,.9)'});
  }
  if(p.kx){p.x+=p.kx*dt;p.y+=p.ky*dt;p.kx*=1-dt*6;p.ky*=1-dt*6;if(Math.abs(p.kx)+Math.abs(p.ky)<5)p.kx=p.ky=0;if(!walkable2(p.x,p.y)){p.x-=p.kx*dt;p.y-=p.ky*dt;p.kx=p.ky=0}}
  collideSolids(p,9);
  p.x=clamp(p.x,200,WW-200);p.y=clamp(p.y,200,WH-200);
  // walk through the cabin door
  if(S.land==='island'&&inp.y<-.4&&Math.abs(p.x-CABIN.x)<26&&p.y<CABIN.y+22&&p.y>CABIN.y-2)enterCabin();
}
function walkable2(x,y){const t=terr(x,y);return t.k!=='cliff'}

/* ---------- jeep ---------- */
const JEEP={body:'#d8c088',bodyD:'#b49c62',stripe:'#2f6a3a',dark:'#262626',seat:'#4a3a2a',top:180};
function jeepCircles(j,x=j.x,y=j.y){const ca=Math.cos(j.a),sa=Math.sin(j.a);return(j.type==='truck'?[-84,-42,0,42,84]:[-38,0,38]).map(u=>[x+ca*u,y+sa*u])}
function jeepTerrBlocked(j,x,y){for(const[cx,cy] of jeepCircles(j,x,y)){const t=terr(cx,cy);if(t.k==='cliff'||t.k==='deep')return true}return false}
function jeepBlocked(j,x,y){if(jeepTerrBlocked(j,x,y))return true;
  const probe={x:0,y:0};for(const[cx,cy] of jeepCircles(j,x,y)){probe.x=cx;probe.y=cy;if(collideSolids(probe,j.type==='truck'?28:24))return true}return false}
function terrMult(t){if(t.k==='road'||t.k==='bridge')return 1;if(t.k==='beach')return .74;if(t.k==='river')return .45;if(t.k==='water')return .34;if(t.k!=='land')return .5;
  return(1-t.J*.36-t.F*.28)*(t.h>.55?.7:1)*.86}
function updJeep(dt,inp){const j=S.jeep;const t=terr(j.x,j.y);const truck=j.type==='truck';const maxV=(truck?430:520)*terrMult(t);const CU=truck?[-84,-42,0,42,84]:[-38,0,38],CR=truck?28:24;
  const ca=Math.cos(j.a),sa=Math.sin(j.a);let target=0,steer=0;
  if(inp.m>.1){const ta=Math.atan2(inp.y,inp.x);let diff=angDiff(j.a,ta);
    if(Math.abs(diff)>2.3&&j.v<40){j.rev=true}else if(Math.abs(diff)<1.4)j.rev=false;
    if(j.rev){diff=angDiff(j.a+PI,ta);target=-maxV*.45*inp.m;steer=-clamp(diff*2.2,-1,1)}
    else{target=maxV*inp.m*(1-Math.min(.55,Math.abs(diff)/PI));steer=clamp(diff*2.2,-1,1)}}
  j.steer+=(steer-j.steer)*Math.min(1,dt*8);
  const acc=target>j.v?(j.v<0?600:340):(j.v>0?560:300);j.v+=clamp(target-j.v,-acc*dt,acc*dt);
  j.a+=j.steer*2.3*dt*clamp(Math.abs(j.v)/140,0,1)*Math.sign(j.v||1);
  const nx=j.x+Math.cos(j.a)*j.v*dt,ny=j.y+Math.sin(j.a)*j.v*dt;
  const crash=()=>{if(Math.abs(j.v)>160){S.shake=Math.max(S.shake,8);SFX.thud(j.x,j.y,.6);burst(j.x+ca*48,j.y+sa*48,'dust',8,{col:'#b8a070',spd:90,life:.7})}j.v*=-.25};
  // in the city, glance off building walls instead of stopping dead
  let bx2=nx,by2=ny;if(jeepTerrBlocked(j,nx,ny)&&S.land==='city'){if(!jeepTerrBlocked(j,nx,j.y)){by2=j.y;j.v*=.97}else if(!jeepTerrBlocked(j,j.x,ny)){bx2=j.x;j.v*=.97}}
  if(jeepTerrBlocked(j,bx2,by2))crash();
  else if(bx2!==nx||by2!==ny){j.x=bx2;j.y=by2}
  else{const ox=j.x,oy=j.y;j.x=nx;j.y=ny;
    // slide around tree trunks and boulders instead of stopping dead
    let px=0,py=0;const pr={x:0,y:0};const ca2=Math.cos(j.a),sa2=Math.sin(j.a);
    for(const u of CU){pr.x=j.x+ca2*u;pr.y=j.y+sa2*u;const bx=pr.x,by=pr.y;if(collideSolids(pr,CR)){j.x+=pr.x-bx;j.y+=pr.y-by;px+=pr.x-bx;py+=pr.y-by}}
    if(px||py){const pl=Math.hypot(px,py)||1;const head=-(px*ca2+py*sa2)*Math.sign(j.v||1)/pl;
      // nose into a trunk: ease sideways around it rather than stopping dead

function pickTarget(ox,oy,face){let best=null,bs=1e9;

    const da=Math.abs(angDiff(face,Math.atan2(d.y-oy,d.x-ox)));const sc=dd+da*420+(d.lie>.5?600:0);if((da<.75||dd<420)&&sc<bs){bs=sc;best=d}}
  return best}
function doFire(){if(S.inside||S.reload>0)return;if(S.p.swim){toast("Can't shoot while swimming");return}
  if(S.ammo<=0){SFX.empty();toast('Out of darts. Open a dart box from your pack.');return}
  const inJeep=S.mode==='jeep';const o=inJeep?S.jeep:S.p;let face=inJeep?S.jeep.a:S.p.a;
  const tg=pickTarget(o.x,o.y,face);let ang=face;
  if(tg){const sp=SPECIES[tg.sp],s=tg.scale;const cx=tg.x+Math.cos(tg.a)*(sp.u0+sp.len*.55)*s*.3,cy=tg.y+Math.sin(tg.a)*(sp.u0+sp.len*.55)*s*.3;

  if(!inJeep){S.p.a=ang;S.p.shotT=.5}
  const sx=o.x+Math.cos(ang)*(inJeep?20:26),sy=o.y+Math.sin(ang)*(inJeep?20:26);
  S.shots.push({x:sx,y:sy,z:inJeep?44:22,vx:Math.cos(ang)*1050,vy:Math.sin(ang)*1050,life:.75,a:ang});
  S.ammo--;S.reload=.75;SFX.dart();updHud();
  for(const d of S.dinos)if(dist(d.x,d.y,o.x,o.y)<360&&SPECIES[d.sp].diet==='herb'&&d.lie<.5&&d.sp!=='trike')startle(d,o.x,o.y,.6)}
function updShots(dt){for(let i=S.shots.length-1;i>=0;i--){const s=S.shots[i];s.life-=dt;const steps=3;let hit=null;
  for(let k=0;k<steps&&!hit;k++){s.x+=s.vx*dt/steps;s.y+=s.vy*dt/steps;
    for(const d of S.dinos){if(d.pen)continue;const sp=SPECIES[d.sp];if(Math.abs(d.x-s.x)>sp.len*d.scale*.7+30||Math.abs(d.y-s.y)>sp.len*d.scale*.7+30)continue;
      const B=d.B||buildBeads(d,S.t);for(let bi=0;bi<B.length;bi+=2){const b=B[bi];if(Math.hypot(b.X-s.x,b.Y-s.y)<b.r+7){hit={d,bi};break}}if(hit)break}}
  if(hit){S.shots.splice(i,1);dartHit(hit.d,hit.bi,s);continue}
  const t=terr(s.x,s.y);
  let blocked=t.k==='cliff';if(!blocked)forCells(s.x,s.y,20,c=>{for(const tr of c.trees)if(Math.abs(tr.x-s.x)<tr.r+3&&Math.abs(tr.y-s.y)<tr.r+3)blocked=true});

/* ---------- loop & boot ---------- */
let lastT=0,frames=0,fpsT=0,FPS=60;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-lastT)/1000||0);lastT=now;
  frames++;fpsT+=dt;if(fpsT>1){FPS=frames/fpsT;frames=0;fpsT=0}
  try{if(!titleEl.hidden)titleCam(dt);else if(!paused()&&!S.ko)update(dt);else if(S.ko)updParts(dt);draw(now/1000)}catch(e){console.error(e)}}
// behind the title card the camera drifts over the meadow while the herds go about their day
function titleCam(dt){S.t+=dt;updDinos(dt);const h=HERDS.g1||{x:7300,y:8600};const tx=h.x+Math.sin(S.t*.05)*160,ty=h.y-40;if(!S.titleCam){S.titleCam=1;S.cam.x=tx;S.cam.y=ty}S.cam.x+=(tx-S.cam.x)*dt*.4;S.cam.y+=(ty-S.cam.y)*dt*.4;S.cam.z=VW<600?.8:1;
  for(const d of S.dinos)d.B=Math.abs(d.x-S.cam.x)<VW+400&&Math.abs(d.y-S.cam.y)<VH+400?buildBeads(d,S.t):null;updParts(dt)}

  setTimeout(()=>{try{
    genTerrain();findFalls();makeMini();MINI_ISLAND=MINI;makeTreeSprites();makeBushSprites();makeRockSprites();makeDecals();makeCabinSprite();makeRoomBg();makeWaterPats(mainCtx);makeClouds();genCity();
    S=freshState();loadSave();spawnAll();spawnPicks();
    const hot=window.claude?.hot;const restore=data=>{try{if(data&&data.p){Object.assign(S.p,data.p);Object.assign(S.jeep,data.jeep||{});S.mode=data.mode||'foot';S.ammo=data.ammo??S.ammo;S.bag=data.bag||S.bag;S.chest=data.chest||S.chest;S.guide=data.guide||S.guide;
      if(data.started){titleEl.hidden=true;S.cam.x=S.p.x;S.cam.y=S.p.y}}}catch(e){console.error(e)}};

function blockAt(x,y){let i=0,j=0;while(i<7&&x>RX[i+1])i++;while(j<6&&y>RY[j+1])j++;return[i,j]}

function cityKind(x,y){if(x<0||y<0||x>CW||y>CH)return'wall';

  case'cont':{const c=p.c,w=c.x1-c.x0,d=c.y1-c.y0;ctx.fillStyle=shade(c.col,.12);ctx.fillRect(c.x0,c.y0-c.H,w,d);ctx.fillStyle=c.col;ctx.fillRect(c.x0,c.y1-c.H,w,c.H);
    ctx.strokeStyle='rgba(0,0,0,.22)';ctx.lineWidth=2;for(let x=c.x0+6;x<c.x1;x+=9){ctx.beginPath();ctx.moveTo(x,c.y1-c.H+4);ctx.lineTo(x,c.y1-3);ctx.stroke()}
    ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(c.x0,c.y0-c.H,w,3);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(c.x0,c.y1-3,w,3);ctx.fillRect(c.x1-4,c.y1-c.H,4,c.H);break}
  case'cage':{const c=p.c,w=c.x1-c.x0,d=c.y1-c.y0,H=64;ctx.fillStyle='#6a5a44';ctx.fillRect(c.x0,c.y0,w,d);ctx.fillStyle='rgba(60,40,20,.5)';for(let i=0;i<6;i++)ctx.fillRect(c.x0+8+i*w/6,c.y0+6,3,d-12);
    ctx.strokeStyle='#4a5256';ctx.lineWidth=2.5;for(let x=c.x0;x<=c.x1;x+=10){if(c.broken&&x>c.x0+w*.3&&x<c.x0+w*.7)continue;ctx.beginPath();ctx.moveTo(x,c.y0);ctx.lineTo(x,c.y0-H);ctx.moveTo(x,c.y1);ctx.lineTo(x,c.y1-H);ctx.stroke()}
    ctx.lineWidth=4;ctx.strokeRect(c.x0,c.y0-H,w,d);ctx.beginPath();ctx.moveTo(c.x0,c.y1);ctx.lineTo(c.x1,c.y1);ctx.stroke();
    if(c.broken){ctx.lineWidth=3;ctx.strokeStyle='#5a6266';for(let k=0;k<4;k++){const x=c.x0+w*.32+k*8;ctx.beginPath();ctx.moveTo(x,c.y1);ctx.quadraticCurveTo(x+18+k*4,c.y1-H*.5,x+30+k*8,c.y1-H*.9+k*6);ctx.stroke()}
      ctx.strokeStyle='rgba(40,30,20,.6)';ctx.lineWidth=2;for(let k=0;k<3;k++){ctx.beginPath();ctx.moveTo(c.x0+10+k*7,c.y1-H*.7);ctx.lineTo(c.x0+22+k*7,c.y1-H*.3);ctx.stroke()}}
    else{const cx=(c.x0+c.x1)/2;ctx.fillStyle='#c8402e';ctx.fillRect(cx-16,c.y1-H*.55,32,14);ctx.fillStyle='#fff';ctx.font='700 8px Fredoka,system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('LOCKED',cx,c.y1-H*.55+10);ctx.textAlign='left'}break}
  case'sign':{ctx.fillStyle='#3a3a3a';ctx.fillRect(p.x-2,p.y-60,4,60);ctx.fillRect(p.x+176,p.y-60,4,60);ctx.fillStyle='#ffd23a';ctx.fillRect(p.x-6,p.y-80,192,28);ctx.fillStyle='#1a1a1a';ctx.font='700 12px Fredoka,system-ui,sans-serif';ctx.fillText(p.txt,p.x+2,p.y-61);break}
  case'fountain':{const x=p.x,y=p.y-40;ell(x,y+10,92,40,'#8a8276');ell(x,y+4,86,36,'#a89e8e');ell(x,y+6,76,30,'#3f9aa8');
    ctx.save();ctx.beginPath();ctx.ellipse(x,y+6,76,30,0,0,TAU);ctx.clip();ctx.strokeStyle='rgba(235,250,250,.6)';ctx.lineWidth=2;for(let k=0;k<3;k++){const ph=(t*.6+k/3)%1;ctx.beginPath();ctx.ellipse(x,y+6,10+ph*66,4+ph*26,0,0,TAU);ctx.stroke()}ctx.restore();
    ctx.fillStyle='#b8ae9e';ctx.fillRect(x-8,y-50,16,56);ell(x,y-50,24,9,'#c8beae');
    for(let k=0;k<12;k++){const a=k/12*TAU+t;ctx.strokeStyle='rgba(220,245,250,.75)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y-58);ctx.quadraticCurveTo(x+Math.cos(a)*30,y-90,x+Math.cos(a)*44,y-46+Math.sin(a)*14);ctx.stroke()}
    // a small bronze statue of a sauropod on the column
    ctx.fillStyle='#7a5a3a';ctx.beginPath();ctx.ellipse(x,y-62,14,7,0,0,TAU);ctx.fill();limb(x+10,y-64,x+20,y-84,'#7a5a3a',4);limb(x-10,y-62,x-22,y-58,'#7a5a3a',3);break}
  case'trough':{ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(p.x-34,p.y-4,74,10);ctx.fillStyle='#6a6e70';ctx.fillRect(p.x-36,p.y-20,72,18);ctx.fillStyle='#4f9aa8';ctx.fillRect(p.x-31,p.y-18,62,6);break}
  case'pensign':{const sp=SPECIES[p.sp];ctx.fillStyle='#3a3a3a';ctx.fillRect(p.x-2,p.y-40,4,40);ctx.fillStyle='#1d8a86';ctx.beginPath();ctx.roundRect(p.x-56,p.y-62,112,26,6);ctx.fill();ctx.fillStyle='#fff';ctx.font='700 12px Fredoka,system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(sp.short.toUpperCase(),p.x,p.y-45);ctx.textAlign='left';break}
  case'fence':{const H=p.big?52:40;ctx.strokeStyle=p.big?'#4a5054':'#7a5a3a';ctx.lineWidth=2;
    const L=Math.hypot(p.nx-p.px,p.ny-p.py);if(L<80){for(const h of(p.big?[16,32,48]:[14,30])){ctx.beginPath();ctx.moveTo(p.px,p.py-h);ctx.lineTo(p.nx,p.ny-h);ctx.stroke()}
      if(p.big){ctx.strokeStyle='rgba(80,90,95,.35)';ctx.lineWidth=1;for(let k=0;k<L;k+=6){const x=lerp(p.px,p.nx,k/L),y=lerp(p.py,p.ny,k/L);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-H);ctx.stroke()}}}
    ctx.fillStyle=p.big?'#3a4044':'#6a4a2e';ctx.fillRect(p.px-2.5,p.py-H,5,H);break}}}
function propSolidRect(p){return null}

/* ---------- pedestrians ---------- */
const LOOKS=[['#e2b088','#3a6aa0','#2a2a2a','#3a2414'],['#c08a5a','#c8402e','#3a3a4a','#1a1a1a'],['#8a5a3a','#e8e4da','#4a4a5a','#1a1a1a'],['#f0c8a0','#3f8a5a','#6a5a4a','#c89a4a'],['#e2b088','#e0a12c','#2a3a5a','#5a3a20'],
  ['#c08a5a','#7a4aa0','#2a2a2a','#2a1a10'],['#f0c8a0','#2a2a2a','#2a2a2a','#8a6a40'],['#8a5a3a','#c8d8e0','#4a4a4a','#1a1a1a'],['#e2b088','#a8c8b8','#5a4a3a','#6a4a2a']];
const NPCS=[];
function spawnNpcs(n){NPCS.length=0;const r=rng(31);for(let k=0;k<n;k++){const nd=CITY.nodes[(r()*CITY.nodes.length)|0];const p={x:nd.x+(r()-.5)*20,y:nd.y,a:r()*TAU,v:0,state:'walk',node:nd,tgt:null,look:LOOKS[(r()*LOOKS.length)|0],hat:r()<.2,bag:r()<.3,phase:r()*6,spd:55+r()*30,panicT:0,downT:0,seed:r()};pickNode(p);NPCS.push(p)}}
function nodeAt(i,j,sx,sy){return CITY.nodes.find(n=>n.i===i&&n.j===j&&n.sx===sx&&n.sy===sy)}
function pickNode(p){const n=p.node;const opts=[nodeAt(n.i,n.j,-n.sx,n.sy),nodeAt(n.i,n.j,n.sx,-n.sy),n.sx>0?nodeAt(n.i+1,n.j,-1,n.sy):nodeAt(n.i-1,n.j,1,n.sy),n.sy>0?nodeAt(n.i,n.j+1,n.sx,-1):nodeAt(n.i,n.j-1,n.sx,1)].filter(Boolean)
  .filter(o=>o!==p.prev&&cityKind((o.x+n.x)/2,(o.y+n.y)/2)==='road');p.prev=n;p.tgt=opts.length?opts[(Math.random()*opts.length)|0]:p.prev}
function nearestNode(x,y){let b=null,bd=1e9;for(const n of CITY.nodes){const d=Math.abs(n.x-x)+Math.abs(n.y-y);if(d<bd){bd=d;b=n}}return b}
const pedOK=(x,y)=>{const k=cityKind(x,y);return k==='road'||k==='grass'||k==='pier'};
function updNpcs(dt){const T=S.mode==='jeep'?S.jeep:null;
  for(const p of NPCS){
    if(p.state==='down'){p.downT-=dt;if(p.downT<=0){p.state='flee';p.panicT=3}continue}
    // nearest danger: an awake loose dinosaur or a speeding truck
    let fx=0,fy=0,danger=0;
    for(const d of S.dinos){if(d.pen||d.lie>.5)continue;const R=SPECIES[d.sp].len*d.scale*.6+230;const dd=dist(d.x,d.y,p.x,p.y);if(dd<R){fx+=(p.x-d.x)/dd;fy+=(p.y-d.y)/dd;danger=1}}
    if(T&&Math.abs(T.v)>90){const dd=dist(T.x,T.y,p.x,p.y);if(dd<140){fx+=(p.x-T.x)/dd;fy+=(p.y-T.y)/dd;danger=1}}
    if(danger){if(p.state!=='flee'&&Math.random()<.4)SFX.scream(p.x,p.y);p.state='flee';p.panicT=2.5+Math.random()*2;p.fa=Math.atan2(fy,fx)}
    let vx=0,vy=0;
    if(p.state==='flee'){p.panicT-=dt;const a=p.fa+Math.sin(S.t*2+p.seed*9)*.4;vx=Math.cos(a)*190;vy=Math.sin(a)*190;if(p.panicT<=0){p.state='walk';p.node=nearestNode(p.x,p.y);p.prev=null;p.tgt=p.node}}
    else{const g=p.tgt;const dx=g.x-p.x,dy=g.y-p.y,dd=Math.hypot(dx,dy);if(dd<8){p.node=g;pickNode(p)}else{vx=dx/dd*p.spd;vy=dy/dd*p.spd}}
    const nx=p.x+vx*dt,ny=p.y+vy*dt;
    if(pedOK(nx,ny)){p.x=nx;p.y=ny}else if(pedOK(nx,p.y))p.x=nx;else if(pedOK(p.x,ny))p.y=ny;else if(p.state==='flee')p.fa+=1.5;
    p.v=Math.hypot(vx,vy);if(p.v>1)p.a=Math.atan2(vy,vx);p.phase+=dt*p.v/8;
    // don't walk through the player
    if(S.mode==='foot'){const dd=dist(p.x,p.y,S.p.x,S.p.y);if(dd<18&&dd>.1){p.x=S.p.x+(p.x-S.p.x)/dd*18;p.y=S.p.y+(p.y-S.p.y)/dd*18}}}}
function drawPerson(p,t){const[skin,shirt,pants,hair]=p.look;const x=p.x,y=p.y;
  ell(x+2,y+1,8,3.5,'rgba(10,20,30,.3)');
  if(p.state==='down'){ctx.save();ctx.translate(x,y-5);ctx.rotate(PI/2*(p.seed<.5?1:-1));limb(-2,6,-3,14,pants,4.5);limb(2,6,3,14,pants,4.5);ctx.fillStyle=shirt;ctx.beginPath();ctx.roundRect(-5.5,-8,11,14,4);ctx.fill();dot(0,-12,5.2,skin);dot(0,-14,5.4,hair);ctx.restore();
    if(Math.sin(t*6)>0){ctx.fillStyle='#ffd23a';ctx.font='700 12px Fredoka,system-ui,sans-serif';ctx.fillText('✶',x-6,y-28)}return}
  const fx=Math.cos(p.a),fy=Math.sin(p.a),lx=-fy,ly=fx;const mv=clamp(p.v/80,0,1.6),sw=Math.sin(p.phase)*Math.min(1,mv);const run=p.state==='flee';
  for(const s of[-1,1]){const st=sw*s;limb(x+lx*3*s,y-13+ly*s,x+lx*3.3*s+fx*st*6,y+ly*1.4*s+fy*st*3-Math.max(0,st)*2,pants,4.5)}
  const top=y-29;ctx.fillStyle=shirt;ctx.beginPath();ctx.roundRect(x-5.5,top,11,16,[5,5,3,3]);ctx.fill();ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(x+2,top+2,3.5,14);
  if(run){for(const s of[-1,1]){limb(x+lx*5*s,top+3,x+lx*8*s,top-9+Math.sin(t*20+s)*2,shirt,3.5);dot(x+lx*8*s,top-10+Math.sin(t*20+s)*2,2,skin)}}
  else{for(const s of[-1,1]){const st=-sw*s;limb(x+lx*5.5*s,top+3,x+lx*6*s+fx*st*4,top+13+fy*st*2,shirt,3.3);dot(x+lx*6*s+fx*st*4,top+14+fy*st*2,1.8,skin)}
    if(p.bag){ctx.fillStyle='#5a3a24';ctx.fillRect(x+lx*7-3,top+12,7,6)}}
  const hy=y-35;dot(x,hy,5.4,skin);if(fy<-.2){dot(x,hy,5.5,hair)}else{ctx.fillStyle=hair;ctx.beginPath();ctx.arc(x,hy-1,5.6,PI,TAU);ctx.fill();for(const s of[-1,1]){if(fy+ly*s*.8<-.15)continue;dot(x+fx*2+lx*2*s,hy+.8+fy,run?1.1:.8,'#1a1a1a')}if(run)ell(x+fx*2,hy+3.2+fy,1.4,1.8,'#5a1a14')}
  if(p.hat){ell(x,hy-4,7,3,'#3a3a3a');ctx.fillStyle='#3a3a3a';ctx.fillRect(x-4,hy-9,8,5)}
  if(run&&Math.sin(t*8+p.seed*10)>.3){ctx.fillStyle='#fff';ctx.strokeStyle='rgba(20,20,20,.8)';ctx.lineWidth=3;ctx.font='800 14px Fredoka,system-ui,sans-serif';ctx.strokeText('!',x+7,hy-10);ctx.fillText('!',x+7,hy-10)}}

/* ---------- switching lands ---------- */
function spawnCity(){const L={dinos:[],pteras:[],picks:[],veh:{type:'truck',x:HELI_C.x+330,y:HELI_C.y+40,a:PI/2,v:0,steer:0,bump:0,rev:false,cargo:null}};
  const keep=S.dinos;S.dinos=L.dinos;const saveLand=S.land;S.land='city';
  const put=(sp,cx,cy,o={})=>{const[x,y]=findSpot(cx,cy,260,(a,b)=>cityWildOK(a,b),dinoId*13+5);const d=mkDino(sp,x,y,{home:o.home||700,herd:o.herd});return d};
  put('trex',2860,2860,{home:900});put('spino',1720,QUAY-200,{home:700});for(let k=0;k<3;k++)put('raptor',4760,4000,{herd:'cr',home:700});
  put('trike',1340,1340);put('trike',5500,3240);put('stego',2100,4380);put('apato',1720,2480,{home:500});put('para',960,3600);put('para',1100,3700);
  for(let k=0;k<3;k++)put('galli',3620,3620,{herd:'cg',home:800});
  for(const pz of S.pens)addPenned(pz.sp,pz.scale,pz.seed);
  const r=rng(77);let id=0;for(let k=0;k<16;k++){const nd=CITY.nodes[(r()*CITY.nodes.length)|0];const kind=k<11?'darts':k<14?'medkit':'amber';const pid='c-'+kind+(id++);if(S.taken&&S.taken.has(pid))continue;L.picks.push({id:pid,kind,x:nd.x+(r()-.5)*30,y:nd.y+(r()-.5)*20,ph:r()*6})}
  S.dinos=keep;S.land=saveLand;S.lands.city=L;spawnNpcs(70)}
function cityWildOK(x,y){const k=cityKind(x,y);if(k!=='road'&&k!=='grass')return false;if(CITY.inst&&inR(x,y,CITY.inst,60))return false;return y<QUAY-60}
function penFor(sp){return CITY.pens.find(p=>p.sp===sp)||CITY.pens[0]}
function addPenned(sp,scale,seed){const pen=penFor(sp);const d=mkDino(sp,(pen.x0+pen.x1)/2,(pen.y0+pen.y1)/2+30,{home:120});d.pen=pen;d.scale=scale||d.scale;d.hx=d.x;d.hy=d.y;if(seed)d.seed=seed;return d}
function setLand(name){if(S.land===name)return;
  const cur=S.lands[S.land]||(S.lands[S.land]={});Object.assign(cur,{dinos:S.dinos,pteras:S.pteras,picks:S.picks,veh:S.jeep});
  if(name==='city'&&!S.lands.city)spawnCity();
  const N=S.lands[name];S.land=name;S.dinos=N.dinos;S.pteras=N.pteras;S.picks=N.picks;S.jeep=N.veh;
  chunks.clear();cellCache.clear();MINI=name==='city'?MINI_CITY:MINI_ISLAND;
  const H=name==='city'?HELI_C:HELI_I;S.mode='foot';S.inside=false;S.p.x=H.x+40;S.p.y=H.y+150;S.p.a=PI/2;S.p.kx=S.p.ky=0;S.p.sneak=false;S.cam.x=S.p.x;S.cam.y=S.p.y-30;
  S.shots=[];S.parts=[];S.sampling=null;setAmb('fire',0);setAmb('tv',0);setAmb('engine',0);
  for(const k in HERDS)delete HERDS[k];
  renderTravel();updHud();save()}
function travelTo(name){const nm=name==='city'?'Port Meridian':'Primeval Isle';$('bkTxt').textContent=`Flying to ${nm}…`;SFX.heli();
  blackout(()=>{setLand(name);setTimeout(()=>{$('bkTxt').textContent=''},500);
    toast(name==='city'?'Dinosaurs escaped at the docks. Dart one, load it into the truck, and bring it to the Institute.':'Back on Primeval Isle. Collect DNA from every wild species.')},1.1)}
function inBay(v){return CITY.bay&&inR(v.x,v.y,CITY.bay,10)}
function loadTarget(){const v=S.jeep;if(v.type!=='truck'||v.cargo)return null;let best=null,bd=1e9;
  for(const d of S.dinos){if(d.pen||d.lie<.8)continue;const sp=SPECIES[d.sp];const dd=dist(d.x,d.y,v.x,v.y)-sp.len*d.scale*.45;if(dd<170&&dd<bd){bd=dd;best=d}}return best}
function loadDino(d){const v=S.jeep;const sp=SPECIES[d.sp];v.cargo={sp:d.sp,scale:d.scale,seed:d.seed};S.dinos.splice(S.dinos.indexOf(d),1);
  burst(d.x,d.y,'dust',16,{col:'#c8b890',spd:90,life:.9});SFX.load();toast(`${sp.short} is in the cage. Drive it to the Meridian Institute loading bay.`);updHud()}
function unloadDino(){const v=S.jeep,c=v.cargo;if(!c)return;const sp=SPECIES[c.sp];v.cargo=null;
  blackout(()=>{const d=addPenned(c.sp,c.scale,c.seed);d.lie=1;d.state='sleep';d.sleepT=4;S.pens.push({sp:c.sp,scale:c.scale,seed:c.seed});
    const g=guideOf(c.sp);g.spec++;g.seen=1;save();updHud();
    toast(`${sp.name} delivered to its pen at the Institute!`);SFX.pick()},.4)}
function questText(){return questTextFor(S.land)}
function questTextFor(land){if(land==='city'){const got=PEN_SP.filter(k=>guideOf(k).spec>0).length;return`Specimens returned ${got}/${PEN_SP.length}`}
  const DNA_SP=['trex','spino','raptor','trike','stego','apato','para','galli','mosa'];const got=DNA_SP.filter(k=>guideOf(k).dna>0).length;return`Wild DNA collected ${got}/${DNA_SP.length}`}

})();
