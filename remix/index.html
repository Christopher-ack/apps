<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Remix</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Remix">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Figtree:wght@400;500;600;700;800&family=Pirata+One&family=Uncial+Antiqua&family=IM+Fell+English+SC&family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --surface:#121212; --surface2:#1E1E1E; --surface3:#2A2A2A; --line:#262626;
  --ink:#FFFFFF; --ink2:#E6E6E6; --muted:#8C8C8C;
  --accent:#FF3D7F; --accent-ink:#2A0612; --green:#3BD17F; --heart:#FF4F6E;
  --wordmark:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --nav-h:58px;
  --nav-bg:#000; --nav-line:#1A1A1A; --nav-ink:#8C8C8C; --nav-active:#fff; --head-font:var(--body);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  background:var(--bg);color-scheme:dark;
}
/* This app is dark in every mode, like most short-video apps. */
@media (prefers-color-scheme:light){:root:not([data-theme="light"]){--bg:#000}}
:root[data-theme="light"]{--bg:#000}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;font-family:var(--body);color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
.av{border-radius:50%;display:grid;place-items:center;flex:none;overflow:hidden;background:var(--surface3)}
.av img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- Feed ---------- */
#feed{overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;background:#000;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;justify-content:center;position:relative}
.stage{position:relative;height:100%;width:100%;overflow:hidden;background:#000}
@media (min-aspect-ratio:3/4){.stage{width:auto;aspect-ratio:9/16;border-radius:10px}}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.shield{position:absolute;inset:0;z-index:2}
.paused-badge{position:absolute;inset:0;display:grid;place-items:center;z-index:3;pointer-events:none;opacity:0;transition:opacity .15s}
.paused-badge.show{opacity:1}
.paused-badge span{width:72px;height:72px;display:grid;place-items:center;opacity:.85}
.caption{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:80px 84px 18px 14px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55));pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.who{pointer-events:auto;border:0;background:none;color:#fff;padding:0;margin:0 0 6px;font-weight:700;font-size:1rem;display:flex;align-items:center;gap:6px;width:fit-content}
.cap-tags{display:flex;gap:6px;margin-bottom:6px}
.new-tag{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:.72rem;padding:2px 8px;border-radius:4px;text-shadow:none}
.new-tag.seen-tag{background:rgba(255,255,255,.2);color:#fff}
.caption h2{font-weight:500;font-size:.98rem;margin:0 0 8px;line-height:1.35}
.note{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-weight:600;font-size:.86rem;padding:6px 10px;border-radius:8px;max-width:100%;line-height:1.35;text-shadow:none}
.note b{color:var(--accent);font-weight:800}
.rail{position:absolute;right:8px;bottom:20px;z-index:4;display:flex;flex-direction:column;align-items:center;gap:16px}
.rail button{border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:700;padding:0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
.rail .ico{width:44px;height:44px;display:grid;place-items:center}
.rail .creator-btn{position:relative;margin-bottom:8px}
.rail .creator-btn .av{width:48px;height:48px;font-size:1.4rem;border:2px solid #fff}
.rail .creator-btn .badge{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.7rem;font-weight:900}
.rail .fav[aria-pressed="true"] svg{fill:var(--heart);stroke:var(--heart)}
.rail .keep[aria-pressed="true"] svg{fill:var(--accent);stroke:var(--accent)}
.progress{position:absolute;left:0;right:0;bottom:0;height:2px;z-index:4;background:rgba(255,255,255,.18)}
.progress i{display:block;height:100%;width:0;background:#fff}
.fail{position:absolute;inset:0;z-index:3;display:none;place-items:center;text-align:center;padding:28px;color:#fff;background:#000}
.fail.show{display:grid}
.fail p{max-width:30ch;line-height:1.5;margin:0;color:var(--ink2)}
#feedTop{display:contents}
.feed-top{position:absolute;top:8px;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;gap:4px;pointer-events:none}
.seg{pointer-events:auto;border:0;background:none;color:rgba(255,255,255,.62);font-weight:700;font-size:1.05rem;padding:8px 10px 6px;position:relative;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.seg[aria-pressed="true"]{color:#fff}
.seg[aria-pressed="true"]::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:28px;height:3px;border-radius:2px;background:#fff}
.seg-sep{width:1px;height:14px;background:rgba(255,255,255,.35)}
.chip{pointer-events:auto;border:0;background:rgba(0,0,0,.45);color:#fff;font-weight:700;border-radius:999px;padding:8px 14px;font-size:.92rem;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:#fff;padding:32px}
.empty h2{font-size:1.3rem;margin:0 0 8px;font-weight:700}
.empty p{color:var(--muted);max-width:32ch;margin:0 auto;line-height:1.5}

/* sample "videos" */
.fake{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.fake .big{font-size:min(36vw,180px);line-height:1;filter:drop-shadow(0 10px 20px rgba(0,0,0,.25))}
.fake .orb{position:absolute;border-radius:50%;background:#fff;opacity:.16}
.fake .sample{position:absolute;top:56px;right:12px;font-size:.7rem;font-weight:700;color:#fff;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:4px}
.m-bounce{animation:bounce 1.6s ease-in-out infinite}
.m-rock{animation:rock 2.2s ease-in-out infinite}
.m-float{animation:float 3.2s ease-in-out infinite}
.m-pop{animation:pop 1.8s ease-in-out infinite}
.orb{animation:drift 10s ease-in-out infinite alternate}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14%)}}
@keyframes rock{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@keyframes float{0%,100%{transform:translate(-6%,4%)}50%{transform:translate(6%,-6%)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(40px,-60px)}}
.stage.paused .fake *{animation-play-state:paused}

/* caught-up card */
.caught .stage{background:radial-gradient(circle at 50% 38%,#1C1C1C,#000 70%)}
.caught-card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:32px}
.caught-check{width:80px;height:80px;border-radius:50%;background:var(--accent);display:grid;place-items:center;margin-bottom:20px}
.caught-card h2{font-weight:800;font-size:1.6rem;margin:0 0 10px}
.caught-card p{color:var(--muted);line-height:1.55;margin:0;max-width:30ch}
.caught-arrow{margin-top:36px;font-size:1.5rem;color:#fff;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}

/* ---------- Pages ---------- */
.page{background:var(--bg);overflow-y:auto;padding:0 0 40px}
#profile{touch-action:pan-y;will-change:transform}
.page-inner{max-width:640px;margin:0 auto;padding:0 16px}
.topbar{position:sticky;top:0;z-index:6;background:var(--bg);display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:52px;margin:0 -16px 8px;padding:0 6px;border-bottom:1px solid var(--line)}
.topbar.clean{border-bottom-color:transparent}
.topbar h1{grid-column:2;margin:0;text-align:center;font-size:1.05rem;font-weight:700;font-family:var(--head-font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:0;background:none;color:var(--ink);width:44px;height:44px;display:grid;place-items:center;padding:0}
.topbar .right{grid-column:3}
.page h3{font-size:.8rem;font-weight:700;color:var(--muted);margin:26px 0 10px;letter-spacing:.02em}
.lede{color:var(--muted);margin:4px 0 18px;line-height:1.5}
.hint{color:var(--muted);font-size:.92rem;line-height:1.5}
.btn{border:0;border-radius:8px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:.98rem}
.btn.sun{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.ghost.light{background:rgba(255,255,255,.15)}
.btn.danger{background:var(--surface2);color:var(--heart)}
.btn.danger-fill{background:var(--heart);color:#fff}
.back{border:0;background:none;color:#fff;padding:0}

/* profile */
.me{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:10px}
.me .av,.creator-head .av{width:96px;height:96px;font-size:3rem;background:var(--accent)}
.me .uname,.creator-head .handle{margin:10px 0 0;font-weight:700;font-size:1.05rem}
.me .rname{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.stats{display:flex;justify-content:center;gap:0;margin:16px 0 14px}
.stats>*{display:flex;flex-direction:column;align-items:center;min-width:92px;border:0;background:none;padding:0;color:var(--ink)}
.stats>*+*{border-left:1px solid var(--line)}
.stats b{font-weight:800;font-size:1.1rem}
.stats small{color:var(--muted);font-size:.82rem;margin-top:2px}
.prof-actions{display:flex;gap:8px;justify-content:center}
.prof-actions .btn{padding:10px 22px;font-size:.92rem}
.ptabs{display:flex;border-bottom:1px solid var(--line);margin:18px -16px 2px;position:sticky;top:52px;background:var(--bg);z-index:5}
.ptabs button{flex:1;border:0;background:none;padding:12px 4px 10px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:grid;place-items:center}
.ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:0 -16px}
@media (min-width:600px){.grid{margin:0;border-radius:6px;overflow:hidden}}
.tile{aspect-ratio:3/4;border:0;padding:6px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;font-weight:600;font-size:.72rem;line-height:1.25;position:relative;overflow:hidden;border-radius:0}
.tile .te{position:absolute;top:28%;left:0;right:0;text-align:center;font-size:2.2rem}
.tile span{position:relative;text-shadow:0 1px 3px rgba(0,0,0,.6);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile::after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.45))}
.tile span{z-index:1}
.follow-list{display:flex;flex-direction:column}
.frow,.shelf-row{display:flex;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;width:100%;text-align:left;color:var(--ink)}
.frow .av{width:52px;height:52px;font-size:1.5rem}
.frow div{flex:1;min-width:0}
.frow b,.shelf-row b{display:block;font-weight:700;font-size:.98rem}
.frow small,.shelf-row small{color:var(--muted);font-size:.85rem;display:block}
.pill{font-size:.85rem;font-weight:700;padding:8px 14px;border-radius:6px;background:var(--surface2);color:var(--ink);flex:none}
.shelf-row .em{font-size:1.5rem;width:52px;height:52px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;flex:none}
.creator-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:8px}
.creator-head .cname{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.creator-head .bio{margin:12px 0 14px;max-width:34ch;line-height:1.45;color:var(--ink2);font-size:.92rem}
.av-edit{position:relative;border:0;background:none;padding:0;border-radius:50%}
.av-edit .pen{position:absolute;right:0;bottom:0;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:3px solid var(--bg)}

/* forms */
form.stack{display:flex;flex-direction:column;gap:14px}
label{font-weight:600;font-size:.88rem;display:flex;flex-direction:column;gap:6px;color:var(--ink2)}
input,select{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid transparent;border-radius:8px;padding:12px;width:100%}
input:focus{border-color:var(--muted);outline:none}
input::placeholder{color:#6A6A6A}
.row{display:flex;gap:10px}
.row>*{flex:1}
.msg{font-weight:600;font-size:.9rem;margin:0}
.msg.bad{color:var(--heart)} .msg.good{color:var(--green)}
.vlist{display:flex;flex-direction:column}
.vitem{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.vitem .sw{width:44px;height:58px;border-radius:4px;flex:none;display:grid;place-items:center;font-size:1.2rem}
.vitem .av{width:44px;height:44px;font-size:1.3rem}
.vitem>div:not(.acts){flex:1;min-width:0}
.vitem b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.vitem small{color:var(--muted);font-size:.84rem}
.acts{display:flex;flex-direction:column;flex:none;gap:4px}
.x{border:0;background:var(--surface2);color:#fff;font-weight:700;font-size:.8rem;padding:7px 12px;border-radius:6px;text-decoration:none;text-align:center}
.x.danger-x{color:var(--heart)}
.sample-box{background:var(--surface);border-radius:10px;padding:16px}
.sample-box p{margin:0 0 12px}
details summary{font-weight:700;cursor:pointer;color:#fff;padding:6px 0}
details code{background:var(--surface2);padding:2px 6px;border-radius:4px}
.forbox{display:flex;flex-direction:column;gap:8px}
.forbox .fb-title{font-weight:600;font-size:.88rem;color:var(--ink2)}
.forlist{display:flex;flex-wrap:wrap;gap:8px}
.forlist label{flex-direction:row;align-items:center;gap:8px;border:1px solid var(--surface3);background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer;font-weight:700;color:#fff}
.forlist label:has(input:checked){border-color:var(--accent);background:#2A2310}
.forlist .all-box{flex-basis:100%}
.forlist input{width:18px;height:18px;margin:0;accent-color:var(--accent);flex:none;padding:0}
.forlist .av{width:28px;height:28px;font-size:.95rem;background:var(--accent)}
.for-line{display:block;color:var(--accent);font-weight:600;font-size:.8rem;margin-top:2px}
.kidstat{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.status{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:4px;margin-top:5px}
.kidstat .status{margin:0}
.status.w{background:rgba(59,209,127,.15);color:var(--green)}
.status.n{background:rgba(255,201,60,.15);color:var(--accent)}
.kidrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.kidrow .av{width:52px;height:52px;font-size:1.5rem;background:var(--accent)}
.kidrow div{flex:1;min-width:0}
.kidrow b{display:block;font-weight:700;font-size:1rem}
.kidrow small{color:var(--muted);font-size:.84rem;display:block}
.mini{border:0;background:var(--surface2);border-radius:6px;padding:8px 12px;font-weight:700;font-size:.82rem;color:#fff;flex:none}
.lib-sum{display:flex;gap:8px;margin:4px 0 14px}
.lib-sum div{flex:1;background:var(--surface);border-radius:10px;padding:12px;text-align:center}
.lib-sum b{display:block;font-weight:800;font-size:1.4rem}
.lib-sum small{color:var(--muted);font-weight:600;font-size:.8rem}
.filters{display:flex;gap:8px;margin:4px 0 8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{border:0;background:var(--surface2);border-radius:6px;padding:8px 14px;font-weight:700;font-size:.88rem;color:var(--ink2);flex:none}
.filters button[aria-pressed="true"]{background:#fff;color:#000}
.whoami{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:.85rem}
.whoami .av{width:26px;height:26px;font-size:.85rem}

/* login */
.login{max-width:380px;margin:0 auto;padding:7vh 20px calc(30px + env(safe-area-inset-bottom,0px));text-align:center}
.login .mark{font-family:var(--wordmark);font-weight:600;font-size:2.4rem;margin:0;line-height:1;letter-spacing:.01em}
.login .tree{width:76px;height:76px;border-radius:20px;background:var(--accent);display:grid;place-items:center;font-size:2.6rem;margin:0 auto 16px}
.login .lede{margin:8px 0 26px}
.login form{text-align:left}
.demo-accts{margin-top:26px;text-align:left}
.demo-accts p{margin:0 0 10px}
.demo-accts .row{flex-wrap:wrap;gap:8px}
.demo-accts button{flex:1 1 40%;border:0;background:var(--surface);border-radius:10px;padding:12px 8px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff}
.demo-accts small{color:var(--muted);font-weight:500}
#banner{flex:none;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;font-weight:700;font-size:.88rem}
#banner[hidden]{display:none}
#banner button{border:0;background:var(--accent-ink);color:#fff;border-radius:6px;padding:6px 12px;font-weight:700;font-size:.82rem}

/* nav */
nav[hidden]{display:none}
nav{flex:none;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:var(--nav-bg);border-top:1px solid var(--nav-line)}
nav button{flex:1;border:0;background:none;color:var(--nav-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.68rem;font-weight:600}
nav button[aria-current="page"]{color:var(--nav-active)}
nav button.create{gap:0}
nav button.create .plus{width:46px;height:30px;border-radius:9px;background:#fff;color:#000;display:grid;place-items:center;}
nav button.create[aria-current="page"] .plus{background:var(--accent)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--sheet-bg,var(--surface));color:var(--ink);border-radius:14px 14px 0 0;padding:26px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;transform:translateY(105%);transition:transform .25s ease;max-height:80%;overflow-y:auto}
.sheet::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:2px;background:var(--surface3)}
.sheet.on{transform:none}
.sheet h3{font-weight:700;margin:0 0 14px;font-size:1.05rem;text-align:center}
.sheet .hint{text-align:center}
.pick{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px 4px;text-align:left;border-bottom:1px solid var(--line);color:var(--ink)}
.pick .em{font-size:1.4rem}
.pick .ck{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--surface3);display:grid;place-items:center;color:var(--accent-ink);font-size:.8rem;font-weight:900}
.pick[aria-checked="true"] .ck{background:var(--accent);border-color:var(--accent)}
.newcol{display:flex;gap:8px;margin-top:14px}
.newcol input{flex:1}
.av-sheet-top{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:16px}
.av-sheet-top .av{width:80px;height:80px;font-size:2.4rem;background:var(--accent)}
.av-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0 16px}
.av-grid button{aspect-ratio:1;border-radius:50%;border:2px solid transparent;background:var(--surface2);font-size:1.6rem;display:grid;place-items:center}
.av-grid button[aria-pressed="true"]{border-color:var(--accent)}
.photo-btns{display:flex;flex-direction:column;gap:8px}
.menu-list{display:flex;flex-direction:column}
.menu-list button{border:0;background:none;color:var(--ink);text-align:left;padding:14px 4px;font-weight:600;font-size:1rem;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.menu-list button.danger-x{color:var(--heart)}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(40,40,40,.95);color:#fff;font-weight:600;padding:10px 16px;border-radius:8px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;font-size:.9rem}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){
  .sheet,.toast,.paused-badge{transition:none}
  .fake *,.caught-arrow{animation:none!important}
}

/* ================= Themes (child app only) ================= */
#skinFx{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden;display:none}
.lights{display:block;width:calc(100% + 32px);height:46px;margin:-6px -16px 0}
.lights .bulb{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
.flake{position:absolute;top:-20px;color:#fff;opacity:.9;animation:snow linear infinite;text-shadow:0 0 6px rgba(255,255,255,.6)}
@keyframes snow{0%{transform:translate(0,-20px) rotate(0)}50%{transform:translate(18px,50vh) rotate(180deg)}100%{transform:translate(-10px,105vh) rotate(360deg)}}

/* Holiday: cranberry red and snowy white */

html[data-skin="dragon"] body[data-tab="profile"] #skinFx{display:block}
.ember{position:absolute;bottom:-12px;width:5px;height:5px;border-radius:50%;background:#FFB15C;box-shadow:0 0 8px 2px rgba(255,120,40,.75);animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.95}60%{transform:translate(14px,-55vh);opacity:.7}100%{transform:translate(-8px,-100vh);opacity:0}}
html[data-skin="dragon"] .topbar.clean{background:transparent}
html[data-skin="dragon"] .topbar{background:rgba(28,40,48,.9)}
html[data-skin="dragon"] .topbar h1{font-weight:400;font-size:1.3rem;letter-spacing:.03em;text-shadow:0 2px 8px rgba(0,0,0,.5)}
html[data-skin="dragon"] .me .uname,html[data-skin="dragon"] .creator-head .handle{font-family:"Uncial Antiqua",serif;font-weight:400;font-size:1.2rem}
html[data-skin="dragon"] .stats small,html[data-skin="dragon"] .btn,html[data-skin="dragon"] .pill,html[data-skin="dragon"] .menu-list button{font-family:"Uncial Antiqua","Figtree",serif;font-weight:400}
html[data-skin="dragon"] .stats>*+*{border-left:1px solid rgba(232,116,44,.35)}
/* forged-ember primary buttons with iron rivets */
html[data-skin="dragon"] .btn{
  background:
    radial-gradient(circle at 9px 50%,#C9D2D7 0 2.5px,#5C6F7A 3px,transparent 3.5px),
    radial-gradient(circle at calc(100% - 9px) 50%,#C9D2D7 0 2.5px,#5C6F7A 3px,transparent 3.5px),
    linear-gradient(#F08A3C,#C2531B);
  color:#1A0E05;border:2px solid #0E1418;border-radius:6px;box-shadow:inset 0 0 0 2px rgba(255,220,180,.35),0 3px 0 #0E1418;padding:10px 26px}
html[data-skin="dragon"] .btn:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px rgba(255,220,180,.35),0 1px 0 #0E1418}
/* iron-banded secondary buttons */
html[data-skin="dragon"] .btn.ghost,html[data-skin="dragon"] .pill{
  background:
    radial-gradient(circle at 7px 7px,#AEB9BF 0 1.8px,transparent 2.3px),
    radial-gradient(circle at calc(100% - 7px) 7px,#AEB9BF 0 1.8px,transparent 2.3px),
    radial-gradient(circle at 7px calc(100% - 7px),#AEB9BF 0 1.8px,transparent 2.3px),
    radial-gradient(circle at calc(100% - 7px) calc(100% - 7px),#AEB9BF 0 1.8px,transparent 2.3px),
    linear-gradient(#3A4C57,#2A3842);
  color:var(--ink);border:2px solid #5C6F7A;border-radius:6px;box-shadow:0 2px 0 #0E1418}
/* round wooden shield frame around the profile picture */
html[data-skin="dragon"] .me .av{background:#2F5A4A;box-shadow:0 0 0 4px #6B4A2B,0 0 0 6px #4A321C,0 0 0 9px #8C99A1,0 0 0 11px #3E4B53,0 6px 18px 8px rgba(0,0,0,.45)}
html[data-skin="dragon"] .av-edit .pen{background:#E8742C;color:#1A0E05;border-color:#1C2830}
html[data-skin="dragon"] .ptabs{background:rgba(28,40,48,.92)}
html[data-skin="dragon"] .ptabs button[aria-selected="true"]{color:#F2A65A;border-bottom-color:#E8742C}
html[data-skin="dragon"] .tile{border-radius:4px;box-shadow:inset 0 0 0 2px rgba(14,20,24,.6)}
html[data-skin="dragon"] .grid{gap:3px}
html[data-skin="dragon"] .new-tag{background:#E8742C;color:#1A0E05;font-family:"Uncial Antiqua",serif;font-weight:400}
html[data-skin="dragon"] .note b{color:#F2A65A}
html[data-skin="dragon"] .rail .keep[aria-pressed="true"] svg{fill:#F2A65A;stroke:#F2A65A}
html[data-skin="dragon"] .caught .stage{background:radial-gradient(circle at 50% 38%,#3E5361,#0E1418 75%)}
html[data-skin="dragon"] .caught-check{background:#E8742C;box-shadow:0 0 30px 6px rgba(232,116,44,.45)}
html[data-skin="dragon"] .caught-card h2{font-family:"Uncial Antiqua",serif;font-weight:400}
html[data-skin="dragon"] nav{background:linear-gradient(#18232A,#0E1418);border-top:2px solid #3E4B53}
html[data-skin="dragon"] .frow,html[data-skin="dragon"] .shelf-row{border-bottom-color:rgba(160,185,198,.16)}
@media (prefers-reduced-motion:reduce){.ember{display:none}}

/* Themed nav icons */
nav button.skinned{gap:0}
nav .skin-ico{width:34px;height:34px;opacity:.62;transition:opacity .2s,transform .2s;overflow:visible}
nav button.skinned[aria-current="page"] .skin-ico{opacity:1;transform:scale(1.1)}
nav .smoke circle{transform-box:fill-box;transform-origin:center;animation:puff 2.8s ease-out infinite}
nav .smoke circle:nth-child(2){animation-delay:-.9s}
nav .smoke circle:nth-child(3){animation-delay:-1.8s}
@keyframes puff{0%{opacity:0;transform:translate(0,3px) scale(.6)}25%{opacity:.85}100%{opacity:0;transform:translate(2px,-5px) scale(1.4)}}
nav .nav-bulbs circle{animation:twinkle 2s ease-in-out infinite}
nav .nav-bulbs circle:nth-child(2n){animation-delay:-1s}
nav .nav-bulbs circle:nth-child(3n){animation-delay:-.5s}
nav .star{transform-box:fill-box;transform-origin:center;animation:twinkle 3s ease-in-out infinite}
nav .waves{animation:bob 2.4s ease-in-out infinite}
nav button.skinned[aria-current="page"] .skin-ico g:not(.smoke),nav button.skinned[aria-current="page"] .skin-ico{filter:none}
@keyframes bob{0%,100%{transform:translateX(0)}50%{transform:translateX(1.5px)}}
@media (prefers-reduced-motion:reduce){nav .smoke circle,nav .nav-bulbs circle,nav .star,nav .waves{animation:none}}

/* Theme picker cards */
.theme-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.theme-card{display:flex;align-items:center;gap:14px;border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px;text-align:left;color:var(--ink)}
.theme-card[aria-pressed="true"]{border-color:var(--ink)}
.theme-card .sw{width:64px;height:84px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:1.8rem;position:relative;overflow:hidden}
.theme-card b{display:block;font-size:1.05rem}
.theme-card small{color:var(--muted);line-height:1.35;display:block}
.theme-card .ck{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:900;flex:none;color:transparent}
.theme-card[aria-pressed="true"] .ck{background:var(--ink);border-color:var(--ink);color:var(--bg)}
@media (prefers-reduced-motion:reduce){.flake,.lights .bulb{animation:none!important}.flake{display:none}}
.login .tree.rxlogo{width:96px;height:96px;margin:0 auto 16px;background:none;border-radius:24px;overflow:hidden;padding:0}.rxlogo svg{width:100%;height:100%;display:block}


.ix-list{display:grid;gap:2px;margin-top:6px}
.ix-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border:0;border-bottom:1px solid var(--surface2);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;width:100%}
.ix-av{width:52px;height:52px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:1.6rem;background:var(--surface2);flex:none}
.ix-av img{width:100%;height:100%;object-fit:cover}
.ix-mid{flex:1;min-width:0}.ix-mid b{display:block}.ix-mid small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ix-fam{display:inline!important;font-weight:600;font-size:.75rem;color:var(--muted)}
.ix-end{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}.ix-end small{color:var(--muted);font-size:.75rem}
.ix-dot{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:800;display:grid;place-items:center}
.ix-head{display:flex;align-items:center;gap:10px;margin:14px 0 6px}.ix-head .ix-av{width:40px;height:40px;font-size:1.2rem}.ix-head b{display:block}.ix-head small{color:var(--muted)}
.ix-thread{display:flex;flex-direction:column;gap:14px;padding:8px 0 30px}
.ix-msg{display:flex;flex-direction:column;max-width:82%}.ix-msg.them{align-self:flex-start;align-items:flex-start}.ix-msg.me{align-self:flex-end;align-items:flex-end}
.ix-time{color:var(--muted);font-size:.72rem;margin:0 6px 4px}
.ix-bubble{position:relative;display:flex;gap:10px;align-items:center;padding:8px 12px 8px 8px;border:0;border-radius:18px;background:var(--surface2);color:inherit;font:inherit;text-align:left;cursor:pointer}
.ix-msg.me .ix-bubble{background:var(--accent);color:var(--accent-ink)}.ix-msg.me .ix-bubble small{color:inherit;opacity:.8}
.ix-bubble[disabled]{cursor:default;opacity:.85}
.ix-th{height:128px;border-radius:12px;display:grid;place-items:center;font-size:2.4rem;flex:none}
.ix-tt b{display:block;font-size:.92rem;line-height:1.25}.ix-tt small{display:block;font-size:.75rem;color:var(--muted)}
.ix-wait{margin-top:4px;font-weight:700}
.ix-react-badge{position:absolute;left:-10px;bottom:-10px;width:30px;height:30px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:1rem;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.ix-reacts{display:flex;gap:4px;margin-top:6px}
.ix-reacts button{width:38px;height:38px;border-radius:50%;border:1px solid var(--surface2);background:var(--surface);font-size:1.05rem;cursor:pointer;display:grid;place-items:center;padding:0}
.ix-reacts button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);transform:scale(1.08)}
.ptabs button{position:relative}.ptabs .ix-tabdot{position:absolute;top:6px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--accent)}
.rx-sec{margin-top:6px}
.rx-card{background:var(--surface);border-radius:14px;padding:14px;margin:8px 0}
.rx-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--surface2)}
.rx-row:last-child{border-bottom:0}
.rx-row{flex-wrap:wrap}.rx-row .rx-acts{display:flex;flex-wrap:wrap;gap:8px;flex-basis:100%;padding-left:52px}.rx-row .rx-acts .btn.rx-sm{width:auto!important;display:inline-flex!important;align-items:center;justify-content:center;flex:0 0 auto!important;margin:0!important;min-width:0}
.rx-row .av{width:40px;height:40px;font-size:1.3rem;flex:none}
.rx-row .nm{flex:1;min-width:0}.rx-row .nm b{display:block}.rx-row .nm small{display:block;color:var(--muted);font-size:.82rem}
.rx-tog{appearance:none;-webkit-appearance:none;width:48px;height:30px;border-radius:99px;background:var(--surface3,#333);position:relative;cursor:pointer;flex:none;border:0}
.rx-tog::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.rx-tog:checked{background:var(--green,#3BD17F)}.rx-tog:checked::after{transform:translateX(18px)}
.rx-code{font:700 1.5rem/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;background:var(--surface2);border-radius:10px;padding:10px 14px;display:inline-block}
.rx-inline{display:flex;gap:8px}.rx-inline input{flex:1;min-width:0;text-transform:uppercase}
.rx-sm{padding:8px 12px!important;font-size:.85rem!important;width:auto!important}
.rx-tag{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.rx-tag.wait{background:rgba(255,201,60,.18);color:#FFC93C}.rx-tag.ok{background:rgba(59,209,127,.16);color:#3BD17F}.rx-tag.no{background:rgba(255,79,110,.16);color:#FF4F6E}
.rail .sendb .ico svg{fill:#fff}
.rx-hit{display:block;width:100%;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.rx-ahead{display:flex;align-items:center;gap:10px;margin:4px 0 6px}.rx-ahead h2{margin:0;font-size:1.25rem;flex:1}
.rx-back{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface2);color:inherit;font-size:1.3rem;display:grid;place-items:center;flex:none;cursor:pointer}
.rx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:8px 0}
.rx-tile{position:relative;aspect-ratio:3/4;border:0;border-radius:10px;overflow:hidden;display:grid;place-items:center;font-size:2.4rem;color:#fff;cursor:pointer;padding:0}
.rx-tile small{position:absolute;left:6px;right:6px;bottom:5px;font-size:.68rem;font-weight:700;text-align:left;line-height:1.2;text-shadow:0 1px 3px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rx-tile .sent{position:absolute;top:5px;left:5px;font-size:.62rem;font-weight:800;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:99px}
#rxFeed{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
#rxFeed[hidden]{display:none}
#rxFeed .top{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(#000a,transparent)}
#rxFeed .top b{flex:1;text-align:center;margin-right:40px}
#rxFeed .scroller{flex:1;overflow-y:auto;scroll-snap-type:y mandatory}
#rxFeed .sl{height:100%;scroll-snap-align:start;position:relative;display:grid;place-items:center;font-size:7rem;overflow:hidden}
#rxFeed .sl .fake{position:absolute;inset:0}
#rxFeed .sl iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#rxFeed .cap{position:absolute;left:14px;right:84px;bottom:28px;z-index:2;font-size:.9rem;text-shadow:0 1px 3px #000}
#rxFeed .cap b{display:block;font-size:1rem}

function parseLink(raw){
  const s=(raw||"").trim();
  if(/^\d{15,22}$/.test(s))return{id:s};
  let m=s.match(/tiktok\.com\/@([\w.]+)\/(?:video|photo)\/(\d{15,22})/i);
  if(m)return{id:m[2],handle:m[1].toLowerCase()};
  m=s.match(/tiktok\.com\/(?:player\/v1|embed(?:\/v2)?|v)\/(\d{15,22})/i);
  if(m)return{id:m[1]};
  if(/(vm|vt)\.tiktok\.com|tiktok\.com\/t\//i.test(s))return{short:true};
  return{bad:true};
}
function cleanHandle(s){const m=String(s||"").trim().match(/(?:tiktok\.com\/)?@?([\w.]{2,24})\/?$/i);return m?m[1].toLowerCase():null}

/* ===================== families and sharing ===================== */
const famById=id=>S.families.find(f=>f.id===id);
const myFam=()=>famById(S.sessionFam);
function bindFam(fid){const f=S.fam[fid];if(!f)return;S.sessionFam=fid;S.videos=f.videos;S.trusted=f.trusted;S.accounts=f.accounts;S.kidData=f.kidData}
function famKids(fid){return (S.fam[fid]?.accounts||[]).filter(a=>a.role==="child")}
function famOf(accId){for(const [fid,f] of Object.entries(S.fam)) if(f.accounts.some(a=>a.id===accId)) return fid;return null}
function findAccount(username){for(const [fid,f] of Object.entries(S.fam)){const a=f.accounts.find(x=>x.username===username);if(a)return {fid,a}}return null}
const linked=(a,b)=>S.links.some(l=>l.status==="active"&&((l.from===a&&l.to===b)||(l.from===b&&l.to===a)));
const isAdminAcct=()=>!!me()?.admin;
function shareTargets(k){
  if(!k||!k.allowSharing)return [];
  const out=[];
  famKids(S.sessionFam).forEach(x=>{if(x.id!==k.id&&x.allowSharing)out.push({...x,fid:S.sessionFam,same:true})});
  S.families.forEach(f=>{if(f.id!==S.sessionFam&&linked(S.sessionFam,f.id))famKids(f.id).forEach(x=>{if(x.allowSharing)out.push({...x,fid:f.id,same:false})})});
  return out;
}
function deliver(sh){
  if(window.REMIX_LIVE)return;   /* the server delivers */
  const f=S.fam[sh.toFam];if(!f)return;
  const {id,for:_f,addedAt,from,note,...rest}=sh.video;
  const nid=uid();sh.deliveredId=nid;
  f.videos.push({...rest,id:nid,for:[sh.toId],from:sh.fromName,note:" sent you this",sentBy:sh.fromName,addedAt:Date.now()});
}
function sendVideo(videoId,t){
  const k=curKid(),v=S.videos.find(x=>x.id===videoId);if(!k||!v)return;
  if(S.shares.some(s=>s.videoKey===(v.postId||v.title)&&s.fromId===k.id&&s.toId===t.id)){toast(`Already sent to ${t.name}`);return}
  const needsOk=!t.same&&famById(t.fid)?.approve;
  const sh={id:uid(),videoKey:v.postId||v.title,video:JSON.parse(JSON.stringify(v)),fromId:k.id,fromName:k.name,fromFam:S.sessionFam,toId:t.id,toName:t.name,toFam:t.fid,status:needsOk?"waiting":"delivered",at:Date.now()};
  if(!needsOk)deliver(sh);
  S.shares.push(sh);save();
  toast(needsOk?`Sent! ${t.name}'s parent will check it first.`:`Sent to ${t.name}`);
}
function openSend(videoId){
  const sheet=$("#sheet"),k=curKid(),ts=shareTargets(k);
  sheet.innerHTML=`<h3 id="sheetTitle">Send to</h3>
    ${ts.length?ts.map(t=>`<button class="pick" data-to="${t.id}"><span class="em">${kidAv(t)}</span><span>${esc(t.name)}<small style="display:block;color:var(--muted);font-weight:500">${t.same?"Your family":"The "+esc(famById(t.fid).name)+" family"}</small></span><span class="ck">➜</span></button>`).join("")
      :`<p class="hint">Nobody to send to yet. Kids can send to brothers and sisters, and to kids in families your parents connected, once their parents turn sharing on.</p>`}
    <p style="margin:14px 0 0"><button class="btn ghost" id="doneBtn" style="width:100%">Close</button></p>`;
  sheet.querySelectorAll("[data-to]").forEach(b=>b.addEventListener("click",()=>{const t=ts.find(x=>x.id===b.dataset.to);closeSheet();sendVideo(videoId,t)}));
  $("#doneBtn").addEventListener("click",closeSheet);
  openSheet();
}
function shareRow(s,actions){
  const when=new Date(s.at).toLocaleDateString(undefined,{month:"short",day:"numeric"});
  const tag=s.status==="waiting"?'<span class="rx-tag wait">Waiting</span>':s.status==="declined"?'<span class="rx-tag no">Not allowed</span>':'<span class="rx-tag ok">Delivered</span>';
  const fromF=s.fromFam===S.sessionFam?"":" ("+esc(famById(s.fromFam)?.name||"")+")",toF=s.toFam===S.sessionFam?"":" ("+esc(famById(s.toFam)?.name||"")+")";
  return `<div class="rx-row"><span class="av" style="background:${s.video.demo?`linear-gradient(160deg,${s.video.scene.bg[0]},${s.video.scene.bg[1]})`:"var(--surface2)"}">${s.video.demo?s.video.scene.emoji:"🎬"}</span>
    <span class="nm"><b>${esc(s.video.title||"A video")}</b><small>${esc(s.fromName)}${fromF} → ${esc(s.toName)}${toF} · ${when}</small></span>${actions?`<div class="rx-acts">${actions}</div>`:tag}</div>`;
}

    ${incoming.length?`<h3>Families asking to connect</h3><div class="rx-card">${incoming.map(l=>`<div class="rx-row"><span class="av">🏡</span><span class="nm"><b>The ${esc(famById(l.from).name)} family</b><small>Wants to share videos between your kids</small></span><button class="btn rx-sm" data-acc="${l.from}">Accept</button><button class="btn ghost rx-sm" data-dec="${l.from}">No</button></div>`).join("")}</div>`:""}
    <h3>Connected families</h3>

      ${outgoing.map(l=>`<div class="rx-row"><span class="av">⏳</span><span class="nm"><b>The ${esc(famById(l.to).name)} family</b><small>Waiting for them to accept</small></span></div>`).join("")}</div>
    <div class="rx-card"><div class="rx-row"><span class="nm"><b>Check videos from other families</b><small>Videos sent by kids in connected families wait for a parent's OK before your kids see them.</small></span><input type="checkbox" class="rx-tog" id="rxApprove" ${f.approve?"checked":""} aria-label="Check videos from other families"></div></div>
`;
}
const waitingShares=()=>S.shares.filter(s=>s.toFam===S.sessionFam&&s.status==="waiting");
function reviewSection(){
  const w=waitingShares(),recent=S.shares.filter(s=>s.fromFam===S.sessionFam||s.toFam===S.sessionFam);

`;
}
function lookSheet(s){
  const sheet=$("#sheet"),v=s.video;
  sheet.innerHTML=`<h3 id="sheetTitle">${esc(v.title||"Video")}</h3>
    <div style="height:260px;border-radius:16px;display:grid;place-items:center;font-size:5rem;margin-bottom:12px;background:${v.demo?`linear-gradient(160deg,${v.scene.bg[0]},${v.scene.bg[1]})`:"var(--surface2)"}">${v.demo?v.scene.emoji:"🎬"}</div>
    <p class="hint" style="margin:0 0 14px">${v.handle?"@"+esc(v.handle)+" · ":""}${esc(s.fromName)} (${esc(famById(s.fromFam)?.name||"")} family) sent this to ${esc(s.toName)}${s.status==="delivered"?" · delivered":s.status==="declined"?" · not allowed":""}</p>
    ${s.status==="waiting"&&s.toFam===S.sessionFam?`<div class="row"><button class="btn ghost" id="lkNo">Don't send</button><button class="btn" id="lkOk">Allow</button></div>`
      :`<p style="margin:0"><button class="btn ghost" id="lkClose" style="width:100%">Close</button></p>`}`;
  openSheet();
  if(!$("#lkOk")){$("#lkClose").onclick=closeSheet;return}
  $("#lkOk").onclick=()=>{s.status="delivered";deliver(s);save();closeSheet();toast(`Sent on to ${s.toName}`);renderPLibrary();renderNav()};
  $("#lkNo").onclick=()=>{s.status="declined";save();closeSheet();toast("Not sent");renderPLibrary();renderNav()};
}
function activitySheet(){
  const sheet=$("#sheet"),recent=S.shares.filter(s=>s.fromFam===S.sessionFam||s.toFam===S.sessionFam).sort((a,b)=>b.at-a.at).slice(0,30);
  sheet.innerHTML=`<h3 id="sheetTitle">Sharing activity</h3><div style="max-height:60vh;overflow:auto">${recent.map(s=>`<button class="rx-hit" data-act="${s.id}" aria-label="Watch ${esc(s.video.title||"video")}">${shareRow(s)}</button>`).join("")}</div>
    <p style="margin:14px 0 0"><button class="btn ghost" id="doneBtn" style="width:100%">Close</button></p>`;
  openSheet();$("#doneBtn").onclick=closeSheet;

function wireReview(root){
  root.querySelectorAll("[data-look]").forEach(b=>b.onclick=()=>reviewFeed(b.dataset.look));
  root.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>{const s=S.shares.find(x=>x.id===b.dataset.ok);s.status="delivered";deliver(s);save();toast(`Sent on to ${s.toName}`);renderPLibrary();renderNav()});
  root.querySelectorAll("[data-no]").forEach(b=>b.onclick=()=>{const s=S.shares.find(x=>x.id===b.dataset.no);s.status="declined";save();toast("Not sent");renderPLibrary();renderNav()});
}

const OK_ICON='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  let box=$("#rxFeed");if(!box){box=document.createElement("div");box.id="rxFeed";document.body.appendChild(box)}

      <div class="cap">${v.handle?`<b>@${esc(v.handle)}</b>`:""}${esc(v.title||"")}<br><small>${esc(s.fromName)} (${esc(famById(s.fromFam)?.name||"")} family) sent this to ${esc(s.toName)}</small></div>
      <div class="rr"><button class="ok" data-rok="${s.id}"><span class="ic" style="background:#3BD17F">${OK_ICON}</span>Allow</button><button class="del" data-rno="${s.id}"><span class="ic">${NO_ICON}</span>No</button></div></section>`}).join("")}</div>`;

  if(feedFilter)return feedFilter.ids.map(id=>S.videos.find(v=>v.id===id)).filter(Boolean);

function playerSrc(postId){

let seenTimer=null;
function activate(i){

    seenTimer=setTimeout(()=>{if(currentList[activeIdx]!==cur)return;D().seen[cur.id]=Date.now();save()},3000);
  }
  const slides=[...document.querySelectorAll("#feed .slide")];
  slides.forEach((sl,k)=>{const near=Math.abs(k-i)<=1;if(near&&!players.has(k))mount(sl,k);if(!near&&players.has(k))unmount(k)});
  players.forEach((p,k)=>{p.want=k===i;if(p.kind==="demo"||p.ready){if(k===i){if(p.kind==="tt")send(p,soundOn?"unMute":"mute");ctl(p,"play")}else ctl(p,"pause")}});

function mount(sl,k){

function unmount(k){const p=players.get(k);if(p.kind==="demo")clearInterval(p.timer);else{clearTimeout(p.fail);p.iframe.remove()}p.slide.querySelector(".progress i").style.width="0";players.delete(k)}

function ctl(p,action){

function send(p,type,value){try{p.iframe.contentWindow.postMessage({type,value,"x-tiktok-player":true},"*")}catch(e){}}

window.addEventListener("message",ev=>{
  let d=ev.data;if(typeof d==="string"){try{d=JSON.parse(d)}catch(e){return}}

    case "onCurrentTime":{const v=d.value||{};if(v.duration)sl.querySelector(".progress i").style.width=(100*v.currentTime/v.duration)+"%";break}
    case "onPlayerError":{const code=d.value&&d.value.errorCode;if(code===3002){send(p,"mute");send(p,"play");break}sl.querySelector(".fail").classList.add("show");break}

function shrinkPhoto(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type))return rej(new Error("type"));
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const s=Math.min(img.naturalWidth,img.naturalHeight),size=320,c=document.createElement("canvas");
      c.width=c.height=size;
      c.getContext("2d").drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,size,size);
      URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.85));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("load"))};
    img.src=url;
  });
}

/* Swipe in from the left edge on a creator or collection page to go back, like the back arrow */
(function edgeSwipe(){
  const el=$("#profile");let g=null;
  const reset=(anim)=>{el.style.transition=anim?"transform .22s ease, box-shadow .22s ease":"none";el.style.transform="";el.style.boxShadow="";if(anim)setTimeout(()=>{el.style.transition=""},240)};
  el.addEventListener("pointerdown",e=>{
    if(profView.kind==="home"||e.clientX>32||(e.pointerType==="mouse"&&e.button!==0))return;
    g={x:e.clientX,y:e.clientY,t:performance.now(),id:e.pointerId,dx:0,lock:false};
  });
  el.addEventListener("pointermove",e=>{
    if(!g||e.pointerId!==g.id)return;
    const dx=e.clientX-g.x,dy=Math.abs(e.clientY-g.y);
    if(!g.lock){
      if(dy>14&&dy>dx){g=null;return}
      if(dx>10){g.lock=true;try{el.setPointerCapture(e.pointerId)}catch(_){}}else return;
    }
    g.dx=Math.max(0,dx);
    el.style.transition="none";el.style.transform=`translateX(${g.dx}px)`;el.style.boxShadow="-12px 0 24px rgba(0,0,0,.35)";
  });
  const end=e=>{
    if(!g||e.pointerId!==g.id)return;
    const gg=g;g=null;if(!gg.lock)return;
    const v=gg.dx/Math.max(1,performance.now()-gg.t);
    if(gg.dx>el.clientWidth*.33||(gg.dx>50&&v>.45)){
      el.style.transition="transform .18s ease-out";el.style.transform="translateX(100%)";
      setTimeout(()=>{reset(false);goBack()},180);
    }else reset(true);
  };
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",e=>{if(g&&e.pointerId===g.id){g=null;reset(true)}});
})();

function wireForPicker(id){
  const box=document.getElementById(id);if(!box)return;

  const hint=box.querySelector("[data-forhint]");

  allBox.addEventListener("change",()=>{kidBoxes.forEach(b=>b.checked=allBox.checked);upd()});

const RXL={
  gate:null, snap:null, busy:null, timer:null, isAppAdmin:false,
  sb:()=>WebApps.client.schema("remix"),
  msg(m){const k=(String(m).match(/rx:\w+/)||[])[0];return ({"rx:bad_code":"No family has that code.","rx:own_code":"That's your own family's code.","rx:cant_send_to":"You can't send to them right now.",
    "rx:sharing_off":"Sharing is turned off for you.","rx:parents_only":"Only a parent can do that.","rx:not_found":"That video isn't available.","rx:family_name":"Enter your family name.",
    "rx:already_in_family":"You're already in a family.","rx:not_member":"Join Remix first."})[k]||m},
  async q(p){const {data,error}=await p;if(error)throw new Error(RXL.msg(error.message));return data},
  rpc(n,a){return RXL.q(RXL.sb().rpc(n,a))},
  async fn(body){const {data,error}=await WebApps.client.functions.invoke("remix-family",{body});
    if(error){let m=error.message;try{const j=await error.context.json();if(j&&j.error)m=j.error}catch(e){}throw new Error(m)}
    if(data&&data.error)throw new Error(data.error);return data},
  empty(){return {families:[],fam:{},links:[],shares:[],session:null,sessionFam:null,videos:[],trusted:[],accounts:[],kidData:{}}},
  async load(){
    const [fams,profs,states,kids,links,shares]=await Promise.all(["families","profiles","family_state","kid_state","family_links","shares"].map(t=>RXL.q(RXL.sb().from(t).select("*"))));
    const ids=[...new Set(profs.map(p=>p.id).concat(shares.flatMap(s=>[s.from_child,s.to_child])))];
    const accts=ids.length?await RXL.q(WebApps.client.from("accounts").select("id,username,display_name,avatar").in("id",ids)):[];
    const A=Object.fromEntries(accts.map(a=>[a.id,a]));
    const n=RXL.empty();
    n.families=fams.map(f=>({id:f.id,name:f.name,code:f.invite_code,approve:!!f.require_share_approval}));
    const ensure=fid=>{if(!n.fam[fid]){if(!n.families.some(f=>f.id===fid))n.families.push({id:fid,name:"Another",code:"",approve:false});
      const st=states.find(s=>s.family_id===fid);n.fam[fid]={videos:(st&&st.data&&st.data.videos)||[],trusted:(st&&st.data&&st.data.trusted)||[],kidData:{},accounts:[]}}return n.fam[fid]};
    fams.forEach(f=>ensure(f.id));
    const meAdmin=!!(WebApps.me.is_admin||RXL.isAppAdmin);
    profs.forEach(p=>{const a=A[p.id]||{};ensure(p.family_id).accounts.push({id:p.id,role:p.role,name:a.display_name||"Someone",username:a.username||"",
      avatar:p.avatar||"🙂",photo:a.avatar||"",theme:p.theme||"default",allowSharing:!!p.allow_sharing,admin:p.id===WebApps.me.id&&meAdmin})});
    kids.forEach(k=>{const p=profs.find(x=>x.id===k.child_id);if(p)ensure(p.family_id).kidData[k.child_id]=Object.assign({favorites:[],collections:[],seen:{}},k.data||{})});
    n.links=links.map(l=>({from:l.from_family,to:l.to_family,status:l.status}));
    n.shares=shares.map(s=>({id:s.id,videoKey:s.video_key,video:s.video,fromId:s.from_child,fromName:(A[s.from_child]||{}).display_name||"Someone",fromFam:s.from_family,
      toId:s.to_child,toName:(A[s.to_child]||{}).display_name||"Someone",toFam:s.to_family,status:s.status,at:Date.parse(s.created_at),reaction:s.reaction,
      seenAt:s.seen_at?Date.parse(s.seen_at):null,deliveredId:s.delivered_id}));
    S=n;const mine=profs.find(p=>p.id===WebApps.me.id);
    if(mine){S.session=mine.id;bindFam(mine.family_id)}
    RXL.snap=RXL.snapshot();
  },
  snapshot(){const fam={};
    for(const [fid,F] of Object.entries(S.fam))fam[fid]={lib:JSON.stringify({v:F.videos,t:F.trusted}),kid:Object.fromEntries(Object.entries(F.kidData).map(([k,v])=>[k,JSON.stringify(v)])),
      acc:Object.fromEntries(F.accounts.map(a=>[a.id,{name:a.name,photo:a.photo||"",avatar:a.avatar,theme:a.theme,allowSharing:!!a.allowSharing,role:a.role}]))};
    return {fam,families:S.families.map(f=>({id:f.id,approve:f.approve})),links:JSON.parse(JSON.stringify(S.links)),
      shares:Object.fromEntries(S.shares.map(s=>[s.id,{status:s.status,reaction:s.reaction||null,seen:!!s.seenAt}]))}},
  async start(){
    await WebApps.ready;
    try{
      if(!WebApps.me){RXL.gate="signin";S=RXL.empty()}
      else{const app=(await WebApps.apps()).find(a=>a.slug==="remix");RXL.isAppAdmin=!!(app&&app.status==="active"&&app.role==="admin");
        if(!app||app.status!=="active"){RXL.gate=app&&app.status==="pending"?"pending":"join";S=RXL.empty()}
        else{await RXL.load();RXL.gate=S.session?null:"setup"}}
    }catch(e){RXL.gate="error";RXL.err=e.message;S=RXL.empty()}
    boot();
  },
  persistSoon(){clearTimeout(RXL.timer);RXL.timer=setTimeout(()=>RXL.persist(),400)},
  async persist(){
    if(RXL.busy){RXL.persistSoon();return}
    if(!S.session||!RXL.snap)return;
    RXL.busy=true;let reload=false;const old=RXL.snap,meA=me(),isP=meA&&meA.role==="parent",admin=!!(meA&&meA.admin);
    try{
      for(const [fid,F] of Object.entries(S.fam)){
        const o=old.fam[fid];if(!o)continue;
        const mineFam=fid===S.sessionFam;if(!mineFam&&!admin)continue;
        if((isP||admin)&&JSON.stringify({v:F.videos,t:F.trusted})!==o.lib)
          await RXL.q(RXL.sb().from("family_state").update({data:{videos:F.videos,trusted:F.trusted},updated_at:new Date().toISOString()}).eq("family_id",fid));
        for(const a of F.accounts){
          const p=o.acc[a.id];
          if(!p){if(a.role==="child"&&(mineFam?isP:admin)){await RXL.fn({action:"create_child",display_name:a.name,username:a.username,password:a.password,family_id:fid});reload=true}continue}
          if(a.avatar!==p.avatar||a.theme!==p.theme)await RXL.q(RXL.sb().from("profiles").update({avatar:a.avatar,theme:a.theme}).eq("id",a.id));
          if(!!a.allowSharing!==p.allowSharing)await RXL.q(RXL.sb().from("profiles").update({allow_sharing:!!a.allowSharing}).eq("id",a.id));
          if(a.name!==p.name){if(a.id===meA.id)await WebApps.updateProfile({display_name:a.name});else await RXL.fn({action:"rename",user_id:a.id,display_name:a.name})}
          if((a.photo||"")!==p.photo){if(a.id===meA.id)await WebApps.updateProfile({avatar:a.photo||null});else await RXL.fn({action:"set_photo",user_id:a.id,photo:a.photo||null})}
          if(a.password&&a.id!==meA.id){await RXL.fn({action:"set_password",user_id:a.id,password:a.password});delete a.password}
        }
        for(const id of Object.keys(o.acc))if(!F.accounts.some(a=>a.id===id)){await RXL.fn({action:"remove",user_id:id});reload=true}
        for(const [kid,d] of Object.entries(F.kidData)){
          if(!o.acc[kid])continue;                 /* a new kid: their record is made with their account */
          if(JSON.stringify(d)===o.kid[kid])continue;
          if(kid===meA.id||(mineFam&&isP))await RXL.q(RXL.sb().from("kid_state").upsert({child_id:kid,data:d,updated_at:new Date().toISOString()}));
        }
      }
      for(const f of old.families){
        const now=S.families.find(x=>x.id===f.id);
        if(!now){if(admin){await RXL.q(RXL.sb().from("families").delete().eq("id",f.id));reload=true}continue}
        if(now.approve!==f.approve&&(f.id===S.sessionFam?isP:admin))await RXL.q(RXL.sb().from("families").update({require_share_approval:!!now.approve}).eq("id",f.id));
      }
      const mine=S.sessionFam,key=l=>l.from+">"+l.to;
      for(const l of old.links){const n=S.links.find(x=>key(x)===key(l));
        if(!n){if(l.status==="pending"&&l.to===mine)await RXL.rpc("respond_link",{p_family:l.from,p_accept:false});else if(l.status==="active")await RXL.rpc("disconnect_family",{p_family:l.from===mine?l.to:l.from});reload=true}
        else if(l.status==="pending"&&n.status==="active"&&l.to===mine){await RXL.rpc("respond_link",{p_family:l.from,p_accept:true});reload=true}}
      for(const s of S.shares){const o=old.shares[s.id];
        if(!o){const r=await RXL.rpc("send_video",{p_video:s.video,p_to:s.toId});reload=true;continue}
        if(o.status==="waiting"&&s.status!=="waiting"){await RXL.rpc("decide_share",{p_share:s.id,p_approve:s.status==="delivered"});reload=true}
        if((s.reaction||null)!==o.reaction)await RXL.rpc("react_share",{p_share:s.id,p_emoji:s.reaction||""});
        if(s.seenAt&&!o.seen)await RXL.rpc("mark_seen",{p_share:s.id});
      }
      RXL.snap=RXL.snapshot();
    }catch(e){toast(RXL.msg(e.message));reload=true}
    RXL.busy=false;
    if(reload)await RXL.reload();
  },
  async reload(){try{await RXL.load()}catch(e){toast(RXL.msg(e.message))}renderNav();try{go(tab)}catch(e){boot()}},
  async connect(code){try{const st=await RXL.rpc("connect_family",{p_code:code});toast(st==="active"?"Connected":"Request sent. Their parent needs to accept.");await RXL.reload()}catch(e){return e.message}},
  async removeVideoEverywhere(key){await RXL.rpc("admin_remove_video",{p_key:key});toast("Video removed from Remix");await RXL.reload()},
};

function renderLogin(msg){
  const el=$("#login"),g=RXL.gate||"signin";
  const logo=`<div class="tree rxlogo" aria-hidden="true"><svg viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#0B0B12"/><path d="M21 21 L60 41 L21 61 Z" fill="#FF3D7F" opacity=".85"/><path d="M31 30 L70 50 L31 70 Z" fill="#FFD60A" opacity=".8"/><path d="M41 39 L80 59 L41 79 Z" fill="#00D4FF" opacity=".8"/></svg></div>`;
  const body={
    signin:`<p class="lede">Sign in with your Web Apps account.</p>
      <form class="stack" id="rxIn" novalidate><input id="rxU" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Username" aria-label="Username">
      <input id="rxP" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password"><p class="msg bad" id="rxMsg">${esc(msg||"")}</p><button class="btn" type="submit">Sign in</button></form>
      <p class="hint">No account yet? <a href="../" style="color:var(--accent)">Create one on Web Apps</a>, then ask to join Remix.</p>`,
    join:`<p class="lede">Remix is by request. An admin approves each family.</p><p><button class="btn" id="rxJoin" style="width:100%">Request to join Remix</button></p><p class="msg" id="rxMsg"></p><p><button class="btn ghost" id="rxOut" style="width:100%">Sign out</button></p>`,
    pending:`<p class="lede">Your request to join Remix is waiting for an admin to approve it.</p><p><button class="btn ghost" id="rxCheck" style="width:100%">Check again</button></p><p><button class="btn ghost" id="rxOut" style="width:100%">Sign out</button></p>`,
    setup:`<p class="lede">Welcome, ${esc(WebApps.me&&WebApps.me.display_name||"")}! Set up your family to get started.</p>
      <form class="stack" id="rxSetup" novalidate><input id="rxFam" maxlength="40" placeholder="Your family's last name" aria-label="Family name"><p class="msg bad" id="rxMsg"></p>
      <button class="btn" type="submit">Create family</button></form><p class="hint">You'll be the family's parent. Add your kids from the Family tab, and other parents from Me.</p>
      <p><button class="btn ghost" id="rxOut" style="width:100%">Sign out</button></p>`,
    error:`<p class="lede">Couldn't load Remix.</p><p class="msg bad">${esc(RXL.err||"")}</p><p><button class="btn" id="rxCheck" style="width:100%">Try again</button></p>`
  }[g];
  el.innerHTML=`<div class="login">${logo}<h1>Remix</h1>${body}</div>`;
  $("#rxIn")?.addEventListener("submit",async e=>{e.preventDefault();const m=$("#rxMsg");m.textContent="";
    try{await WebApps.signIn($("#rxU").value,$("#rxP").value);await RXL.start()}catch(x){m.textContent=x.message}});
  $("#rxJoin")?.addEventListener("click",async()=>{try{await WebApps.join("remix");await RXL.start()}catch(x){$("#rxMsg").textContent=x.message}});
  $("#rxCheck")?.addEventListener("click",()=>RXL.start());
  $("#rxOut")?.addEventListener("click",async()=>{await WebApps.signOut();RXL.start()});
  $("#rxSetup")?.addEventListener("submit",async e=>{e.preventDefault();const m=$("#rxMsg");
    try{await RXL.rpc("create_family",{p_name:$("#rxFam").value});await RXL.start()}catch(x){m.textContent=RXL.msg(x.message)}});
}

window.__rx={RXL,get S(){return S},get tab(){return tab},me,kids,myFam,myVideos,shareTargets,curKid};
RXL.start();
})();
</script>
</body>
</html>
