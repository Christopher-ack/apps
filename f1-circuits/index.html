<style>
:root{
  --paper:#15151E;
  --paper-2:#0E0E15;
  --surface:#1E1E2A;
  --surface-2:#252533;
  --ink:#F3F3F6;
  --ink-soft:#9B9BAC;
  --ink-faint:#6A6A7C;
  --rule:#2E2E3E;
  --rule-soft:#262634;
  --red:#E10600;
  --red-deep:#B30500;
  --red-soft:#3A1418;
  --asphalt:#DCDCE6;
  --asphalt-edge:#0B0B12;
  --shadow:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 520px at 18% -8%, #22222F 0%, transparent 62%),
    var(--paper);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4,.cond{font-family:"Barlow Condensed","IBM Plex Sans",system-ui,sans-serif;font-weight:600}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:2px}
.wrap{max-width:1360px;margin:0 auto;padding:0 20px 64px}

/* ── masthead ─────────────────────────────── */
.masthead{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;padding:26px 0 16px}
.brand{display:flex;align-items:baseline;gap:11px;margin-right:auto;position:relative;padding-left:18px}
.brand::before{
  content:"";position:absolute;left:0;top:2px;bottom:5px;width:6px;
  background:var(--red);border-radius:1px;
  transform:skewX(-14deg);
}
.brand h1{font-size:33px;line-height:1;margin:0;font-weight:700;letter-spacing:-.01em}
.kerb{
  height:4px;border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--red) 0 16px,#F3F3F6 16px 32px);
  opacity:.9;
}

.picker{display:flex;align-items:stretch;gap:8px}
.picker label{position:absolute;left:-9999px}
select#circuitSelect{
  appearance:none;-webkit-appearance:none;
  font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:600;
  color:var(--ink);background-color:var(--surface);
  border:1px solid var(--rule);border-radius:4px;
  padding:8px 40px 8px 14px;min-width:300px;max-width:100%;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--red) 50%),linear-gradient(135deg,var(--red) 50%,transparent 50%);
  background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;
  background-size:6px 6px,6px 6px;background-repeat:no-repeat;
}
select#circuitSelect option{background:var(--surface);color:var(--ink)}

/* ── kpi pills ────────────────────────────── */
.pills{display:flex;flex-wrap:wrap;gap:8px;padding:18px 0}
.pill{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--rule);
  border-radius:100px;padding:5px 14px 5px 11px;font-size:13px;color:var(--ink-soft);white-space:nowrap;
}
.pill b{font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:600;color:var(--ink)}
.pill.flagpill{background:var(--red-soft);border-color:#4A1A1E}
.pill.flagpill b{color:#fff}
.pill .em{font-size:15px;line-height:1}

/* ── layout ───────────────────────────────── */
.grid{display:grid;grid-template-columns:minmax(0,2.6fr) minmax(280px,1fr);gap:24px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:1fr}}

/* ── track sits straight on the page ──────── */
.canvas{position:relative;padding:4px 0 10px}
.canvas .meta{
  position:absolute;left:2px;top:0;font-family:"Barlow Condensed",sans-serif;
  font-size:14px;color:var(--ink-faint);font-weight:500;pointer-events:none;
}
.canvas .dir{
  position:absolute;right:2px;top:0;font-family:"Barlow Condensed",sans-serif;
  font-size:14px;color:var(--ink-faint);font-weight:500;pointer-events:none;
}
svg.track{display:block;width:100%;height:auto;max-height:66vh}
.trk-shadow{fill:none;stroke:var(--shadow);stroke-linecap:round;stroke-linejoin:round}
.trk-edge{fill:none;stroke:var(--asphalt-edge);stroke-linecap:round;stroke-linejoin:round}
.trk-road{fill:none;stroke:var(--asphalt);stroke-linecap:round;stroke-linejoin:round}
.trk-line{fill:none;stroke:#8B8B9C;stroke-linecap:round;stroke-dasharray:1 26;opacity:.7}
.cnr circle{fill:var(--paper);stroke:var(--ink-faint);stroke-width:1.5;cursor:pointer}
.cnr text{
  font-family:"Barlow Condensed",sans-serif;font-size:15px;font-weight:600;fill:var(--ink);
  text-anchor:middle;dominant-baseline:central;pointer-events:none;
}
.cnr.hot circle{fill:var(--red);stroke:#fff;stroke-width:2}
.cnr.hot text{fill:#fff}
.sf line{stroke:var(--red);stroke-width:6;stroke-linecap:butt}
.sf text{font-family:"Barlow Condensed",sans-serif;font-size:13px;font-weight:700;fill:var(--red)}
@media (prefers-reduced-motion:no-preference){
  .drawin{animation:draw .9s ease-out forwards}
  @keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
  .cnr,.sf{animation:fade .45s ease-out both;animation-delay:.75s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
}

/* ── tabs, now inside a tile ──────────────── */
.tabs{
  margin-top:8px;background:var(--surface);border:1px solid var(--rule);
  border-radius:8px;overflow:hidden;
}
.tablist{display:flex;gap:0;border-bottom:1px solid var(--rule);overflow-x:auto;background:var(--surface-2)}
.tab{
  flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;
  padding:11px 18px;cursor:pointer;color:var(--ink-soft);
  font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:600;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red);background:var(--surface)}
.panel{padding:20px 20px 22px;max-width:74ch}
.panel p{margin:0 0 12px}
.panel h4{margin:20px 0 8px;font-size:18px}
.panel .lede{font-size:16px}
.panel ul{margin:0;padding-left:20px}
.panel ul li{margin-bottom:7px}

.cornerlist{list-style:none;margin:0;padding:0;columns:2;column-gap:28px}
@media (max-width:640px){.cornerlist{columns:1}}
.cornerlist li{
  break-inside:avoid;display:flex;gap:10px;align-items:baseline;
  padding:4px 8px;border-bottom:1px solid var(--rule-soft);border-radius:3px;
}
.cornerlist li:hover,.cornerlist li.hot{background:var(--red-soft)}
.cornerlist .n{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;min-width:26px;color:var(--red)}
.cornerlist .nm{color:var(--ink)}
.cornerlist .nm.none{color:var(--ink-faint)}

table.rec{width:100%;border-collapse:collapse;font-size:14px}
table.rec th{
  text-align:left;font-family:"Barlow Condensed",sans-serif;font-size:14px;font-weight:600;
  color:var(--ink-soft);border-bottom:1px solid var(--rule-soft);padding:7px 8px 7px 0;
}
table.rec td{padding:7px 8px 7px 0;border-bottom:1px solid var(--rule-soft)}

/* ── cards ────────────────────────────────── */
.cards{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 16px 16px;position:relative}
.card h3{
  margin:0 0 10px;font-size:16px;color:var(--ink-soft);font-weight:600;
  padding-bottom:8px;border-bottom:1px solid var(--rule);
}
.card h3::before{
  content:"";display:inline-block;width:3px;height:12px;background:var(--red);
  margin-right:8px;vertical-align:-1px;border-radius:1px;
}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;margin:0}
.dl dt{color:var(--ink-soft)}
.dl dd{margin:0;text-align:right;font-weight:500}
.dl dd small{display:block;font-weight:400;color:var(--ink-faint);font-size:12px}

.winners{list-style:none;margin:0;padding:0}
.winners li{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule-soft)}
.winners li:last-child{border-bottom:0;padding-bottom:0}
.winners .yr{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;min-width:38px;color:var(--ink-faint)}
.winners .drv{font-weight:500}
.winners .team{margin-left:auto;font-size:12px;color:var(--ink-faint);text-align:right}
.winners li.latest .yr{color:var(--red)}


.bigstat .t{font-family:"Barlow Condensed",sans-serif;font-size:36px;font-weight:700;line-height:1;color:#fff}
.card .sub{font-size:13px;color:var(--ink-soft);margin:8px 0 0}

</style>
</head>

 racing:"There is only one straightforward passing spot, the run into the Turn 16 chicane, so track position is worth a great deal. The Esses punish anyone following closely because dirty air costs so much in rapid direction changes. Sustained lateral load usually forces at least two stops.",
 history:"Suzuka was built by Honda in 1962 as a test track, laid out by Dutch designer John Hugenholtz, and is the only figure-of-eight circuit in Formula 1 \u2014 the back straight passes under the Esses on a flyover. It has hosted more title deciders than any other venue, including Senna and Prost's collisions in 1989 and 1990, and is almost universally named by drivers as their favourite lap of the year. It remains Honda property to this day, the only circuit on the calendar owned outright by a car manufacturer.",
 layout:"The first sector is the challenge: the Esses are a series of linked direction changes taken in fourth and fifth gear where a single early apex ruins the next four corners. 130R is a genuine flat-out left at over 300 km/h, and the Casio Triangle chicane that follows is the only real overtaking opportunity besides the main straight.",

 history:"Laid out through the car parks of the Hard Rock Stadium, Miami arrived in 2022 as Formula 1's second US race and immediately became the most heavily marketed weekend of the season. The first edition was criticised for a fake marina with plastic boats and a low-grip surface; grip has improved every year as rubber has gone down, and the racing has followed.",
 layout:"Three long straights make up most of the lap, joined by a slow, walled middle sector under the freeway bridges. Turns 11 to 16 are a tight, awkward set of switchbacks where the cars are never settled \u2014 lose time there and the straight that follows is wasted.",

 racing:"Passing is straightforward into the Turn 10 hairpin and the final chicane, both at the end of long acceleration zones. This is the hardest circuit of the year on brakes, and cooling or brake-by-wire trouble regularly decides the result. Safety cars are close to a certainty, which makes a well-timed stop enormously valuable.",
 history:"Built on the \u00cele Notre-Dame, an artificial island made for Expo 67, the circuit opened in 1978 and Gilles Villeneuve won the inaugural race for Ferrari in front of his home crowd. It was renamed after his death in 1982. Montreal is a low-downforce, stop-start layout that is unusually hard on brakes and famous for producing chaotic, safety-car-strewn races. The pit and paddock buildings were rebuilt from scratch for 2019 after years of complaints that they were the worst in the championship.",
 layout:"Heavy braking dominates: the Senna Curve at Turn 1, the hairpin at Turn 10, and the final chicane that leads onto the pit straight. The exit wall at that last chicane carries the painted words 'Bienvenue au Qu\u00e9bec' and has caught out so many champions that it is simply called the Wall of Champions.",

 racing:"Overtaking on track is effectively impossible, so the race is decided in qualifying and in the pit window. The mandatory two-stop rule introduced in 2025 forces teams to play the timing game rather than settle into a train. The pit loss is the smallest of the season, which makes an early stop under a safety car especially cheap.",
 history:"The Monaco Grand Prix was first run in 1929 and has been on the World Championship calendar since its first season in 1950. The layout has barely changed in ninety years, which means modern cars race on a road built for machines a third of their width. It is the slowest, narrowest and most demanding lap of the year, and a pole position here is worth more than at any other track.",
 layout:"There is nowhere to hide. The climb from Sainte D\u00e9vote to Casino Square is blind and uphill, the Grand Hotel Hairpin is the slowest corner in Formula 1 at around 45 km/h, and the tunnel is the only place where a car reaches top speed. Overtaking is close to impossible, so strategy and qualifying decide the race \u2014 which is why a mandatory two-stop rule was introduced in 2025.",

 racing:"The long run to Turn 1 is the main overtaking chance now that the final chicane has gone. Two decades of testing mean every team knows the circuit intimately, so set-ups converge and qualifying gaps shrink. Front-left degradation through the long Turn 3 and Turn 9 right-handers is the defining tyre problem.",
 history:"Opened in 1991 for the Spanish Grand Prix, Barcelona became Formula 1's default test venue for two decades, which is why every driver on the grid knows it better than their own street. With Madrid taking over the Spanish Grand Prix title in 2026, Catalunya stayed on the calendar under a new name \u2014 the Barcelona-Catalunya Grand Prix \u2014 giving Spain two rounds for the first time since 1991. From 2028 the circuit alternates with Spa-Francorchamps under a rotation deal, appearing in even-numbered years only.",
 layout:"A proper aerodynamic test: a fast, loaded first sector, a technical middle, and a slow final section that punishes any car that cannot ride kerbs. The chicane at the end of the lap was removed in 2023, restoring the flat-out Turn 14 sweep and making the run to Turn 1 far more useful for overtaking.",
 w:[{y:2026,d:"Lewis Hamilton",t:"Ferrari"},{y:2025,d:"Oscar Piastri",t:"McLaren"},{y:2024,d:"Max Verstappen",t:"Red Bull"},{y:2023,d:"Max Verstappen",t:"Red Bull"},{y:2022,d:"Max Verstappen",t:"Red Bull"}],
 facts:["Michael Schumacher won six Spanish Grands Prix here.","Fernando Alonso's first home win came in 2006.","2026 was Hamilton's first Grand Prix victory in Ferrari red.","Nigel Mansell and Ayrton Senna ran wheel to wheel down the main straight at over 300 km/h in 1991, sparks pouring from both cars.","Michael Schumacher won the 1996 race in torrential rain by 45 seconds, in a Ferrari nobody rated."]

 racing:"Stowe and the run into Village are the overtaking spots, but the lap is defined by Maggotts-Becketts, where dirty air bites hardest. Front-left tyre load is the highest of the season and the late failures of 2020 are still the reference point. The site is exposed, so rain can fall on one part of the lap and not another.",
 history:"Silverstone hosted the first ever World Championship race on 13 May 1950, on a wartime bomber airfield with straw bales for barriers. It has been reconfigured many times, most significantly in 2010 when the Arena loop was added and the start line moved to the Wellington Straight. It remains the fastest full-length lap on the calendar by average speed, and the British crowd \u2014 around half a million across the weekend \u2014 is the largest of the year. The circuit is owned by the British Racing Drivers' Club, whose members bought it outright in 1971, and a deal signed in 2024 keeps the Grand Prix there until 2034.",
 layout:"Maggotts-Becketts-Chapel is the signature: a sequence of high-speed direction changes taken at over 250 km/h that loads the tyres harder than anything else in the season. Overtaking happens at Stowe and into Village. The circuit is unusually exposed, so weather can swing a race completely.",

 facts:["Lewis Hamilton has won the British Grand Prix nine times.","The original layout used the airfield's perimeter roads.","Hamilton's 2024 victory ended a 945-day win drought.","King George VI attended the 1950 race, the only time a reigning British monarch has been present at a Formula 1 Grand Prix.","Nigel Mansell's 1987 pass on Nelson Piquet at Stowe, after a dummy down the Hangar Straight, is the most replayed moment in the race's history."]

 history:"The original Spa was a 14 km road circuit through the Ardennes forest and was lethally fast; it was dropped after 1970 and replaced in 1983 by the shortened 7 km layout still used today. Even cut in half it is the longest track on the calendar. In 2022 the gravel traps and barriers at Raidillon were substantially rebuilt after a fatal junior-category crash. A rotation agreement signed in 2026 means Spa now holds its race in odd-numbered years, sharing the slot with Barcelona.",
 layout:"Eau Rouge and Raidillon form a compression at the bottom of a valley followed by a blind uphill left, taken flat in a modern car but never comfortable. The Kemmel Straight that follows is the best overtaking spot in Formula 1. Because the lap is so long, one end of the circuit can be soaking wet while the other is dry.",

 racing:"The banked final corner exists to let cars carry speed onto the main straight, which makes Tarzan at Turn 1 the one reliable overtaking spot. Elsewhere the circuit is too narrow and too blind to pass. Sand blown off the dunes changes grip between sessions and sometimes between laps.",
 history:"Zandvoort was laid out through the dunes in 1948 using roads built during the German occupation, and hosted Grands Prix until 1985 before losing a chunk of its length to a caravan park. Formula 1 returned in 2021 on a revised layout featuring two banked corners \u2014 Hugenholtz at 18 degrees and the final Arie Luyendyk at 19 \u2014 designed to let cars run side by side. The 2026 race was announced as the last of the current contract.",
 layout:"Narrow, undulating and almost entirely blind. Scheivlak at Turn 7 is a downhill right taken at over 250 km/h with a wall waiting on exit. The banked final corner lets drivers carry far more speed onto the main straight, which is the whole point \u2014 it is the only place overtaking really works.",
 w:[{y:2026,d:"Lando Norris",t:"McLaren"},{y:2025,d:"Oscar Piastri",t:"McLaren"},{y:2024,d:"Lando Norris",t:"McLaren"},{y:2023,d:"Max Verstappen",t:"Red Bull"},{y:2022,d:"Max Verstappen",t:"Red Bull"}],
 facts:["The banking at Turn 3 is steep enough that cars cannot stop on it safely.","Sand blowing off the dunes changes grip levels between sessions.","2026 is scheduled to be the final Dutch Grand Prix of the current deal.","Niki Lauda's final Formula 1 victory came here in 1985, beating team-mate Alain Prost by three tenths.","The circuit lost part of its length to a caravan park during its years away from the championship."]

 mw:{d:"Michael Schumacher",n:5}, fw:{d:"Giuseppe Farina",y:1950},
 racing:"Slipstreaming is so effective that qualifying becomes a game of finding a tow, and the race often settles into a queue of cars into the first chicane, nobody quite able to break clear. Braking from over 340 km/h for the Rettifilo is the heaviest deceleration of the season. Minimum downforce leaves the cars nervous over the kerbs at the Roggia and Ascari.",
 history:"Monza opened in 1922 and is the third-oldest purpose-built racing circuit still in use. The crumbling banked oval, abandoned after 1961, still stands in the park and crosses over the modern track. Nicknamed the Temple of Speed, it has the highest average speed of any circuit on the calendar, and the post-race invasion of the main straight by Ferrari fans is one of the sport's fixed rituals. A full resurfacing and a rebuilt pit complex were completed across 2024 and 2025, the most significant work done to the circuit since the 1970s.",
 layout:"Teams run their lowest-downforce package of the year, with cars spending roughly 80% of the lap at full throttle. Braking for the Rettifilo chicane from over 340 km/h is the heaviest deceleration of the season. Slipstreaming works so well here that qualifying often turns into a game of who can find a tow.",

 facts:["The 2003 race averaged 247.6 km/h, still the fastest Grand Prix ever run.","Peter Gethin won the 1971 race by 0.01s in a five-car photo finish.","The old banking is still standing, disused, inside the park.","Ferrari finished first and second here in 1988, three weeks after Enzo Ferrari's death, in the only race McLaren failed to win that season.","The original circuit was built in 110 days in 1922, including the banked oval."]

 racing:"The long straight into Turn 1 and the exit of the banked section are the designated passing zones, though the inaugural race suggested the tighter street portions leave little room to run side by side. Track evolution is dramatic on a surface this new. With one race of data, strategy is still being learned.",

 racing:"The 2.2 km run to Turn 1 produces the largest slipstream effect on the calendar, and leading onto that straight is frequently a disadvantage. The castle section demands a car that will turn in a 7.6 m gap, which pulls directly against the low-drag set-up the straight wants. Safety cars are close to guaranteed.",

 layout:"The 2.2 km run from Turn 16 to Turn 1 along the seafront means top speeds over 350 km/h and a slipstream so strong that leading into the final sector is often a disadvantage. The castle section between Turns 8 and 10 climbs and narrows sharply, and the walls there have ended many races.",

 racing:"Turns 1, 7 and 14 are the passing spots, but a tow is hard to sustain with this many direction changes. The pit loss is the longest of the season, so the safety car is the dominant strategic factor. Two hours of walls, humidity and roughly 80 gear changes a lap make this the most physically demanding race of the year.",
 history:"Singapore hosted Formula 1's first night race in 2008, run entirely under 1,600 floodlights so that European television audiences could watch at a normal hour. It is consistently the most physically punishing race of the year \u2014 humidity near 80%, ambient temperature over 30\u00b0C, and a two-hour race distance. A 2023 revision removed the slow Turns 16 to 19 under the Bay Grandstand and replaced them with a long straight.",
 layout:"Bumpy, walled and relentless, with no meaningful run-off and a very high safety car probability. The 2023 changes cut about 20 seconds from the lap and gave the final sector a proper acceleration zone, but overtaking still mostly happens at Turns 1, 7 and 14.",
 w:[{y:2025,d:"George Russell",t:"Mercedes"},{y:2024,d:"Lando Norris",t:"McLaren"},{y:2023,d:"Carlos Sainz",t:"Ferrari"},{y:2022,d:"Sergio P\u00e9rez",t:"Red Bull"},{y:2019,d:"Sebastian Vettel",t:"Ferrari"}],
 facts:["Drivers can lose up to 3 kg of body weight over the race.","Sainz's 2023 win ended Red Bull's 15-race winning streak.","The circuit runs past the Singapore Flyer and City Hall.","The 2008 race was decided by a deliberate crash: Nelson Piquet Jr put his Renault into the wall to trigger a safety car that handed the win to team-mate Fernando Alonso.","Around 1,600 floodlights light the circuit, arranged so that rain does not produce glare on the racing line."]

 racing:"Turn 12 at the end of the back straight is the main passing place, with Turn 1 available to anyone brave on the uphill approach. The surface has subsided over old lignite workings and the resulting bumps force compromised ride heights — two cars were disqualified for plank wear in 2023. The Esses reward a car that is stable on entry.",
 history:"Circuit of the Americas opened in 2012 as the first purpose-built Formula 1 facility in the United States, on rolling ranch land outside Austin. Its designers deliberately quoted famous corners from elsewhere \u2014 the Turn 3\u20136 Esses echo Silverstone's Maggotts-Becketts, and the Turn 16\u201318 sequence borrows from Istanbul's Turn 8. The surface has famously subsided over old lignite seams, leaving bumps that teams complain about every year.",
 layout:"Turn 1 is a blind 40-metre climb to a hairpin, the steepest gradient on any current start line. The Esses that follow are a rhythm test where a modern car is barely settled. Turn 12, at the end of the long back straight, is the primary overtaking spot.",

 racing:"The run to Turn 1 is close to 900 metres and the braking zone is wide enough for three cars abreast, which it regularly holds. Thin air cuts downforce by roughly a quarter and leaves cooling marginal, so engine and brake temperatures dominate team radio. Rear graining through the stadium section is the usual limitation.",
 history:"Named for brothers Ricardo and Pedro Rodr\u00edguez, the circuit first hosted a Grand Prix in 1963. Formula 1 returned in 2015 after a 23-year absence, with the old Peraltada banked corner cut short and the lap routed through the Foro Sol baseball stadium instead \u2014 a section that gives the race its unmistakable atmosphere. At 2,240 metres it is by far the highest venue on the calendar.",
 layout:"Thin air means roughly a quarter less aerodynamic downforce and much less cooling, so teams run their steepest wing angles of the year and still have Monza-like straight-line speeds. The run to Turn 1 is close to 900 metres and produces some of the season's boldest passes.",

 facts:["The highest-altitude circuit in Formula 1 at 2,240 m.","Cars run maximum downforce yet still hit over 350 km/h.","The stadium section seats around 30,000 fans.","Ricardo Rodríguez, one of the two brothers the circuit is named for, was killed here in practice in 1962, aged twenty.","The original Peraltada was a banked 180-degree final corner taken at over 300 km/h; Nigel Mansell passed Gerhard Berger around its outside in 1990."]

 racing:"The uphill run from Junção to Turn 1 is a long acceleration zone, which makes the slipstream unusually powerful on a lap this short. The Senna S genuinely accepts an inside line, so passes happen at both ends of the straight. Weather off the Atlantic is unpredictable and has produced some of the sport's most chaotic races.",
 history:"Interlagos opened in 1940 and once ran to nearly 8 km before being shortened in 1990. It is one of only a handful of anti-clockwise circuits in Formula 1 and is built on genuinely steep ground, so the lap constantly climbs and drops. Renamed in 1985 for Jos\u00e9 Carlos Pace, it has hosted an unusual number of championship-deciding races and is widely regarded as producing the best racing of the season.",
 layout:"The lap is short \u2014 barely 70 seconds \u2014 and the whole final sector is an uphill acceleration zone from Junç\u00e3o all the way to Turn 1, which makes the slipstream enormously powerful. The Senna S at the start is a downhill left-right where the inside line is genuinely available.",

 facts:["Verstappen won from 17th on the grid in the 2024 wet race.","Hamilton passed 25 cars across sprint and race weekend in 2021.","Felipe Massa was world champion here for 38 seconds in 2008.","The name means 'between the lakes' — the land was bought for housing but two reservoirs made it unsuitable, so a circuit was built instead.","Ayrton Senna won his first home Grand Prix here in 1991 with the car stuck in sixth gear, and had to be lifted from the cockpit."]

 racing:"Two enormous straights and minimum downforce make this a slipstreaming circuit, with passing into Turn 14 and Turn 1. The real problem is temperature: racing at night in the desert leaves the surface cold and green, and switching tyres on for a single qualifying lap is the weekend's central puzzle. Front-left graining early in a stint is common.",
 history:"Formula 1 raced in Las Vegas car parks in 1981 and 1982, then returned in 2023 on a purpose-built street layout that runs 1.9 km straight down the Strip past the Bellagio, Caesars Palace and the Sphere. It is promoted by Formula 1 itself rather than a local organiser. The first practice session was abandoned after two laps when a loose drain cover destroyed Carlos Sainz's car, and the rescheduled session eventually ran at 2:30 am.",

 facts:["The race starts at 10 pm local time on a Saturday.","Verstappen clinched the 2024 drivers' title here.","The Strip straight is one of the longest flat-out sections of the year.","Formula 1 first raced in Las Vegas in the Caesars Palace car park in 1981, on an anti-clockwise layout that decided Nelson Piquet's first world title.","The Strip section is closed to traffic only in the small hours, so the circuit is assembled and dismantled nightly across the race weekend."]

 layout:"A fast, flowing sequence of medium and high-speed corners with almost no slow sections, which means constant lateral load and very high tyre stress. The main straight is the only place a following car can properly deploy. Desert sand blowing across the circuit keeps grip levels moving all weekend.",

 racing:"The long straight into Turn 5 is the main overtaking place, and the 2021 reprofiling of the hairpin and marina section measurably improved the racing. The race begins in daylight and finishes under floodlights, so track temperature falls steadily and grip improves through the evening. As the finale, it often turns into a strategy free-for-all.",

 layout:"Two long straights joined by a heavy braking zone form the overtaking half of the lap; the second half winds through the marina and under the hotel. The 2021 changes banked and widened the final section, and the sunset transition means grip and engine performance both shift during the race.",

 layout:"Three long straights, each ending in a heavy braking zone, define the lap — Turns 1, 4 and 11 are all first- or second-gear stops after big deceleration. The middle sector is tighter and rear-limited. The surface is unusually abrasive, which combined with high track temperature makes this the most degradation-driven race of the year.",

 racing:"Three long acceleration runs and the sprint to Turn 1 make passing possible, but the blind, walled sequence through the middle of the lap leaves almost no margin and visibility over crests is poor. Safety cars and red flags are frequent and have decided the outcome more than once. Track evolution overnight is dramatic on a surface used only once a year.",

 history:"Jeddah was built along the Red Sea corniche in under eight months and hosted its first Grand Prix in December 2021, a race that produced two red flags, a negotiated position swap and a collision between the two title contenders. At 6.174 km it is the second-longest circuit on the calendar and by some margin the fastest street track ever used in Formula 1. Its 2026 edition was cancelled because of the regional conflict; it returns as round two in 2027. It was always intended as a temporary home: a permanent circuit at Qiddiya, in the hills above Riyadh, is being built to take the race later this decade.",
 layout:"Twenty-seven corners, most of them flat or near-flat, strung together by walls that sit close enough to make the lap feel like a single continuous sweep. Several corners are banked to let cars carry speed. Average lap speed is around 250 km/h, higher than anywhere except Monza.",

 racing:"The long back straight into the Turn 12 hairpin is the main overtaking place, with Turn 1 available on the opening lap. Turn 8 punishes the front-left tyre harder than any single corner in the sport and often dictates stint length. The 2020 resurfacing left the track notoriously slippery in the wet; how much it has rubbered in since will shape the 2027 race.",

<script>
(function(){
"use strict";
const SVGNS="http://www.w3.org/2000/svg";
const VW=1000, MIN_AR=1.35, MAX_AR=2.6;
const $=id=>document.getElementById(id);
const el=(n,a)=>{const e=document.createElementNS(SVGNS,n);for(const k in (a||{}))e.setAttribute(k,a[k]);return e;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let idx=0, tab=0, hot=null;
const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ── geometry ─────────────────────────────── */
/* Frame each circuit snugly: pad the bounding box, clamp the aspect so a very
   tall layout doesn't produce a 2000px-tall panel, then scale to a 1000-wide
   viewBox so stroke widths and marker sizes stay consistent between tracks. */
function fit(pts){
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  for(const [x,y] of pts){minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);}
  let w=maxX-minX||1, h=maxY-minY||1;
  const pad=Math.max(w,h)*0.075;
  minX-=pad; maxX+=pad; minY-=pad; maxY+=pad;
  w=maxX-minX; h=maxY-minY;
  let ar=w/h;
  if(ar<MIN_AR){const nw=h*MIN_AR, d=(nw-w)/2; minX-=d; maxX+=d; w=nw;}
  else if(ar>MAX_AR){const nh=w/MAX_AR, d=(nh-h)/2; minY-=d; maxY+=d; h=nh;}
  const s=VW/w, H=h*s;
  return {pts:pts.map(([x,y])=>[(x-minX)*s,(y-minY)*s]), h:H};
}
/* The survey points are dense enough to draw straight — smoothing them would
   round off chicanes that are genuinely square. */
function pathOf(p){
  let d="M "+p[0][0].toFixed(1)+" "+p[0][1].toFixed(1);
  for(let i=1;i<p.length;i++) d+=" L "+p[i][0].toFixed(1)+" "+p[i][1].toFixed(1);
  return d+" Z";
}
/* Find the N sharpest bends along the lap and return them in racing order. */
function findCorners(path,count){
  const L=path.getTotalLength(), N=900, S=[];
  for(let i=0;i<N;i++)S.push(path.getPointAtLength(L*i/N));
  const w=Math.max(3,Math.round(N/200)), k=new Array(N);
  for(let i=0;i<N;i++){
    const a=S[(i-w+N)%N],b=S[i],c=S[(i+w)%N];
    const ux=b.x-a.x,uy=b.y-a.y,vx=c.x-b.x,vy=c.y-b.y;
    k[i]=Math.abs(Math.atan2(ux*vy-uy*vx,ux*vx+uy*vy));
  }
  const sm=new Array(N);
  for(let i=0;i<N;i++){let t=0;for(let j=-2;j<=2;j++)t+=k[(i+j+N)%N];sm[i]=t/5;}
  let R=Math.max(4,Math.floor(N/(count*5))), peaks=[];
  while(R>=2){
    peaks=[];
    for(let i=0;i<N;i++){
      let top=true;
      for(let j=-R;j<=R;j++){if(j&&sm[(i+j+N)%N]>sm[i]+1e-9){top=false;break;}}
      if(top)peaks.push({i:i,v:sm[i]});
    }
    if(peaks.length>=count)break;
    R=Math.floor(R/2);
  }
  peaks.sort((a,b)=>b.v-a.v);
  const keep=peaks.slice(0,count).sort((a,b)=>a.i-b.i);
  let cx=0,cy=0;for(const p of S){cx+=p.x;cy+=p.y;}cx/=N;cy/=N;
  return keep.map(p=>{
    const b=S[p.i], a=S[(p.i-8+N)%N], c=S[(p.i+8)%N];
    let nx=-(c.y-a.y), ny=(c.x-a.x);
    const m=Math.hypot(nx,ny)||1; nx/=m; ny/=m;
    if((b.x-cx)*nx+(b.y-cy)*ny<0){nx=-nx;ny=-ny;}
    return {x:b.x+nx*25,y:b.y+ny*25};
  });
}

/* ── track drawing ────────────────────────── */
let cornerNodes=[];
function drawTrack(c){
  const svg=$("trackSvg");
  while(svg.firstChild)svg.removeChild(svg.firstChild);
  svg.appendChild(el("title")).textContent=c.name+" track layout";
  const F=fit(c.pts), d=pathOf(F.pts);
  svg.setAttribute("viewBox","0 0 "+VW+" "+F.h.toFixed(0));

  const shadow=el("path",{d:d,class:"trk-shadow","stroke-width":26,transform:"translate(3,5)"});
  const edge  =el("path",{d:d,class:"trk-edge","stroke-width":25});
  const road  =el("path",{d:d,class:"trk-road","stroke-width":19});
  const line  =el("path",{d:d,class:"trk-line","stroke-width":2});
  svg.appendChild(shadow);svg.appendChild(edge);svg.appendChild(road);svg.appendChild(line);

  if(!reduced){
    const len=road.getTotalLength();
    [edge,road].forEach(n=>{
      n.style.setProperty("--len",len);
      n.style.strokeDasharray=len;
      n.style.strokeDashoffset=len;
      n.classList.add("drawin");
    });
  }

  /* start / finish line */
  const L=road.getTotalLength();
  const s0=road.getPointAtLength(0), s1=road.getPointAtLength(Math.min(14,L*0.01));
  let tx=s1.x-s0.x, ty=s1.y-s0.y; const tm=Math.hypot(tx,ty)||1; tx/=tm; ty/=tm;
  const nx=-ty, ny=tx;
  const g=el("g",{class:"sf"});
  g.appendChild(el("line",{x1:s0.x-nx*15,y1:s0.y-ny*15,x2:s0.x+nx*15,y2:s0.y+ny*15}));
  const lab=el("text",{x:s0.x+nx*30,y:s0.y+ny*30,"text-anchor":"middle","dominant-baseline":"central"});
  lab.textContent="START";
  g.appendChild(lab);
  svg.appendChild(g);

  cornerNodes=[];
  findCorners(road,c.corners).forEach((pt,i)=>{
    const n=i+1;
    const gg=el("g",{class:"cnr",tabindex:"0",role:"button"});
    gg.appendChild(el("circle",{cx:pt.x,cy:pt.y,r:12.5}));
    const t=el("text",{x:pt.x,y:pt.y+.5}); t.textContent=n; gg.appendChild(t);
    const nm=c.cn&&c.cn[n];
    const ti=el("title"); ti.textContent="Turn "+n+(nm?" \u2014 "+nm:""); gg.appendChild(ti);
    gg.addEventListener("mouseenter",()=>setHot(n));
    gg.addEventListener("mouseleave",()=>setHot(null));
    gg.addEventListener("focus",()=>setHot(n));
    gg.addEventListener("blur",()=>setHot(null));
    gg.addEventListener("click",()=>{
      if(tab!==1){tab=1;renderTabs(c);}
      setHot(n);
      const li=document.querySelector('.cornerlist li[data-n="'+n+'"]');
      if(li)li.scrollIntoView({block:"nearest",behavior:reduced?"auto":"smooth"});
    });
    svg.appendChild(gg);
    cornerNodes[n]=gg;
  });

  $("canvasMeta").textContent=c.name;
  $("canvasDir").textContent=c.dir+" \u00b7 "+c.corners+" corners";
}
function setHot(n){
  if(hot&&cornerNodes[hot])cornerNodes[hot].classList.remove("hot");
  document.querySelectorAll(".cornerlist li.hot").forEach(e=>e.classList.remove("hot"));
  hot=n;
  if(n&&cornerNodes[n])cornerNodes[n].classList.add("hot");
  if(n){const li=document.querySelector('.cornerlist li[data-n="'+n+'"]');if(li)li.classList.add("hot");}
}

/* ── chrome ───────────────────────────────── */
function renderPills(c){
  const pills=[
    ['<span class="em">'+c.flag+'</span>','',esc(c.country),"flagpill"],
    ["","Lap",c.km.toFixed(3)+" km"],
    ["","Corners",String(c.corners)],
    ["","Laps",String(c.laps)],
    ["","Race",(c.km*c.laps).toFixed(1)+" km"],
    ["","First GP",String(c.first)]
  ];
  $("pills").innerHTML=pills.map(p=>
    '<span class="pill '+(p[3]||"")+'">'+(p[0]||"")+(p[1]?p[1]+" ":"")+'<b>'+p[2]+'</b></span>').join("");
}

const TABS=["History","Layout","Racing","Trivia"];
function renderTabs(c){
  $("tablist").innerHTML=TABS.map((t,i)=>
    '<button class="tab" role="tab" data-i="'+i+'" aria-selected="'+(i===tab)+'">'+t+'</button>').join("");
  $("tablist").querySelectorAll("button").forEach(b=>
    b.addEventListener("click",()=>{tab=+b.dataset.i;renderTabs(c);}));
  $("panel").innerHTML=panelHTML(c);
  if(tab===1){
    document.querySelectorAll(".cornerlist li").forEach(li=>{
      li.addEventListener("mouseenter",()=>setHot(+li.dataset.n));
      li.addEventListener("mouseleave",()=>setHot(null));
    });
  }
}
function panelHTML(c){
  if(tab===0) return '<p class="lede">'+esc(c.history)+'</p>';
  if(tab===1){
    let li="";
    for(let n=1;n<=c.corners;n++){
      const nm=c.cn&&c.cn[n];
      li+='<li data-n="'+n+'"><span class="n">'+n+'</span><span class="nm'+(nm?"":" none")+'">'+(nm?esc(nm):"unnamed")+'</span></li>';
    }
    return '<p>'+esc(c.layout)+'</p><h4>Corner by corner</h4><ul class="cornerlist">'+li+'</ul>';
  }
  if(tab===2){
    const n=c.num;
    return '<p class="lede">'+esc(c.racing)+'</p>'+
      '<h4>What the lap asks for</h4>'+
      '<table class="rec"><tbody>'+
      row("Full throttle","~"+n.ft+"% of the lap")+
      row("Longest straight",n.straight+" m")+
      row("Top speed","~"+n.vmax+" km/h")+
      row("Gear changes","~"+n.gears+" per lap")+
      row("Downforce level",n.df)+
      row("Brake load",n.brakes)+
      row("Pit lane time loss","~"+n.pit+" s")+
      row("Safety car likelihood",n.sc)+
      '</tbody></table>';
  }
  return '<ul>'+c.facts.map(f=>"<li>"+esc(f)+"</li>").join("")+'</ul>';
}

function row(k,v){return '<tr><th scope="row">'+esc(k)+'</th><td style="text-align:right">'+esc(v)+'</td></tr>';}

function renderCards(c){
  const winners=c.w.map((w,i)=>
    '<li'+(i===0?' class="latest"':'')+'><span class="yr">'+w.y+'</span><span class="drv">'+esc(w.d)+'</span><span class="team">'+esc(w.t)+'</span></li>').join("");

  $("cards").innerHTML=
    card("Circuit stats",
      '<dl class="dl">'+
      dd("Location",esc(c.city)+"<small>"+esc(c.country)+"</small>")+
      dd("Lap length",c.km.toFixed(3)+" km")+
      dd("Corners",c.corners)+
      dd("First Grand Prix",c.first)+
      dd("Direction",c.dir)+
      dd("Elevation",esc(c.elev))+
      dd("Race distance",(c.km*c.laps).toFixed(1)+" km <small>"+c.laps+" laps</small>")+
      '</dl>')+
    card("Recent winners",'<ul class="winners">'+winners+'</ul>'+
      (c.w.length<5?'<p class="sub">Only '+c.w.length+' edition'+(c.w.length===1?'':'s')+' on record.</p>':''))+
    card("Fastest race lap",
      '<div class="bigstat"><span class="t">'+esc(c.record.t)+'</span></div>'+
      '<p class="sub">'+esc(c.record.who)+(c.record.yr?", "+c.record.yr:"")+'</p>')+
    card("In the record books",
      '<dl class="dl">'+
      dd("Most wins here",esc(c.mw.d)+"<small>"+c.mw.n+(c.mw.n===1?" win":" wins")+"</small>")+
      dd("First winner",esc(c.fw.d)+"<small>"+c.fw.y+"</small>")+
      dd("Lap record",esc(c.record.t)+"<small>"+esc(c.record.who)+(c.record.yr?", "+c.record.yr:"")+"</small>")+
      '</dl>');
}
function card(h,b){return '<section class="card"><h3>'+h+'</h3>'+b+'</section>';}
function dd(k,v){return "<dt>"+k+"</dt><dd>"+v+"</dd>";}

/* ── wiring ───────────────────────────────── */
function select(i){
  idx=(i+CIRCUITS.length)%CIRCUITS.length;
  const c=CIRCUITS[idx];
  hot=null;
  $("circuitSelect").value=String(idx);
  renderPills(c); drawTrack(c); renderTabs(c); renderCards(c);
  try{localStorage.setItem("cf:last",c.id);}catch(e){}
}
function init(){
  CIRCUITS.sort((a,b)=>a.name.localeCompare(b.name,"en"));
  $("circuitSelect").innerHTML=CIRCUITS.map((c,i)=>
    '<option value="'+i+'">'+esc(c.name)+" \u2014 "+esc(c.country)+'</option>').join("");
  $("circuitSelect").addEventListener("change",e=>select(+e.target.value));
  let start=0;
  try{
    const last=localStorage.getItem("cf:last");
    if(last){const j=CIRCUITS.findIndex(c=>c.id===last); if(j>=0)start=j;}
  }catch(e){}
  select(start);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
